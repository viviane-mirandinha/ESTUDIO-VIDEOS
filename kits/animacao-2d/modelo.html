<!doctype html>
<html lang="pt"><head><meta charset="UTF-8" /><meta name="viewport" content="width=__W__, height=__H__" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"CinzelX";src:url(data:font/woff;base64,__F_CINZEL__) format("woff");font-weight:700}
@font-face{font-family:"CaveatX";src:url(data:font/ttf;base64,__F_CAVEAT__) format("truetype");font-weight:700}
html,body{margin:0;padding:0;width:__W__px;height:__H__px;overflow:hidden;background:#151415}
#root{position:relative;width:__W__px;height:__H__px;overflow:hidden;background:#151415}
.sc{position:absolute;left:0;top:0;width:1280px;height:720px;opacity:0;overflow:hidden}
.sc>svg{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.ttl{position:absolute;left:0;width:1280px;text-align:center;font-family:CinzelX,serif;font-weight:700;color:#f1e8d6;letter-spacing:.14em;opacity:0}
.hand{position:absolute;font-family:CaveatX,cursive;font-weight:700;color:#3a2e22;opacity:0;white-space:nowrap}
.tag{position:absolute;background:#151415;color:#fff;font-family:CinzelX,serif;font-weight:700;padding:8px 20px;font-size:26px;border-radius:6px;letter-spacing:.1em;opacity:0;white-space:nowrap}
.bal{position:absolute;background:#fbf6ea;border:3px solid #3a2e22;border-radius:26px;padding:10px 22px;font-family:CaveatX,cursive;font-weight:700;font-size:38px;color:#3a2e22;opacity:0;white-space:nowrap}
.vig{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:50;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%)}
.grao{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:49;mix-blend-mode:multiply;opacity:.55;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .26 0 0 0 0 .2 0 0 0 .2 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>")}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
<div id="stage"></div><div class="vig"></div><div class="grao"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
window.__timelines["main"] = tl;
// LINT (regra 4 do README): animar x/y num elemento SVG que já tem translate(...) ≠ 0 no atributo joga o elemento para outro lugar.
// (guarda o atributo ORIGINAL na 1ª vez que o elemento aparece numa animação, pois o GSAP o reescreve depois)
window.__avisosAnim=[]; const __orig0=new WeakMap();
["fromTo","to","from","set"].forEach(mt=>{ const orig=tl[mt].bind(tl); tl[mt]=function(t,...a){ try{
  const els=typeof t==="string"?[...document.querySelectorAll(t)]:(t instanceof Element?[t]:[...(t||[])]);
  els.forEach(e=>{ if(e&&e.getAttribute&&!__orig0.has(e)) __orig0.set(e,e.getAttribute("transform")||""); });
  const hasXY=[a[0],a[1]].some(v=>v&&typeof v==="object"&&(("x" in v)||("y" in v)));
  if(hasXY) els.forEach(e=>{ const tr=__orig0.get(e)||""; const mm=tr.match(/translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/);
    if(mm&&(parseFloat(mm[1])!==0||parseFloat(mm[2])!==0)) window.__avisosAnim.push(`x/y animado em <${e.tagName}> que já tem translate(${mm[1]},${mm[2]}) no atributo: ${typeof t==="string"?t:(e.id||e.getAttribute("class")||"")} — envolva num <g> interno`); });
  }catch(err){} return orig(t,...a); }; });
const EDIT = __EDIT__;
const stage = document.getElementById("stage");
const CENAS = {};
/*__MOTOR__*/
/*__CENARIOS__*/
/*__CENAS__*/
// ---------- montagem ----------
EDIT.items.filter(i=>i.type==="scene" && i.by==="template" && !i.hidden).forEach(it=>{
  const id=it.id, S=it.start, D=it.dur; const sc=document.createElement("div"); sc.className="sc"; sc.id=id; stage.appendChild(sc);
  CENAS[it.props.scene](id,S,D,it.props.params||{});
  tl.set(`#${id}`,{opacity:1},S); if(it.props.entrada==="fade") tl.fromTo(`#${id}`,{opacity:0},{opacity:1,duration:.5,ease:"none"},S); tl.set(`#${id}`,{opacity:0},S+D);   /* corte SECO por padrão (74% dos cortes do original); props.entrada:"fade" para capítulo */
});
tl.to("#stage",{opacity:0,duration:.35,ease:"none"},EDIT.duration-.35);
</script>
<!--__ITEMS_SCRIPT__-->
</body></html>
