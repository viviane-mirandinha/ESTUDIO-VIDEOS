<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>The Paper Rocket</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-latin-900-normal.ttf") format("truetype"); font-weight: 900; font-style: normal; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-latin-600-normal.ttf") format("truetype"); font-weight: 600; font-style: normal; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-latin-600-italic.ttf") format("truetype"); font-weight: 600; font-style: italic; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f1430; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0f1430; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene svg.art { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .words {
        position: absolute; left: 140px; right: 140px; text-align: center;
        font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 84px; line-height: 1.08;
        letter-spacing: -0.01em; color: #2a1d3a;
      }
      .words .w { display: inline-block; opacity: 0; margin: 0 0.12em; }
      .words.light { color: #fff6e6; text-shadow: 0 4px 16px rgba(10, 8, 40, 0.45); }
      .words.dark { text-shadow: 0 3px 0 rgba(255, 255, 255, 0.55); }
      #defs { position: absolute; width: 0; height: 0; }
      #fx { position: absolute; inset: 0; pointer-events: none; }
      #fx svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37" data-width="1920" data-height="1080">
      <svg id="defs" aria-hidden="true">
        <defs>
          <filter id="felt" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="warp" />
            <feDisplacementMap in="SourceGraphic" in2="warp" scale="5" xChannelSelector="R" yChannelSelector="G" result="shape" />
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="fib" />
            <feDiffuseLighting in="fib" surfaceScale="2.4" lighting-color="#ffffff" result="lit">
              <feDistantLight azimuth="235" elevation="58" />
            </feDiffuseLighting>
            <feComponentTransfer in="lit" result="lit2">
              <feFuncR type="linear" slope="0.5" intercept="0.62" />
              <feFuncG type="linear" slope="0.5" intercept="0.62" />
              <feFuncB type="linear" slope="0.5" intercept="0.62" />
            </feComponentTransfer>
            <feComposite in="lit2" in2="shape" operator="in" result="litA" />
            <feBlend in="shape" in2="litA" mode="multiply" result="tex" />
            <feDropShadow in="tex" dx="0" dy="6" stdDeviation="5" flood-color="#21123a" flood-opacity="0.32" />
          </filter>
          <filter id="paper" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="7" result="fib" />
            <feDiffuseLighting in="fib" surfaceScale="1.2" lighting-color="#ffffff" result="lit">
              <feDistantLight azimuth="235" elevation="65" />
            </feDiffuseLighting>
            <feComponentTransfer in="lit" result="lit2">
              <feFuncR type="linear" slope="0.3" intercept="0.78" />
              <feFuncG type="linear" slope="0.3" intercept="0.78" />
              <feFuncB type="linear" slope="0.3" intercept="0.78" />
            </feComponentTransfer>
            <feComposite in="lit2" in2="SourceGraphic" operator="in" result="litA" />
            <feBlend in="SourceGraphic" in2="litA" mode="multiply" result="tex" />
            <feDropShadow in="tex" dx="0" dy="7" stdDeviation="6" flood-color="#1b1030" flood-opacity="0.25" />
          </filter>
          <filter id="bg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="2" result="fib" />
            <feDiffuseLighting in="fib" surfaceScale="1" lighting-color="#ffffff" result="lit">
              <feDistantLight azimuth="235" elevation="70" />
            </feDiffuseLighting>
            <feComponentTransfer in="lit" result="lit2">
              <feFuncR type="linear" slope="0.25" intercept="0.82" />
              <feFuncG type="linear" slope="0.25" intercept="0.82" />
              <feFuncB type="linear" slope="0.25" intercept="0.82" />
            </feComponentTransfer>
            <feComposite in="lit2" in2="SourceGraphic" operator="in" result="litA" />
            <feBlend in="SourceGraphic" in2="litA" mode="multiply" />
          </filter>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="10" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
      </svg>

      <div class="scene clip" id="s1" data-start="0" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s2" data-start="2" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s3" data-start="4" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s4" data-start="6" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s5" data-start="8" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s6" data-start="10" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s7" data-start="12" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s8" data-start="14" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s9" data-start="16" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s10" data-start="18" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s11" data-start="20" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s12" data-start="22" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s13" data-start="24" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s14" data-start="26" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s15" data-start="28" data-duration="2" data-track-index="0"></div>
      <div class="scene clip" id="s16" data-start="30" data-duration="7" data-track-index="0"></div>
      <div id="fx" class="clip" data-start="0" data-duration="37" data-track-index="1" data-layout-allow-overflow></div>
      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="37" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      // ------------------------------------------------------------------ data
      const W = __WORDS__;
      const TOTAL = 37;
      const SPANS = [[0, 3], [4, 8], [9, 13], [14, 18], [19, 24], [25, 27], [28, 29], [30, 33], [34, 38], [39, 41],
                     [42, 45], [46, 49], [50, 57], [58, 62], [63, 70], [71, 86]];
      const START = SPANS.map(([a], i) => (i === 0 ? 0 : +(W[a].t - 0.16).toFixed(3)));
      const END = START.map((s, i) => (i < START.length - 1 ? START[i + 1] : TOTAL));

      // ------------------------------------------------------------------ kit
      const NS = "http://www.w3.org/2000/svg";
      function E(tag, a = {}, parent) {
        const e = document.createElementNS(NS, tag);
        for (const k in a) e.setAttribute(k, a[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      function G(parent, a = {}) { return E("g", a, parent); }
      let seed = 1234567;
      function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
      function R(a, b) { return a + (b - a) * rnd(); }

      const C = {
        ink: "#2a1d3a", cream: "#fff6e6", stitch: "#fff3dc", fox: "#f28a2e", foxDark: "#d4691c", white: "#fffaf0",
        grass1: "#7fcf6e", grass2: "#5cb85c", grass3: "#46a24f",
        red: "#ef5b5b", teal: "#2ec4b6", yellow: "#ffd23f", pink: "#ff8fab", purple: "#9b7bd8", navy: "#1b2453",
        card: "#d9a566", cardDark: "#b98446", tape: "#d9d4c7", moon: "#efe7d2", moonDark: "#d8ccb0",
      };

      function scene(id) {
        const host = document.getElementById(id);
        const svg = E("svg", { class: "art", viewBox: "0 0 1920 1080" }, host);
        const cam = G(svg);
        return { host, svg, cam };
      }
      let gid = 0;
      function bgRect(parent, top, bottom) {
        const id = "lg" + gid++;
        const lg = E("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, E("defs", {}, parent));
        E("stop", { offset: "0", "stop-color": top }, lg);
        E("stop", { offset: "1", "stop-color": bottom }, lg);
        return E("rect", { x: -200, y: -200, width: 2320, height: 1480, fill: `url(#${id})`, filter: "url(#bg)" }, parent);
      }
      // felt piece: shape + optional running stitch inset toward its centre
      function felt(parent, tag, a, fill, stitch = true, inset = 0.9) {
        const g = G(parent, { filter: "url(#felt)" });
        const s = E(tag, Object.assign({ fill }, a), g);
        if (stitch) {
          const st = E(tag, Object.assign({}, a, { fill: "none", stroke: typeof stitch === "string" ? stitch : C.stitch,
            "stroke-width": 4, "stroke-dasharray": "11 9", "stroke-linecap": "round", opacity: 0.9 }), g);
          const bb = s.getBBox();
          const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
          const prev = a.transform ? a.transform + " " : "";
          st.setAttribute("transform", `${prev}translate(${cx} ${cy}) scale(${inset}) translate(${-cx} ${-cy})`);
        }
        return g;
      }
      function paper(parent, tag, a, fill) { const g = G(parent, { filter: "url(#paper)" }); E(tag, Object.assign({ fill }, a), g); return g; }
      function bead(parent, x, y, r, col = "#1a1420") {
        const g = G(parent);
        E("circle", { cx: x, cy: y, r, fill: col }, g);
        E("circle", { cx: x - r * 0.35, cy: y - r * 0.35, r: r * 0.32, fill: "#ffffff", opacity: 0.85 }, g);
        return g;
      }
      // puffy cloud: big rounded bumps (large arcs) on a flat base
      function cloudPath(x, y, w, h) {
        const n = 4, c = w / n, base = y + h;
        let d = `M${x} ${base} L${x} ${base - h * 0.35}`;
        for (let i = 0; i < n; i++) {
          const r = c * (i === 1 || i === 2 ? 0.72 : 0.6);
          d += ` A${r.toFixed(1)} ${r.toFixed(1)} 0 1 1 ${(x + c * (i + 1)).toFixed(1)} ${(base - h * 0.35).toFixed(1)}`;
        }
        return d + ` L${x + w} ${base} Z`;
      }
      function cloud(parent, x, y, w, h, fill = "#ffffff") { return felt(parent, "path", { d: cloudPath(x, y, w, h) }, fill, true, 0.88); }
      function star5(cx, cy, ro, ri = ro * 0.46, n = 5) {
        let d = "";
        for (let i = 0; i < n * 2; i++) {
          const r = i % 2 ? ri : ro, a = -Math.PI / 2 + (i * Math.PI) / n;
          d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
        }
        return d + "Z";
      }
      function flower(parent, x, y, col) {
        const g = G(parent, { transform: `translate(${x} ${y})` });
        E("rect", { x: -4, y: 0, width: 8, height: 90, fill: C.grass3, rx: 4 }, g);
        const head = G(g);
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI) / 3;
          felt(head, "ellipse", { cx: 22 * Math.cos(a), cy: 22 * Math.sin(a), rx: 18, ry: 18 }, col, false);
        }
        felt(head, "circle", { cx: 0, cy: 0, r: 14 }, C.yellow, false);
        return { g, head };
      }
      function hills(parent, y, col, amp, shift = 0) {
        let d = `M-100 1180 L-100 ${y}`;
        for (let x = -100; x <= 2020; x += 40) d += ` L${x} ${(y - amp * Math.sin((x + shift) / 260) - amp * 0.4 * Math.sin((x + shift) / 97)).toFixed(1)}`;
        d += " L2020 1180 Z";
        return felt(parent, "path", { d }, col, true, 1.0);
      }

      // Pip the fox (origin = feet centre, ~330 px tall at s=1)
      function makePip(parent, x, y, s = 1, opts = {}) {
        const g = G(parent, { transform: `translate(${x} ${y}) scale(${s})` });
        const inner = G(g);
        const tail = G(inner);
        felt(tail, "path", { d: "M40 -70 C150 -90 190 -190 120 -250 C150 -170 90 -130 30 -110 Z" }, C.fox);
        felt(tail, "path", { d: "M120 -250 C150 -215 150 -185 132 -165 C128 -200 118 -225 104 -238 Z" }, C.white, false);
        felt(inner, "ellipse", { cx: 0, cy: -80, rx: 72, ry: 82 }, C.fox);
        felt(inner, "ellipse", { cx: -6, cy: -62, rx: 40, ry: 54 }, C.white, false);
        felt(inner, "ellipse", { cx: -34, cy: -6, rx: 30, ry: 14 }, C.foxDark, false);
        felt(inner, "ellipse", { cx: 34, cy: -6, rx: 30, ry: 14 }, C.foxDark, false);
        const head = G(inner);
        const earL = G(head), earR = G(head);
        felt(earL, "path", { d: "M-70 -220 L-92 -318 L-22 -250 Z" }, C.fox);
        felt(earL, "path", { d: "M-68 -236 L-82 -296 L-40 -254 Z" }, "#5a3a2a", false);
        felt(earR, "path", { d: "M70 -220 L92 -318 L22 -250 Z" }, C.fox);
        felt(earR, "path", { d: "M68 -236 L82 -296 L40 -254 Z" }, "#5a3a2a", false);
        felt(head, "path", { d: "M-96 -205 C-96 -275 96 -275 96 -205 C96 -170 40 -140 0 -132 C-40 -140 -96 -170 -96 -205 Z" }, C.fox);
        felt(head, "path", { d: "M-78 -186 C-40 -192 -14 -175 0 -150 C14 -175 40 -192 78 -186 C60 -150 30 -134 0 -132 C-30 -134 -60 -150 -78 -186 Z" }, C.white, false);
        bead(head, -36, -206, 11);
        bead(head, 36, -206, 11);
        E("ellipse", { cx: 0, cy: -152, rx: 13, ry: 9, fill: "#2a1d24" }, head);
        felt(head, "circle", { cx: -58, cy: -172, r: 11 }, C.pink, false);
        felt(head, "circle", { cx: 58, cy: -172, r: 11 }, C.pink, false);
        if (opts.goggles !== false) {
          E("rect", { x: -95, y: -258, width: 190, height: 14, rx: 7, fill: "#3a6e8f" }, head);
          felt(head, "circle", { cx: -34, cy: -252, r: 24 }, "#7fd3e8", "#2f5f7a", 0.8);
          felt(head, "circle", { cx: 34, cy: -252, r: 24 }, "#7fd3e8", "#2f5f7a", 0.8);
        }
        const arm = G(inner);
        felt(arm, "ellipse", { cx: -66, cy: -112, rx: 20, ry: 48, transform: "rotate(28 -66 -112)" }, C.foxDark, false);
        return { g, inner, head, tail, arm, earL, earR };
      }

      // Cardboard rocket (origin = base centre, ~570 px tall at s=1)
      function makeRocket(parent, x, y, s = 1, opts = {}) {
        const g = G(parent, { transform: `translate(${x} ${y}) scale(${s})` });
        const inner = G(g);
        const flame = G(inner);
        felt(flame, "path", { d: "M-55 0 C-50 90 -15 150 0 210 C15 150 50 90 55 0 Z" }, "#ff9f1c", false);
        felt(flame, "path", { d: "M-30 0 C-28 60 -8 100 0 140 C8 100 28 60 30 0 Z" }, C.yellow, false);
        const body = G(inner);
        felt(body, "path", { d: "M-150 -20 L-95 -150 L-95 -10 Z" }, opts.painted ? C.teal : C.cardDark);
        felt(body, "path", { d: "M150 -20 L95 -150 L95 -10 Z" }, opts.painted ? C.teal : C.cardDark);
        felt(body, "rect", { x: -100, y: -400, width: 200, height: 400, rx: 18 }, C.card, true, 0.94);
        const paint = G(body);
        felt(paint, "rect", { x: -100, y: -120, width: 200, height: 46 }, C.red, false);
        felt(paint, "rect", { x: -100, y: -60, width: 200, height: 22 }, C.yellow, false);
        felt(paint, "circle", { cx: -62, cy: -350, r: 14 }, C.pink, false);
        felt(paint, "circle", { cx: 66, cy: -180, r: 12 }, C.teal, false);
        const tape = G(body);
        E("rect", { x: -100, y: -212, width: 200, height: 26, fill: C.tape, opacity: 0.92, filter: "url(#paper)" }, tape);
        E("rect", { x: -14, y: -400, width: 28, height: 400, fill: C.tape, opacity: 0.75, filter: "url(#paper)" }, tape);
        const cone = G(inner);
        felt(cone, "path", { d: "M-108 -396 C-90 -470 -40 -540 0 -570 C40 -540 90 -470 108 -396 Z" }, opts.painted ? C.red : C.cardDark);
        const port = G(inner);
        felt(port, "circle", { cx: 0, cy: -290, r: 58 }, "#c9d1d8", false);
        E("circle", { cx: 0, cy: -290, r: 44, fill: "#9fdcf2" }, port);
        let pilot = null;
        if (opts.pip) {
          const cp = "cp" + gid++;
          const cpe = E("clipPath", { id: cp }, E("defs", {}, port));
          E("circle", { cx: 0, cy: -290, r: 44 }, cpe);
          const holder = G(port, { "clip-path": `url(#${cp})` });
          pilot = makePip(holder, 0, -150, 0.42, {});
        }
        E("circle", { cx: -16, cy: -308, r: 9, fill: "#ffffff", opacity: 0.7 }, port);
        if (!opts.painted) gsap.set([paint, cone], { opacity: 0 });
        gsap.set(flame, { opacity: opts.flame ? 1 : 0, transformOrigin: "50% 0%" });
        return { g, inner, flame, paint, tape, cone, body, port, pilot };
      }
      function puff(parent, x, y, r) { return felt(parent, "circle", { cx: x, cy: y, r }, "#ffffff", false); }

      // story words (HTML) inside a scene, popped in on the narration's word times
      function words(host, span, opts = {}) {
        const div = document.createElement("div");
        div.className = "words " + (opts.light ? "light" : "dark");
        div.style.top = (opts.top ?? 70) + "px";
        if (opts.size) div.style.fontSize = opts.size + "px";
        if (opts.weight) div.style.fontWeight = opts.weight;
        if (opts.italic) div.style.fontStyle = "italic";
        if (opts.left !== undefined) div.style.left = opts.left + "px";
        host.appendChild(div);
        const spans = [];
        for (let i = span[0]; i <= span[1]; i++) {
          let txt = (opts.map && opts.map[i]) || W[i].w;
          if (txt === "–") txt = "—";
          const sp = document.createElement("span");
          sp.className = "w";
          sp.textContent = txt;
          if (opts.color && opts.color[i]) sp.style.color = opts.color[i];
          div.appendChild(sp);
          div.appendChild(document.createTextNode(" "));
          spans.push([sp, W[i].t]);
        }
        return spans;
      }
      function popWords(tl, spans, big = false) {
        spans.forEach(([sp, t]) => {
          tl.fromTo(sp, { opacity: 0, y: 26, scale: big ? 0.4 : 0.7, rotation: R(-6, 6) },
            { opacity: 1, y: 0, scale: 1, rotation: 0, duration: big ? 0.38 : 0.32, ease: "back.out(2.6)" }, t - 0.05);
        });
      }
      function push(tl, cam, i, from = 1, to = 1.07, ox = "50%", oy = "50%") {
        tl.fromTo(cam, { scale: from }, { scale: to, duration: END[i] - START[i] + 0.05, ease: "none", transformOrigin: `${ox} ${oy}` }, START[i]);
      }
      function shake(tl, el, t, dur = 0.4, amp = 14) {
        const n = Math.max(2, Math.round(dur / 0.04));
        for (let k = 0; k < n; k++) {
          const f = 1 - k / n;
          tl.to(el, { x: R(-amp, amp) * f, y: R(-amp, amp) * f, duration: 0.04, ease: "none" }, t + k * 0.04);
        }
        tl.to(el, { x: 0, y: 0, duration: 0.04 }, t + n * 0.04);
      }
      function wobble(tl, el, t0, t1, amp, period, prop = "y") {
        let k = 0;
        for (let t = t0; t < t1 - 1e-6; t += period / 2, k++) tl.to(el, { [prop]: k % 2 ? -amp : amp, duration: period / 2, ease: "sine.inOut" }, t);
      }
      function flicker(tl, flame, t0, t1) {
        const n = Math.ceil((t1 - t0) / 0.07);
        for (let k = 0; k < n; k++) tl.to(flame, { scaleY: k % 2 ? 0.75 : 1.3, scaleX: k % 2 ? 1.05 : 0.92, duration: 0.07, ease: "none" }, t0 + k * 0.07);
      }

      const tl = gsap.timeline({ paused: true });

      // ================================================================= SCENES
      // 1 · Once upon a time — sun rises over felt hills
      {
        const { host, cam } = scene("s1");
        bgRect(cam, "#7fd0f5", "#ffe2b8");
        const sun = G(cam);
        const rays = G(sun);
        for (let i = 0; i < 12; i++) {
          const a = (i * Math.PI) / 6;
          felt(rays, "path", { d: `M${960 + 150 * Math.cos(a - 0.12)} ${620 + 150 * Math.sin(a - 0.12)} L${960 + 235 * Math.cos(a)} ${620 + 235 * Math.sin(a)} L${960 + 150 * Math.cos(a + 0.12)} ${620 + 150 * Math.sin(a + 0.12)} Z` }, "#ffb627", false);
        }
        felt(sun, "circle", { cx: 960, cy: 620, r: 130 }, C.yellow);
        const cl1 = cloud(cam, 120, 250, 420, 130), cl2 = cloud(cam, 1400, 320, 380, 120);
        hills(cam, 820, C.grass1, 40, 100);
        hills(cam, 900, C.grass2, 30, 600);
        const fl = [flower(cam, 300, 860, C.pink), flower(cam, 1580, 880, C.red), flower(cam, 1720, 850, C.purple)];
        const T = START[0];
        tl.fromTo(sun, { y: 420 }, { y: 0, duration: 1.2, ease: "back.out(1.4)" }, T);
        tl.fromTo(rays, { rotation: 0 }, { rotation: 40, smoothOrigin: false, svgOrigin: "960 620", duration: 2.2, ease: "none" }, T);

        const dust = [];
        for (let i = 0; i < 10; i++) dust.push(puff(cam, 960 + R(-300, 300), 880 + R(-20, 40), R(30, 60)));
        gsap.set(dust, { scale: 0.001, transformOrigin: "50% 50%" });
        const T = START[12], tB = W[53].t;
        tl.fromTo(rk.inner, { y: -1000 }, { y: 0, duration: tB - T, ease: "power2.in" }, T);
        flicker(tl, rk.flame, T, tB);
        tl.fromTo(rk.inner, { scaleX: 1, scaleY: 1 }, { scaleX: 1.18, scaleY: 0.8, smoothOrigin: false, svgOrigin: "0 0", duration: 0.08, yoyo: true, repeat: 3, ease: "power1.out" }, tB);
        tl.to(rk.flame, { opacity: 0, duration: 0.2 }, tB + 0.1);
        dust.forEach((d, i) => tl.fromTo(d, { scale: 0.001, opacity: 1, x: 0 }, { scale: 1.6, opacity: 0, x: R(-140, 140), duration: 0.9, ease: "power2.out" }, tB + i * 0.02));
        shake(tl, cam, tB, 0.35, 16);
        push(tl, cam, 12, 1.0, 1.06, "50%", "80%");
        const sp = words(host, SPANS[12], { top: 60, light: true, map: { 53: "bump!" }, color: { 53: C.yellow, 57: C.moon } });
        popWords(tl, sp);
        tl.to(sp[3][0], { y: -30, duration: 0.12, yoyo: true, repeat: 3, ease: "power2.out" }, tB + 0.3);
      }

      // 14 · Dreams are made to fly. — Pip plants a star flag, Earth rises
      {
        const { host, cam } = scene("s14");
        bgRect(cam, "#1b2156", "#3f3a8a");
        for (let i = 0; i < 50; i++) E("circle", { cx: R(0, 1920), cy: R(0, 700), r: R(2, 4), fill: "#fff6d8", opacity: R(0.5, 1) }, cam);
        const earth = G(cam);
        felt(earth, "circle", { cx: 960, cy: 820, r: 330 }, "#3d8bd9");
        felt(earth, "path", { d: "M780 640 C860 560 980 620 940 720 C900 800 800 780 780 700 Z" }, C.grass1, false);
        felt(earth, "path", { d: "M1040 780 C1120 760 1180 840 1120 900 C1060 940 1010 860 1040 780 Z" }, C.grass1, false);
        felt(cam, "path", { d: "M-100 1180 L-100 900 C400 840 1500 840 2020 900 L2020 1180 Z" }, C.moon, true, 1.0);
        makeRocket(cam, 1500, 930, 0.62, { painted: true, flame: false });
        const pip = makePip(cam, 700, 960, 0.85);
        const flag = G(cam);
        felt(flag, "rect", { x: 880, y: 560, width: 12, height: 400, rx: 6 }, "#cfd6de", false);
        const cloth = G(flag);
        felt(cloth, "path", { d: "M892 570 C980 550 1040 600 1120 580 L1120 700 C1040 720 980 670 892 690 Z" }, C.red);
        felt(cloth, "path", { d: star5(1005, 632, 34) }, C.yellow, false);
        const T = START[13], D = END[13] - START[13];
        tl.fromTo(earth, { y: 400 }, { y: 0, duration: D, ease: "power2.out" }, T);
        tl.fromTo(flag, { y: -600 }, { y: 0, duration: 0.45, ease: "bounce.out" }, T + 0.2);
        tl.fromTo(cloth, { skewY: -6 }, { skewY: 6, duration: 0.3, repeat: 8, yoyo: true, ease: "sine.inOut", smoothOrigin: false, svgOrigin: "892 630" }, T + 0.5);
        tl.fromTo(pip.inner, { y: 0 }, { y: -40, duration: 0.22, repeat: 5, yoyo: true, ease: "power1.out" }, T + 0.6);
        tl.fromTo(pip.arm, { rotation: 0 }, { rotation: -70, smoothOrigin: false, svgOrigin: "-50 -130", duration: 0.3, ease: "back.out(2)" }, T + 0.5);
        popWords(tl, words(host, SPANS[13], { top: 70, light: true, size: 100, italic: true, color: { 62: C.yellow } }), true);
      }

      // ================================================================= END CARDS
      function nightSky(cam) {
        bgRect(cam, "#141a45", "#2b2f6b");
        for (let i = 0; i < 70; i++) E("circle", { cx: R(0, 1920), cy: R(0, 1080), r: R(2, 4.5), fill: "#fff6d8", opacity: R(0.4, 1) }, cam);
        [[130, 260], [330, 120], [1600, 200], [1790, 340], [240, 470], [1700, 520]].forEach(([x, y]) => {
          E("line", { x1: x, y1: -20, x2: x, y2: y, stroke: "#e8dcc0", "stroke-width": 2, opacity: 0.7 }, cam);
          felt(cam, "path", { d: star5(x, y + 26, 26) }, C.yellow, false);
        });
      }
      // 15 · Everything you just saw was made by Claude.
      {
        const { host, cam } = scene("s15");
        nightSky(cam);
        const card = G(cam);
        [-330, 330].forEach((dx) => E("line", { x1: 960 + dx, y1: -400, x2: 960 + dx, y2: 330, stroke: "#e8dcc0", "stroke-width": 3 }, card));
        const pts = [];
        for (let x = 480; x <= 1440; x += 16) pts.push([x, 330 + R(-5, 5)]);
        for (let y = 330; y <= 760; y += 16) pts.push([1440 + R(-5, 5), y]);
        for (let x = 1440; x >= 480; x -= 16) pts.push([x, 760 + R(-5, 5)]);
        for (let y = 760; y >= 330; y -= 16) pts.push([480 + R(-5, 5), y]);
        paper(card, "path", { d: pts.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join("") + "Z" }, "#f6ead2");
        E("text", { x: 960, y: 500, "text-anchor": "middle", "font-family": "Fraunces", "font-weight": 600, "font-size": 70, fill: C.ink }, card).textContent = "Everything you just saw";
        const t2 = E("text", { x: 960, y: 620, "text-anchor": "middle", "font-family": "Fraunces", "font-weight": 600, "font-size": 70, fill: C.ink }, card);
        E("tspan", {}, t2).textContent = "was made by ";
        E("tspan", { "font-weight": 900, "font-size": 92, fill: "#c24d1a" }, t2).textContent = "Claude.";
        E("text", { x: 960, y: 702, "text-anchor": "middle", "font-family": "Fraunces", "font-style": "italic", "font-weight": 600, "font-size": 34, fill: "#9a3d1a", y: 716 }, card).textContent = "every scene · every character · every frame — in code";
        const T = START[14];
        tl.fromTo(card, { y: -1000 }, { y: 0, duration: 0.55, ease: "back.out(1.3)" }, T + 0.05);
        tl.fromTo(card, { rotation: 4 }, { rotation: 0, smoothOrigin: false, svgOrigin: "960 0", duration: 1.4, ease: "elastic.out(1, 0.35)" }, T + 0.4);
        tl.to(card, { y: -1100, duration: 0.35, ease: "power3.in" }, END[14] - 0.35);
        push(tl, cam, 14, 1.0, 1.04);
      }

      // 16 · Comment STORY
      {
        const { host, cam } = scene("s16");
        nightSky(cam);
        const T = START[15];
        const cm = G(cam);
        E("text", { x: 960, y: 290, "text-anchor": "middle", "font-family": "Fraunces", "font-style": "italic", "font-weight": 600, "font-size": 104, fill: C.cream, filter: "url(#paper)" }, cm).textContent = "Comment";
        tl.fromTo(cm, { y: -500 }, { y: 0, duration: 0.5, ease: "back.out(1.6)" }, Math.max(T, W[71].t - 0.25));
        const cols = ["#dc6530", "#f2c14e", "#e79a9a", "#7fb2e5", "#8ccb9b"];
        const widths = [215, 205, 250, 240, 225];
        const total = widths.reduce((a, b) => a + b, 0) + 4 * 46;
        let x = 960 - total / 2;
        "STORY".split("").forEach((ch, i) => {
          const cx = x + widths[i] / 2;
          const g = G(cam);
          E("line", { x1: cx, y1: -400, x2: cx, y2: 500, stroke: "#e8dcc0", "stroke-width": 3 }, g);
          const lt = G(g, { filter: "url(#felt)" });
          E("text", { x: cx, y: 720, "text-anchor": "middle", "font-family": "Fraunces", "font-weight": 900, "font-size": 300, fill: cols[i], "data-layout-allow-overlap": "" }, lt).textContent = ch;
          const t0 = W[72].t + i * 0.15;
          tl.fromTo(g, { y: -900 }, { y: 0, duration: 0.42, ease: "bounce.out" }, t0 - 0.3);
          tl.fromTo(g, { rotation: (i % 2 ? 1 : -1) * 8 }, { rotation: 0, smoothOrigin: false, svgOrigin: `${cx} 500`, duration: 1.6, ease: "elastic.out(1, 0.3)" }, t0 + 0.1);
          x += widths[i] + 46;
        });
        const strip = G(cam);
        paper(strip, "rect", { x: 330, y: 830, width: 1260, height: 92, rx: 4 }, "#f6ead2");
        E("text", { x: 960, y: 890, "text-anchor": "middle", "font-family": "Fraunces", "font-weight": 600, "font-size": 40, fill: C.ink }, strip).textContent = "and I'll send you the script, the guide & how to do this yourself.";
        tl.fromTo(strip, { y: 420, rotation: -4 }, { y: 0, rotation: 0, smoothOrigin: false, svgOrigin: "960 880", duration: 0.5, ease: "back.out(1.8)" }, W[73].t + 0.1);
        const mini = makeRocket(cam, 0, 0, 0.28, { painted: true, flame: true });
        tl.fromTo(mini.g, { x: -200, y: 1000, rotation: 60 }, { x: 2100, y: 640, rotation: 75, duration: 4.5, ease: "none" }, 31.6);
        flicker(tl, mini.flame, 31.6, 36.1);
        push(tl, cam, 15, 1.0, 1.04);
      }

      // ================================================================= WIPES (scallop paper panels at scene changes)
      {
        const fx = document.getElementById("fx");
        const svg = E("svg", { viewBox: "0 0 1920 1080" }, fx);
        function scallopPanel(col) {
          let d = "M0 -100 L2300 -100 L2300 1180 L0 1180";
          for (let y = 1180; y > -100; y -= 80) d += ` A40 40 0 0 1 0 ${y - 80}`;
          return E("path", { d: d + " Z", fill: col, filter: "url(#paper)" }, svg);
        }
        const plan = [[1, "#fff3dc"], [2, "#ffe6f0"], [3, "#ffe7b3"], [4, "#fff3dc"], [7, "#e6f6ff"], [8, "#d8efff"], [9, "#fff3dc"], [11, "#e9e3ff"], [13, "#fff3dc"], [14, "#f6ead2"]];
        plan.forEach(([i, col], k) => {
          const p = scallopPanel(col);
          const t = START[i];
          const fromRight = k % 2 === 0;
          tl.set(p, { x: fromRight ? 2000 : -2400 }, 0);
          tl.to(p, { x: fromRight ? -40 : -260, duration: 0.2, ease: "power2.in" }, t - 0.2);
          tl.to(p, { x: fromRight ? -2500 : 2000, duration: 0.24, ease: "power2.out" }, t);
        });
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
