<!--params {"veiculo":"O DIÁRIO","secao":"ECONOMIA","titulo":"Manchete","destaque":"","t_destaque":0,"rot":-2}-->
<div id="{{id}}" style="position:absolute;inset:0">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.45)"></div>
  <div class="pg" style="position:absolute;left:190px;top:110px;width:900px;background:#f3f0e8;color:#141414;padding:30px 46px 36px;box-shadow:0 26px 60px rgba(0,0,0,.6);font-family:Georgia,'Times New Roman',serif">
    <div style="text-align:center;font-size:44px;font-weight:700;letter-spacing:.06em;border-bottom:4px double #141414;padding-bottom:10px">{{p.veiculo}}</div>
    <div style="font-family:Inter,Arial;font-size:24px;font-weight:800;color:#b3261e;letter-spacing:.12em;margin:18px 0 8px">{{p.secao}}</div>
    <div class="tt" style="font-size:58px;font-weight:700;line-height:1.12"></div>
    <div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 30px">
      <div style="height:12px;background:#cfcabd"></div><div style="height:12px;background:#cfcabd"></div>
      <div style="height:12px;background:#cfcabd;width:90%"></div><div style="height:12px;background:#cfcabd;width:80%"></div>
      <div style="height:12px;background:#cfcabd;width:70%"></div><div style="height:12px;background:#cfcabd;width:85%"></div>
    </div>
  </div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}";
  const tt=document.querySelector(id+" .tt"), e=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const k=P.destaque?P.titulo.indexOf(P.destaque):-1;
  tt.innerHTML = k<0? e(P.titulo) : e(P.titulo.slice(0,k))+'<span class="mk" style="background-image:linear-gradient(#ffd400,#ffd400);background-repeat:no-repeat;background-size:0% 100%;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone">'+e(P.destaque)+'</span>'+e(P.titulo.slice(k+P.destaque.length));
  const pg=document.querySelector(id+" .pg");
  tl.set(id,{opacity:0},0); tl.fromTo(id,{opacity:0},{opacity:1,duration:.3,immediateRender:false},S);
  tl.fromTo(pg,{scale:1.35,rotation:P.rot-6,y:40},{scale:1,rotation:P.rot,y:0,duration:.6,ease:"power3.out",immediateRender:false},S);
  tl.to(pg,{scale:1.06,duration:Math.max(.5,D-.6),ease:"none"},S+.6);
  const mk=document.querySelector(id+" .mk");
  if(mk){tl.set(mk,{backgroundSize:"0% 100%"},0);tl.to(mk,{backgroundSize:"100% 100%",duration:.7,ease:"power2.inOut"},P.t_destaque||S+1);}
  tl.to(id,{opacity:0,duration:.3},S+D-.3);
})(window.__timelines.main, {{json}});
</script>
