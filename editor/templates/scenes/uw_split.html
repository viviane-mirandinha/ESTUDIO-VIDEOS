<!--params {"a":"","la":"","sa":"","b":"","lb":"","sb":"","pos_a":"50% 50%","pos_b":"50% 50%"}-->
<div id="{{id}}" style="position:absolute;inset:0;background:#0c1726;overflow:hidden">
 <div class="pa" style="position:absolute;left:0;top:0;width:50%;height:100%;overflow:hidden"><img class="ia" src="{{p.a}}" style="width:100%;height:100%;object-fit:cover;object-position:{{p.pos_a}}"></div>
 <div class="pb" style="position:absolute;right:0;top:0;width:50%;height:100%;overflow:hidden"><img class="ib" src="{{p.b}}" style="width:100%;height:100%;object-fit:cover;object-position:{{p.pos_b}}"></div>
 <div style="position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff"></div>
 <div class="ra" style="position:absolute;left:28px;top:30px;display:flex;align-items:stretch;background:rgba(8,12,20,.84);padding:6px 16px 6px 0"><span style="width:6px;background:#f5c518;margin-right:12px"></span><span><b style="display:block;font:800 28px 'Montserrat',sans-serif;color:#fff;text-transform:uppercase">{{p.la}}</b><i class="xa" style="display:block;font:700 24px 'Montserrat',sans-serif;color:#c9d3e0;font-style:normal">{{p.sa}}</i></span></div>
 <div class="rb" style="position:absolute;left:calc(50% + 28px);top:30px;display:flex;align-items:stretch;background:rgba(8,12,20,.84);padding:6px 16px 6px 0"><span style="width:6px;background:#f5c518;margin-right:12px"></span><span><b style="display:block;font:800 28px 'Montserrat',sans-serif;color:#fff;text-transform:uppercase">{{p.lb}}</b><i class="xb" style="display:block;font:700 24px 'Montserrat',sans-serif;color:#c9d3e0;font-style:normal">{{p.sb}}</i></span></div>
</div>
<script>
(function(tl,P){const S={{start}},D={{dur}},id="#{{id}}",R=document.querySelector(id);
 if(!P.sa)R.querySelector(".xa").style.display="none"; if(!P.sb)R.querySelector(".xb").style.display="none";
 tl.fromTo(id+" .pa",{xPercent:-100},{xPercent:0,duration:.6,ease:"power3.out",immediateRender:true},S);
 tl.fromTo(id+" .pb",{xPercent:100},{xPercent:0,duration:.6,ease:"power3.out",immediateRender:true},S+.15);
 tl.fromTo(id+" .ia",{scale:1.08},{scale:1,duration:D,ease:"none",immediateRender:true},S);
 tl.fromTo(id+" .ib",{scale:1},{scale:1.08,duration:D,ease:"none",immediateRender:true},S);
 tl.fromTo(id+" .ra",{opacity:0},{opacity:1,duration:.4,immediateRender:true},S+.6);
 tl.fromTo(id+" .rb",{opacity:0},{opacity:1,duration:.4,immediateRender:true},S+.8);
})(window.__timelines.main,{{json}});
</script>
