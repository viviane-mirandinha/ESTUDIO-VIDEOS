<!--params {"titulo":"","sub":"","t_tit":0,"img":"","ar":1,"t_img":0,"imgs":[],"frase":[],"bgimg":"","bg_op":0.3,"bg_fit":"cover","bg_top":260,"t_sub":0,"escurecer":0,"area_top":430,"area_h":800,"maxw":860,"cor":"#F5C518"}-->
<div id="{{id}}" style="position:absolute;inset:0;font-family:Inter,Arial,sans-serif;color:#fff;overflow:hidden">
<div class="bgi" style="position:absolute;inset:0"></div>
<div class="esc" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.25) 30%,rgba(0,0,0,.25) 62%,rgba(0,0,0,.8) 100%)"></div>
<div class="tit" style="position:absolute;left:70px;right:70px;top:240px;text-align:center">
 <div class="tt" style="display:inline-block;font:700 112px/1 Oswald,Inter;color:{{p.cor}};text-transform:uppercase;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)">{{p.titulo}}</div>
 <div class="bar" style="height:8px;width:180px;margin:14px auto 0;background:{{p.cor}};border-radius:4px;transform-origin:50% 50%"></div>
 <div class="sb" style="margin-top:12px;font:700 36px/1.2 Inter;color:#b8b8be;text-transform:uppercase;letter-spacing:.04em">{{p.sub}}</div></div>
<div class="area" style="position:absolute;left:0;right:0"></div></div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}", AM=P.cor||"#F5C518";
const q=s=>document.querySelector(id+" "+s), area=q(".area"), tit=q(".tit"), bgi=q(".bgi"), esc=q(".esc");
area.style.top=(P.area_top||430)+"px"; area.style.height=(P.area_h||800)+"px";
const FROM=(el,a,b,t)=>{tl.fromTo(el,a,Object.assign({immediateRender:false},b),t);tl.set(el,{opacity:0},0)};
// fundo opcional (imagem escurecida)
if(P.bgimg){bgi.innerHTML=P.bg_fit==="topo"?`<img src="${P.bgimg}" style="position:absolute;left:0;top:${P.bg_top||260}px;width:100%;filter:grayscale(.6) contrast(1.1);opacity:${P.bg_op||.3};-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%)">`:`<img src="${P.bgimg}" style="width:100%;height:100%;object-fit:cover;filter:grayscale(.55) contrast(1.1);opacity:${P.bg_op||.3}">`;
 tl.fromTo(bgi,{scale:1.12},{scale:1,duration:D,ease:"none",immediateRender:false},S);}
if(!(P.escurecer>0)) esc.remove(); else esc.style.opacity=P.escurecer;
// título amarelo
if(P.titulo){const tt=q(".tt"),bar=q(".bar"),sb=q(".sb");const t0=P.t_tit||S+.05;
 FROM(tt,{opacity:0,x:-60},{opacity:1,x:0,duration:.45,ease:"power3.out"},t0);
 tl.fromTo(bar,{scaleX:0},{scaleX:1,duration:.5,ease:"power2.out",immediateRender:false},t0+.15);tl.set(bar,{scaleX:0},0);
 if(P.sub)FROM(sb,{opacity:0,y:12},{opacity:1,y:0,duration:.4},P.t_sub||t0+.3); else sb.remove();
} else tit.remove();
const AH=P.area_h||800, MW=P.maxw||860;
// recorte único em moldura amarela
if(P.img){const ar=P.ar||1;let w=MW,h=w/ar;if(h>AH){h=AH;w=h*ar;}
 const f=document.createElement("div");f.style.cssText=`position:absolute;left:${(1080-w)/2}px;top:${(AH-h)/2}px;width:${w}px;height:${h}px;border:9px solid ${AM};border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 70px rgba(245,197,24,.28),0 30px 60px rgba(0,0,0,.7);background:#fff;box-sizing:content-box;margin-left:-9px`;
 f.innerHTML=`<img src="${P.img}" style="width:100%;height:100%;object-fit:cover;display:block">`;area.appendChild(f);
 const ti=P.t_img||S+.15;
 FROM(f,{opacity:0,y:160,rotation:-4,scale:.88},{opacity:1,y:0,rotation:0,scale:1,duration:.6,ease:"back.out(1.3)"},ti);
 tl.fromTo(f.firstChild,{scale:1},{scale:1.07,duration:Math.max(.5,S+D-ti),ease:"none",immediateRender:false},ti);}
// várias manchetes empilhadas
if(P.imgs&&P.imgs.length){const W2=MW+80,g=26;const hs=P.imgs.map(o=>W2/(o.ar||6.4));let tot=hs.reduce((a,b)=>a+b,0)+g*(hs.length-1);let k=1;if(tot>AH){k=AH/tot;}
 let y=(AH-tot*k)/2;P.imgs.forEach((o,i)=>{const w=W2*k,h=hs[i]*k;const f=document.createElement("div");
  f.style.cssText=`position:absolute;left:${(1080-w)/2}px;top:${y}px;width:${w}px;height:${h}px;border:5px solid ${AM};border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.65);box-sizing:border-box`;
  f.innerHTML=`<img src="${o.src}" style="width:100%;height:100%;object-fit:cover;display:block">`;area.appendChild(f);y+=h+g*k;
  FROM(f,{opacity:0,x:(i%2?1:-1)*140},{opacity:1,x:0,duration:.45,ease:"power3.out"},o.t||S+.2+i*.35);});}
// frase gigante (linhas)
if(P.frase&&P.frase.length){const box=document.createElement("div");box.style.cssText=`position:absolute;left:40px;right:40px;top:0;height:${AH}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center`;area.appendChild(box);
 P.frase.forEach((o,i)=>{const d=document.createElement("div");d.textContent=o.txt;d.style.cssText=`font:700 ${o.tam||150}px/1.02 Oswald,Inter;color:${o.cor||"#fff"};text-transform:uppercase;white-space:nowrap;text-shadow:0 6px 40px rgba(0,0,0,.7)`+(o.caixa?`;background:${AM};color:#0B0B0C;padding:4px 22px;text-shadow:none`:"");box.appendChild(d);
  FROM(d,{opacity:0,scale:1.25,y:20},{opacity:1,scale:1,y:0,duration:.4,ease:"power3.out"},o.t||S+.1+i*.3);});
 tl.fromTo(box,{scale:1},{scale:1.05,duration:D,ease:"none",immediateRender:false},S);}
tl.fromTo(id,{opacity:0},{opacity:1,duration:.25,immediateRender:false},S);tl.set(id,{opacity:0},0);tl.to(id,{opacity:0,duration:.25},S+D-.25);
})(window.__timelines.main, {{json}});
</script>
