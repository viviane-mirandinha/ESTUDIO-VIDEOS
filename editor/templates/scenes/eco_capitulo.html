<!--params {"cap":"Capítulo 1","texto":"Pergunta do capítulo","itens":"","tempos":"","escuro":0.5,"x":300,"y":230}-->
<div id="{{id}}" class="eecap" style="position:absolute;inset:0;font-family:Inter,Arial,sans-serif">
  <div class="ov" style="position:absolute;inset:0;background:#000"></div>
  <div class="grp" style="position:absolute;width:660px">
    <div class="paper" style="position:relative;margin-top:44px;background:#f2efe6;color:#1f1f1c;padding:46px 40px 34px;font-size:34px;line-height:1.3;font-weight:500;
      clip-path:polygon(0 2%,6% 0,18% 1.5%,33% 0,51% 1.2%,70% 0,86% 1.6%,100% 0,99% 22%,100% 48%,98.6% 75%,100% 100%,82% 98.4%,64% 100%,45% 98.6%,26% 100%,9% 98.2%,0 100%,1.2% 70%,0 41%,1% 18%);
      box-shadow:0 18px 40px rgba(0,0,0,.5)">
      <div class="txt">{{p.texto}}</div>
      <ul class="lst" style="margin:18px 0 0;padding:0;list-style:none;font-size:30px;font-weight:700"></ul>
    </div>
    <div class="tape" style="position:absolute;left:-26px;top:0;background:#d8c34a;color:#1d1c17;font-weight:800;font-size:48px;padding:8px 36px 8px 28px;transform:rotate(-2deg);transform-origin:0 50%;
      clip-path:polygon(0 4%,3% 0,97% 6%,100% 0,98% 50%,100% 100%,96% 94%,4% 100%,0 96%,2% 50%);box-shadow:0 4px 10px rgba(0,0,0,.3)">{{p.cap}}</div>
  </div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}";
  const g=document.querySelector(id+" .grp"); g.style.left=P.x+"px"; g.style.top=P.y+"px";
  const its=(P.itens||"").split("|").filter(Boolean), ts=(P.tempos||"").split("|").map(Number);
  const ul=document.querySelector(id+" .lst");
  its.forEach((t,i)=>{const li=document.createElement("li");li.innerHTML='<span style="display:inline-block;width:14px;height:14px;background:#d8c34a;margin-right:14px;transform:rotate(45deg)"></span>'+t;li.style.margin="10px 0";ul.appendChild(li);
    tl.fromTo(li,{opacity:0,x:-24},{opacity:1,x:0,duration:.45,ease:"power2.out",immediateRender:false},(ts[i]||S+1+i)-.05); tl.set(li,{opacity:0},0);});
  tl.fromTo(id+" .ov",{opacity:0},{opacity:P.escuro,duration:.5,immediateRender:false},S);
  tl.fromTo(id+" .paper",{opacity:0,y:80,rotation:-7},{opacity:1,y:0,rotation:-1,duration:.6,ease:"back.out(1.4)",immediateRender:false},S+.1);
  tl.fromTo(id+" .tape",{opacity:0,scaleX:.2},{opacity:1,scaleX:1,duration:.4,ease:"power3.out",immediateRender:false},S+.4);
  tl.fromTo(id+" .txt",{opacity:0},{opacity:1,duration:.4,immediateRender:false},S+.5);
  tl.to(id+" .grp",{x:900,y:-160,rotation:24,scale:.6,opacity:0,duration:.5,ease:"power2.in"},S+D-.5);
  tl.to(id+" .ov",{opacity:0,duration:.4},S+D-.4);
  tl.set(id+" .ov,"+id+" .paper,"+id+" .tape,"+id+" .txt",{opacity:0},0);
})(window.__timelines.main, {{json}});
</script>
