<script>
(function(tl, P){ const S={{start}}, D={{dur}}, R="#{{id}} ";
  tl.set(R+".lb,"+R+".nt,"+R+".tt,"+R+".dot",{opacity:0},0); tl.set(R+".city",{strokeDashoffset:600,opacity:0},0);
  tl.fromTo(R+"svg",{scale:1.08},{scale:1,duration:D,ease:"none",immediateRender:false},S);
  tl.to(R+".tt",{opacity:1,duration:.4,immediateRender:false},S+.1);
  tl.to(R+".city",{opacity:1,strokeDashoffset:0,duration:1.4,ease:"power1.inOut",immediateRender:false},S+.3);
  tl.to(R+".lb",{opacity:1,duration:.5,stagger:.25,immediateRender:false},S+.6);
  tl.to(R+".dot",{opacity:1,duration:.25,stagger:.3,immediateRender:false},S+1.4);
  tl.fromTo(R+".pulse",{attr:{r:10},opacity:1},{attr:{r:34},opacity:0,duration:1.1,repeat:Math.max(1,Math.floor((D-1.5)/1.1)),ease:"power1.out",immediateRender:false},S+1.5);
  tl.to(R+".nt",{opacity:1,duration:.4,immediateRender:false},S+3.0);
})(window.__timelines.main, {{json}});
</script>
