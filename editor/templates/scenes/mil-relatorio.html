<!--params {"titulo":"RELATÓRIO FINAL","linha":"GASTO DE MUNIÇÃO","valor":"UM ÚNICO","carimbo":"14 CARTUCHOS","t_carimbo":3.2,"cor":"#c8281e"}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2c2e24,#121309);font-family:Oswald,'Arial Narrow',sans-serif">
  <div class="rel-p" style="position:absolute;left:260px;top:70px;width:760px;height:580px;background:#e7e1cf;box-shadow:0 30px 60px rgba(0,0,0,.6);transform:rotate(-1.4deg);padding:44px 56px;box-sizing:border-box;color:#1d1c17">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #1d1c17;padding-bottom:14px">
      <div class="rel-t" style="font-size:58px;font-weight:700;letter-spacing:3px">{{p.titulo}}</div>
      <div style="width:84px;height:84px;border:4px solid #1d1c17;border-radius:50%;opacity:.55"></div>
    </div>
    <div class="rel-r" style="margin-top:26px">
      <div style="height:26px;background:#1d1c17;width:88%;margin:14px 0"></div>
      <div style="height:26px;background:#1d1c17;width:64%;margin:14px 0"></div>
      <div style="height:26px;background:#1d1c17;width:76%;margin:14px 0"></div>
    </div>
    <div class="rel-l" style="margin-top:30px;font:700 34px Consolas,monospace;letter-spacing:1px">{{p.linha}}: <span style="opacity:.8">{{p.valor}}</span></div>
    <div class="rel-c" style="position:absolute;left:90px;top:330px;font-size:84px;font-weight:700;white-space:nowrap;color:{{p.cor}};border:8px solid {{p.cor}};padding:0 30px;transform:rotate(-6deg);letter-spacing:4px;opacity:0">{{p.carimbo}}</div>
  </div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}; const R=document.getElementById("{{id}}");
  tl.fromTo(R.querySelector(".rel-p"),{y:60,opacity:0},{y:0,opacity:1,duration:.6,ease:"power2.out",immediateRender:false},S);
  tl.fromTo(R.querySelector(".rel-l"),{opacity:0},{opacity:1,duration:.4,immediateRender:false},S+0.9);
  tl.fromTo(R.querySelector(".rel-c"),{opacity:0,scale:1.25},{opacity:.92,scale:1,duration:.35,ease:"power3.out",immediateRender:false},S+P.t_carimbo);
  const pp=R.querySelector(".rel-p"); const st={_k:0}; Object.defineProperty(st,"k",{get(){return this._k},set(v){this._k=v;pp.style.scale=(1+v*0.05).toFixed(4);}});
  tl.fromTo(st,{k:0},{k:1,duration:D,ease:"none",immediateRender:false},S);
})(window.__timelines.main, {{json}});
</script>
