<!--params {"pos":"centro","scrim":false,"linhas":[{"txt":"FRASE","t":0.2,"cls":"grande","destaques":[]}]}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif">
 <div class="scr" style="position:absolute;inset:0"></div>
 <div class="box" style="position:absolute;left:90px;right:90px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px"></div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, R="#{{id}}"; const root=document.querySelector(R);
  const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const box=root.querySelector(".box"), scr=root.querySelector(".scr");
  if(P.pos==="baixo"){ box.style.bottom="56px"; } else { box.style.top="54%"; box.style.transform="translateY(-50%)"; }
  scr.style.background=P.scrim?(P.pos==="baixo"?"linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.4) 55%,rgba(0,0,0,0))":"rgba(0,0,0,.55)"):"transparent";
  let k=0; const hls=[], riscos=[];
  const st={grande:"font-family:Anton,Impact,sans-serif;font-size:84px;line-height:1.08;color:#fff;text-transform:uppercase;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.6)",
            apoio:"font-size:38px;line-height:1.3;color:#e9ecf1;font-weight:600;text-shadow:0 3px 12px rgba(0,0,0,.8)",
            rotulo:"font-size:30px;color:#ffd84d;font-weight:800;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.8)"};
  box.innerHTML=(P.linhas||[]).map((l,i)=>{ let h=esc(l.txt);
    (l.destaques||[]).forEach(d=>{ const p=esc(d.p), j=h.indexOf(p); if(j<0) return; const id="hl"+(k++); hls.push([id,+d.t]);
      h=h.slice(0,j)+'<span class="'+id+'" style="background:linear-gradient(#ffd84d,#ffd84d) no-repeat 0 90%/0% 88%;padding:0 6px;border-radius:4px;text-shadow:none">'+p+'</span>'+h.slice(j+p.length); });
    if(l.risca!=null){ riscos.push([i,+l.risca]); h='<span style="position:relative;display:inline-block">'+h+'<span class="rk'+i+'" style="position:absolute;left:-6px;top:50%;height:9px;width:0%;background:#ff4d4d;border-radius:4px"></span></span>'; }
    return '<div class="ln'+i+'" style="'+(st[l.cls]||st.apoio)+'">'+h+'</div>'; }).join("");
  tl.set(R,{opacity:0},0);
  tl.fromTo(R,{opacity:0},{opacity:1,duration:.35,ease:"none",immediateRender:false},S);
  (P.linhas||[]).forEach((l,i)=>tl.fromTo(R+" .ln"+i,{opacity:0,y:26},{opacity:1,y:0,duration:.45,ease:"power2.out",immediateRender:false},S+(+l.t||0)));
  riscos.forEach(([i,t])=>{ tl.fromTo(R+" .rk"+i,{width:"0%"},{width:"104%",duration:.4,ease:"power1.inOut",immediateRender:false},S+t);
    tl.fromTo(R+" .ln"+i,{opacity:1},{opacity:.55,duration:.3,immediateRender:false},S+t+.3); });
  hls.forEach(([id,t])=>{ tl.fromTo(R+" ."+id,{backgroundSize:"0% 88%"},{backgroundSize:"100% 88%",duration:.5,ease:"power1.inOut",immediateRender:false},S+t);
    tl.fromTo(R+" ."+id,{color:"#ffffff"},{color:"#111111",duration:.2,immediateRender:false},S+t+.42); });
  tl.to(R,{opacity:0,duration:.3,ease:"none"},S+D-.3);
})(window.__timelines.main, {{json}});
</script>
