<!--params {"cabecalho":"PERFIS EM ESCALA","titulo":"","t_titulo":0.2,"valor":240,"de":211,"unidade":"M","t_num":1.0,"sub":"","t_sub":2.0,"sub2":"","t_sub2":3.0,"rodape":"PERFIS SIMPLIFICADOS · EM ESCALA","navios":[{"nome":"GREAT EASTERN","m":211,"tipo":"liner","funis":5,"mastros":6,"estado":"antigo"},{"nome":"LUSITÂNIA","m":240,"tipo":"liner","funis":4,"mastros":2,"estado":"novo"}]}-->
<div id="{{id}}" class="kr-ln" style="position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 45% 40%,#1d2a3a 0%,#121c29 55%,#0b121c 100%)">
 <div class="kr-grain" style="position:absolute;inset:0;opacity:.10"></div>
 <div class="hd" style="position:absolute;left:84px;top:44px;font:24px Consolas,monospace;letter-spacing:.12em;color:#9fb2c4">{{p.cabecalho}} <span class="ti" style="color:#d9a63a">{{p.titulo}}</span></div>
 <div class="nb" style="position:absolute;left:80px;top:78px;font-family:'Barlow',sans-serif;font-weight:700;font-size:132px;line-height:1;color:#d9a63a;letter-spacing:.01em"><span class="v">{{p.valor}}</span> <span class="u">{{p.unidade}}</span></div>
 <div class="sb" style="position:absolute;left:86px;top:222px;font-family:'Barlow',sans-serif;font-weight:700;font-size:50px;color:#f2efe6;letter-spacing:.02em">{{p.sub}}</div>
 <div class="sb2" style="position:absolute;left:86px;top:222px;font-family:'Barlow',sans-serif;font-weight:700;font-size:50px;color:#f2efe6;letter-spacing:.02em;opacity:0">{{p.sub2}}</div>
 <svg class="sv" width="{{W}}" height="{{H}}" viewBox="0 0 {{W}} {{H}}" style="position:absolute;inset:0"></svg>
 <div class="ft" style="position:absolute;right:60px;bottom:30px;font:24px Consolas,monospace;letter-spacing:.1em;color:#6f8396">{{p.rodape}}</div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}", R=document.querySelector(id);
  const GR="url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>\")";
  R.querySelector(".kr-grain").style.backgroundImage=GR;
  if(!window.KRSHIP){ window.KRSHIP=function(n){ // perfil em metros: x 0=popa .. L=proa; y negativo = para cima
    const L=n.m, t=n.tipo||"liner", sh=[];
    const PL=(a)=>"M"+a.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" L")+" Z";
    const RC=(x,y,w,h)=>PL([[x,y],[x+w,y],[x+w,y-h],[x,y-h]]);
    if(t==="liner"){ const hh=Math.min(0.072*L,20), nf=n.funis||3, nm=n.mastros||2;
      sh.push(PL([[0.02*L,-hh],[0.5*L,-hh],[L,-hh-0.012*L],[0.975*L,0],[0.05*L,0],[0,-hh*0.55]]));
      const t1=(n.baixo?0.014:0.03)*L, t2=(n.baixo?0:0.024)*L;
      sh.push(RC(0.17*L,-hh+0.5,0.66*L,t1)); if(t2) sh.push(RC(0.24*L,-hh-t1+0.5,0.5*L,t2));
      const top=-hh-t1-t2, fw=0.03*L, fh=(n.baixo?0.06:0.07)*L;
      for(let i=0;i<nf;i++){ const fx=nf===1?0.5*L:(0.3+0.42*i/(nf-1))*L; sh.push(PL([[fx,top+0.5],[fx+fw,top+0.5],[fx+fw-0.012*L,top-fh],[fx-0.012*L,top-fh]])); }
      for(let i=0;i<nm;i++){ const mx=nm===1?0.86*L:(0.08+0.84*i/(nm-1))*L; sh.push(RC(mx,-hh+0.5,Math.max(0.0045*L,1.2),0.17*L)); }
    } else if(t==="tanker"){ const hh=0.062*L;
      sh.push(PL([[0,-hh*0.9],[L*0.97,-hh],[L,-hh-0.006*L],[L*0.985,0],[0.02*L,0]]));
      sh.push(RC(0.025*L,-hh+0.5,0.085*L,0.052*L)); sh.push(RC(0.035*L,-hh-0.052*L+0.5,0.02*L,0.022*L));
      sh.push(RC(0.94*L,-hh+0.5,0.05*L,0.012*L));
    } else if(t==="cruise"){ const hh=0.05*L;
      sh.push(PL([[0,-hh*0.8],[L*0.96,-hh],[L,-hh-0.01*L],[L*0.975,0],[0.03*L,0]]));
      sh.push(PL([[0.03*L,-hh+0.5],[0.03*L,-0.16*L],[0.72*L,-0.172*L],[0.84*L,-0.15*L],[0.91*L,-0.1*L],[0.95*L,-hh+0.5]]));
      sh.push(RC(0.22*L,-0.172*L+0.5,0.06*L,0.025*L));
    } else { const hh=0.075*L; // guindaste (Pioneering Spirit)
      sh.push(PL([[0,-hh],[L,-hh],[L*0.99,0],[0.01*L,0]]));
      sh.push(RC(0.03*L,-hh+0.5,0.13*L,0.1*L)); sh.push(RC(0.06*L,-hh-0.1*L+0.5,0.05*L,0.03*L));
      for(let i=0;i<4;i++) sh.push(RC((0.68+0.075*i)*L,-hh+0.5,0.05*L,0.13*L));
    }
    return sh; }; }
  const NS="http://www.w3.org/2000/svg", sv=R.querySelector(".sv"), X0=84, K=2.25, BY=500;
  const mk=(tag,a)=>{const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); return e;};
  sv.appendChild(mk("line",{x1:X0,y1:BY,x2:1200,y2:BY,stroke:"rgba(217,166,58,.55)","stroke-width":2}));
  for(let m=0;m<=500;m+=50) sv.appendChild(mk("line",{x1:X0+m*K,y1:BY,x2:X0+m*K,y2:BY+(m%100?8:16),stroke:"rgba(159,178,196,.6)","stroke-width":2}));
  const ships=(P.navios||[]).map((n,i)=>Object.assign({_row:i},n));
  const order=[...ships].sort((a,b)=>(a.estado==="novo"?0:1)-(b.estado==="novo"?0:1));
  const tn=S+(+P.t_num);
  order.forEach((n,j)=>{ const novo=n.estado==="novo", fan=n.estado==="fantasma";
    const g=mk("g",{transform:`translate(${X0},${BY}) scale(${K})`});
    const cid="{{id}}_c"+j, cp=mk("clipPath",{id:cid}), cr=mk("rect",{x:-5,y:-200,width:n.m+10,height:260}); cp.appendChild(cr); sv.appendChild(cp);
    g.setAttribute("clip-path",`url(#${cid})`);
    for(const d of KRSHIP(n)) g.appendChild(mk("path",{d, fill: novo?"#d9a63a":(fan?"none":"rgba(159,192,216,.2)"), stroke: novo?"#d9a63a":"#9fc0d8","stroke-width":(fan?1.8:(novo?0.7:2.2))/K,"stroke-dasharray":fan?"4 3":"none"}));
    sv.appendChild(g);
    const bx=X0+n.m*K, ly=BY+56+n._row*36;
    const lab=mk("g",{}); lab.appendChild(mk("line",{x1:bx,y1:BY+2,x2:bx,y2:ly-20,stroke:novo?"#d9a63a":"#9fc0d8","stroke-width":2,"stroke-dasharray":"3 4"}));
    const tx=mk("text",{x:bx,y:ly+4,"text-anchor":"end",fill:novo?"#e6b54a":"#b9cfdf","font-family":"Consolas,monospace","font-size":24,"letter-spacing":"1.5"}); tx.textContent=n.nome+(n.sem_m?"":" · "+n.m+" M"); lab.appendChild(tx); sv.appendChild(lab);
    if(novo){ tl.fromTo(g,{opacity:0},{opacity:1,duration:.3,immediateRender:true},tn-.3);
      tl.fromTo(cr,{attr:{width:(+P.de||0)+5}},{attr:{width:n.m+10},duration:1.3,ease:"power2.inOut",immediateRender:true},tn);
      tl.fromTo(lab,{opacity:0},{opacity:1,duration:.5,immediateRender:true},tn+1.0); }
    else { tl.fromTo(g,{opacity:0},{opacity:1,duration:.5,immediateRender:true},S+.25+j*.1); tl.fromTo(lab,{opacity:0},{opacity:1,duration:.5,immediateRender:true},S+.45+j*.1); }
  });
  const v=R.querySelector(".v"), to=+P.valor, fr=+P.de||0;
  if(!isNaN(to)){ const cn={_n:to}; Object.defineProperty(cn,"n",{get(){return this._n},set(x){this._n=x; v.textContent=Math.round(x);}}); tl.fromTo(cn,{n:fr||to},{n:to,duration:1.3,ease:"power2.inOut",immediateRender:true},tn); }
  tl.fromTo(id,{opacity:0},{opacity:1,duration:.45,immediateRender:true},S);
  tl.fromTo(id+" .nb",{opacity:0,y:16},{opacity:1,y:0,duration:.5,immediateRender:true},tn-.3);
  tl.fromTo(id+" .ti",{opacity:0},{opacity:1,duration:.4,immediateRender:true},S+(+P.t_titulo));
  if(P.sub) tl.fromTo(id+" .sb",{opacity:0,x:-20},{opacity:1,x:0,duration:.5,immediateRender:true},S+(+P.t_sub));
  else tl.set(id+" .sb",{opacity:0},S);
  if(P.sub2){ tl.to(id+" .sb",{opacity:0,duration:.3},S+(+P.t_sub2)-.3); tl.fromTo(id+" .sb2",{opacity:0,x:-20},{opacity:1,x:0,duration:.5,immediateRender:true},S+(+P.t_sub2)); }
})(window.__timelines.main, {{json}});
</script>
