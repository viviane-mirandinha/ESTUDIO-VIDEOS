<!--params {"numero":"","sub":"","escurecer":0.35,"conta":true}-->
<div id="{{id}}" style="position:absolute;inset:0;pointer-events:none;background:rgba(5,10,18,var(--d,0))">
 <div class="bx" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center">
  <div class="nv" style="font:900 116px/1 'Montserrat',sans-serif;color:#f5c518;-webkit-text-stroke:2px #3a2a00;text-shadow:0 6px 26px rgba(0,0,0,.75);white-space:nowrap">{{p.numero}}</div>
  <div class="ns" style="display:inline-block;margin-top:16px;font:800 32px 'Montserrat',sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.04em;background:rgba(8,12,20,.62);padding:5px 16px;max-width:1100px">{{p.sub}}</div>
 </div>
</div>
<script>
(function(tl,P){const S={{start}},D={{dur}},id="#{{id}}",R=document.querySelector(id);
 R.style.setProperty("--d",+P.escurecer||0); if(!P.sub) R.querySelector(".ns").style.display="none";
 const nv=R.querySelector(".nv"), txt=String(P.numero||""), m=txt.match(/^([^0-9]*)([0-9][0-9.,]*)(.*)$/);
 tl.fromTo(id,{opacity:0},{opacity:1,duration:.35,immediateRender:true},S);
 tl.fromTo(id+" .nv",{scale:.8,opacity:0},{scale:1,opacity:1,duration:.7,ease:"power3.out",immediateRender:true},S+.05);
 tl.fromTo(id+" .ns",{opacity:0,y:12},{opacity:1,y:0,duration:.5,immediateRender:true},S+.45);
 if(P.conta!==false&&m){ const raw=m[2], sep=raw.includes(",")&&raw.split(",").pop().length===3?",":(raw.includes(".")&&raw.split(".").pop().length===3&&!raw.includes(",")?".":"");
  const dec=!sep&&/[.,]/.test(raw)?raw.split(/[.,]/)[1].length:0, dch=raw.includes(",")&&!sep?",":".";
  const val=parseFloat(sep?raw.split(sep).join(""):raw.replace(",",".")), o={v:0};
  const fmt=v=>{let s=dec?v.toFixed(dec).replace(".",dch):Math.round(v).toString(); if(sep)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,sep); return m[1]+s+m[3];};
  tl.fromTo(o,{v:0},{v:val,duration:Math.min(1.4,D*.5),ease:"power2.out",immediateRender:true,onUpdate:()=>{nv.textContent=fmt(o.v);}},S+.05); }
 tl.to(id,{opacity:0,duration:.35},S+D-.35);
})(window.__timelines.main,{{json}});
</script>
