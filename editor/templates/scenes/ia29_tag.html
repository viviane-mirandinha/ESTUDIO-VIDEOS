<!--params {"texto":"","sub":"","pos":"esq-baixo","cor":"branco","live":0,"t_in":0.3,"t_sub":0.5,"crt":0}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;pointer-events:none;font-family:Montserrat,Inter,Arial,sans-serif">
 <div class="crt" style="position:absolute;inset:0;display:none">
  <div style="position:absolute;left:150px;top:70px;width:980px;height:551px;border-radius:46px;box-shadow:0 0 0 900px #050608,inset 0 0 90px rgba(0,0,0,.85),0 0 60px rgba(120,170,255,.25)"></div>
  <div style="position:absolute;left:150px;top:70px;width:980px;height:551px;border-radius:46px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);mix-blend-mode:multiply"></div>
 </div>
 <div class="g" style="position:absolute;opacity:0">
  <div class="live" style="display:none;margin-bottom:12px"><span style="display:inline-block;padding:8px 18px;background:#e0141e;color:#fff;font-weight:900;font-size:30px;letter-spacing:2px;border-radius:4px">LIVE</span></div>
  <div class="t" style="display:inline-block;padding:10px 24px;font-weight:900;font-size:48px;line-height:1;text-transform:uppercase;border-radius:6px;white-space:nowrap">{{p.texto}}</div>
  <div class="s" style="font-weight:700;font-size:34px;color:#fff;margin-top:10px;text-shadow:0 2px 12px rgba(0,0,0,.9);white-space:nowrap">{{p.sub}}</div>
 </div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, R=document.getElementById("{{id}}");
  const g=R.querySelector(".g"), t=R.querySelector(".t"), pos=P.pos||"esq-baixo";
  if(+P.crt) R.querySelector(".crt").style.display="block";
  if(+P.live) R.querySelector(".live").style.display="block";
  if(P.cor==="vermelho"){ t.style.background="#e0141e"; t.style.color="#fff"; } else if(P.cor==="azul"){ t.style.background="#1f4fe0"; t.style.color="#fff"; } else { t.style.background="#fff"; t.style.color="#111"; }
  if(!P.sub) R.querySelector(".s").style.display="none";
  const off=+P.crt?190:60;
  if(pos==="esq-topo"){ g.style.left=off+"px"; g.style.top=(+P.crt?100:56)+"px"; }
  else if(pos==="centro-baixo"){ g.style.left="0"; g.style.right="0"; g.style.textAlign="center"; g.style.bottom=(+P.crt?110:60)+"px"; }
  else { g.style.left=off+"px"; g.style.bottom=(+P.crt?110:60)+"px"; }
  tl.fromTo(g,{opacity:0,x:-30},{opacity:1,x:0,duration:.4,ease:"power3.out",immediateRender:false},S+(+P.t_in));
  if(P.sub) tl.fromTo(R.querySelector(".s"),{opacity:0,y:10},{opacity:1,y:0,duration:.35,immediateRender:false},S+(+P.t_sub));
  tl.to(g,{opacity:0,duration:.2},S+D-.2);
})(window.__timelines.main, {{json}});
</script>
