<!--params {"valor":95,"prefixo":"","sufixo":"%","legenda":"de sucesso","rotulo":"","cor":"#5cc8ff","seed":5,"t_conta":0.1,"conta_dur":0.8,"fade_in":0.4}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;background:#0a1f1d">
 <canvas class="cv" width="{{W}}" height="{{H}}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
 <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 45%,rgba(0,0,0,.65) 100%)"></div>
 <div class="ro" style="position:absolute;left:44px;top:36px;color:#f2f2ea;font-family:'Outfit',sans-serif;font-size:34px;font-weight:500;text-shadow:0 2px 10px rgba(0,0,0,.8)"><span style="border-bottom:3px solid #d9b25a;padding-bottom:4px">{{p.rotulo}}</span></div>
 <div class="bx" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:'Outfit',sans-serif;color:#fff">
  <div class="nb" style="font-size:210px;font-weight:700;line-height:1;letter-spacing:-.02em;text-shadow:0 0 40px rgba(92,200,255,.35),0 4px 20px rgba(0,0,0,.8)"><span class="pf">{{p.prefixo}}</span><span class="vl">0</span><span class="sf">{{p.sufixo}}</span></div>
  <div class="lg" style="font-size:46px;font-weight:400;color:#d8e8e2;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.9)">{{p.legenda}}</div>
 </div>
</div>
<script>
(function(tl,P){const S={{start}},D={{dur}},R=document.getElementById("{{id}}"),W={{W}},H={{H}},id="#{{id}}";
 if(!window.SW)return; const x=R.querySelector(".cv").getContext("2d"),BG=SW.bg(W,H,(+P.seed||5)+3),r=SW.rng(+P.seed||5);
 const cor=P.cor||"#5cc8ff"; R.querySelector(".nb").style.color=cor; if(!P.rotulo)R.querySelector(".ro").style.display="none";
 const pts=[];for(let i=0;i<120;i++)pts.push([r()*W,r()*H,(r()-.5)*30,(r()-.5)*20,r()<.5?"#ffa53a":"#5cc8ff",1+r()*1.6,.2+r()*.4]);
 const V=+P.valor||0,vl=R.querySelector(".vl"),tc=+P.t_conta||0,cd=+P.conta_dur||.8;
 SW.drive(tl,S,D,function(t){x.drawImage(BG,0,0);for(const a of pts)SW.dot(x,((a[0]+a[2]*t)%W+W)%W,((a[1]+a[3]*t)%H+H)%H,a[4],a[5],a[6]);
  let k=Math.min(1,Math.max(0,(t-tc)/cd));k=1-Math.pow(1-k,3);vl.textContent=String(Math.round(V*k));});
 const fi=+P.fade_in||0; if(fi>0)tl.fromTo(id,{opacity:0},{opacity:1,duration:fi,immediateRender:true},S);
 tl.fromTo(id+" .nb",{scale:.9,opacity:0},{scale:1,opacity:1,duration:.5,ease:"power2.out",immediateRender:true},S+tc);
 tl.fromTo(id+" .lg",{opacity:0,y:14},{opacity:1,y:0,duration:.5,immediateRender:true},S+tc+.5);
 if(P.rotulo)tl.fromTo(id+" .ro",{opacity:0},{opacity:1,duration:.5,immediateRender:true},S+.2);
})(window.__timelines.main,{{json}});
</script>
