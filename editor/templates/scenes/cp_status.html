<!--params {"nome":"Você","t_status":0.5,"t_digit":0.9,"t_cta":3,"t_eu":3.9,"cta":"COMENTA “EU”"}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif">
 <div class="st" style="position:absolute;left:80px;top:140px;width:460px;background:#fff;border-radius:18px;padding:22px 26px;box-shadow:0 18px 60px rgba(0,0,0,.6);display:flex;align-items:center;gap:18px">
  <div style="position:relative;width:66px;height:66px;border-radius:50%;background:#5b6cff;color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center">VC<div class="dot" style="position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:#9aa3ad;border:4px solid #fff"></div></div>
  <div><div style="font-size:30px;font-weight:800;color:#0f1419">{{p.nome}}</div><div class="lbl" style="font-size:26px;color:#9aa3ad">Ausente</div></div>
 </div>
 <div class="dg" style="position:absolute;left:80px;top:290px;font-size:30px;color:#fff;font-weight:600;background:rgba(0,0,0,.65);padding:10px 22px;border-radius:30px">digitando…</div>
 <div class="cta" style="position:absolute;right:80px;bottom:60px;text-align:right">
  <div style="font-family:Anton,Impact,sans-serif;font-size:96px;color:#ffd84d;line-height:1;text-shadow:0 5px 20px rgba(0,0,0,.7)">{{p.cta}}</div>
  <div style="display:inline-block;margin-top:18px;min-width:420px;text-align:left;background:#fff;border-radius:14px;padding:14px 22px;font-size:34px;color:#0f1419;font-weight:600">Comentário: <span class="eu"></span><span style="color:#5b6cff">|</span></div>
 </div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, R="#{{id}}"; const root=document.querySelector(R);
  const lbl=root.querySelector(".lbl"), eu=root.querySelector(".eu");
  const ts=S+(+P.t_status||.5), td=S+(+P.t_digit||.9), te=S+(+P.t_eu||3.9);
  tl.set(R,{opacity:0},0);
  tl.fromTo(R,{opacity:0},{opacity:1,duration:.35,ease:"none",immediateRender:false},S);
  tl.fromTo(R+" .st",{opacity:0,x:-40},{opacity:1,x:0,duration:.45,ease:"power2.out",immediateRender:false},S+.05);
  tl.fromTo(R+" .dot",{backgroundColor:"#9aa3ad"},{backgroundColor:"#22c55e",duration:.3,immediateRender:false},ts);
  tl.fromTo(lbl,{color:"#9aa3ad"},{color:"#16a34a",duration:.3,immediateRender:false,onUpdate:function(){lbl.textContent=this.progress()>0?"Disponível":"Ausente";}},ts);
  tl.fromTo(R+" .dg",{opacity:0},{opacity:1,duration:.3,immediateRender:false},td);
  tl.fromTo(R+" .dg",{opacity:1},{opacity:.35,duration:.4,repeat:3,yoyo:true,ease:"sine.inOut",immediateRender:false},td+.3);
  tl.fromTo(R+" .cta",{opacity:0,y:40},{opacity:1,y:0,duration:.5,ease:"power2.out",immediateRender:false},S+(+P.t_cta||3));
  tl.fromTo(eu,{opacity:1},{opacity:1,duration:.4,immediateRender:false,onUpdate:function(){const p=this.progress();eu.textContent=p<.01?"":(p<.5?"e":"eu");}},te);
  tl.to(R,{opacity:0,duration:.3,ease:"none"},S+D-.3);
})(window.__timelines.main, {{json}});
</script>
