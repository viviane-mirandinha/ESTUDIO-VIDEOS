const PARSE=t=>{const m=String(t).match(/^([^\d]*)(\d[\d.,]*)(.*)$/);if(!m)return null;let r=m[2],tail="";while(/[.,]$/.test(r)){tail=r.slice(-1)+tail;r=r.slice(0,-1)}const dec=r.includes(",")?r.split(",")[1].length:0;return{pre:m[1],num:parseFloat(r.replace(/\./g,"").replace(",",".")),dec,thou:r.includes("."),suf:tail+m[3]}};
