<!--params {"src":"","motion":"zoom_in","amount":0.08,"pos":"50% 50%","nome":"","sub":"","credito":"","fade_in":1.0,"fade_out":0}-->
<div id="{{id}}" class="cz-foto" style="position:absolute;inset:0;overflow:hidden;background:#000">
 <img class="ph" src="{{p.src}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{p.pos}};filter:contrast(1.08) saturate(1.08) brightness(.96);transform-origin:50% 50%">
 <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)"></div>
 <div style="position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,0))"></div>
 <div class="lb" style="position:absolute;left:56px;bottom:48px;max-width:820px;color:#fff;font-family:'Outfit',sans-serif;text-shadow:0 2px 12px rgba(0,0,0,.8)">
  <div class="nm" style="font-size:40px;font-weight:300;letter-spacing:.04em;line-height:1.1">{{p.nome}}</div>
  <div class="sb" style="font-size:26px;font-weight:300;color:#cfd8e6;margin-top:6px;letter-spacing:.02em">{{p.sub}}</div>
 </div>
 <div class="cr" style="position:absolute;right:40px;bottom:40px;color:rgba(255,255,255,.72);font-family:'Outfit',sans-serif;font-size:24px;font-weight:300;text-shadow:0 2px 8px rgba(0,0,0,.9)">{{p.credito}}</div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}";
  const a=+P.amount||0.08, fi=+P.fade_in||0, fo=+P.fade_out||0;
  const m=P.motion||"zoom_in"; let f={scale:1+a,xPercent:0,yPercent:0}, t={scale:1+a,xPercent:0,yPercent:0};
  if(m==="zoom_in"){f.scale=1.0;t.scale=1+a;} else if(m==="zoom_out"){f.scale=1+a;t.scale=1.0;}
  else if(m==="pan_left"){f.xPercent=a*40;t.xPercent=-a*40;} else if(m==="pan_right"){f.xPercent=-a*40;t.xPercent=a*40;}
  else if(m==="pan_up"){f.yPercent=a*40;t.yPercent=-a*40;}
  tl.fromTo(id+" .ph",f,{...t,duration:D,ease:"none",immediateRender:true},S);
  if(fi>0) tl.fromTo(id,{opacity:0},{opacity:1,duration:fi,ease:"sine.inOut",immediateRender:true},S);
  if(fo>0) tl.to(id,{opacity:0,duration:fo,ease:"sine.inOut"},S+D-fo);
  if(!P.nome) document.querySelector(id+" .lb").style.display="none";
  if(!P.sub) document.querySelector(id+" .sb").style.display="none";
  tl.fromTo(id+" .lb",{opacity:0,y:14},{opacity:1,y:0,duration:1.0,ease:"power2.out",immediateRender:true},S+Math.min(1.0,D*.25));
  tl.to(id+" .lb",{opacity:0,duration:.6},S+D-.9);
  tl.fromTo(id+" .cr",{opacity:0},{opacity:1,duration:1.0,immediateRender:true},S+Math.min(1.0,D*.25));
})(window.__timelines.main, {{json}});
</script>
