<!--params {"modo":"sem-gelo","foco":[-82,60],"zoom0":1.0,"zoom1":0.9,"el":58,"az0":0,"az1":10,"derrete_ini":0.15,"derrete_fim":0.85,"exag":35,"linhas":[],"circulos":[],"pinos":[],"setores":[],"contorno":null,"rotulo":"","numero":"","sub":"","hm_bed":"img/hm_bed.png","hm_sur":"img/hm_sur.png","hm_ice":"img/hm_ice.png","tex_globo":"","fade_in":0.5,"fade_out":0}-->
<div id="{{id}}" class="uwr" style="position:absolute;inset:0;overflow:hidden;background:#0c1726">
 <canvas class="c2" width="{{W}}" height="{{H}}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
 <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 52%,rgba(4,10,20,.75) 100%);pointer-events:none"></div>
 <div class="pins" style="position:absolute;inset:0"></div>
 <div class="rot" style="position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;align-items:center;background:rgba(8,12,20,.82);padding:8px 18px 8px 0;white-space:nowrap">
  <span style="width:6px;align-self:stretch;background:#f5c518;margin-right:14px"></span>
  <span class="rt" style="font:800 28px 'Montserrat',sans-serif;color:#fff;letter-spacing:.03em;text-transform:uppercase">{{p.rotulo}}</span>
 </div>
 <div class="num" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center">
  <div class="nv" style="font:900 108px/1 'Montserrat',sans-serif;color:#f5c518;-webkit-text-stroke:2px #3a2a00;text-shadow:0 6px 24px rgba(0,0,0,.7)">{{p.numero}}</div>
  <div class="ns" style="display:inline-block;margin-top:14px;font:800 30px 'Montserrat',sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.04em;background:rgba(8,12,20,.6);padding:4px 14px">{{p.sub}}</div>
 </div>
 <img class="h1" src="{{p.hm_bed}}" style="display:none"><img class="h2" src="{{p.hm_sur}}" style="display:none"><img class="h3" src="{{p.hm_ice}}" style="display:none"><img class="tg" src="{{p.tex_globo}}" style="display:none">
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}", R=document.querySelector(id), W={{W}}, H={{H}};
  const fi=+P.fade_in||0, fo=+P.fade_out||0;
  if(fi>0) tl.fromTo(id,{opacity:0},{opacity:1,duration:fi,ease:"sine.inOut",immediateRender:true},S);
  if(fo>0) tl.to(id,{opacity:0,duration:fo,ease:"sine.inOut"},S+D-fo);
  if(!P.rotulo) R.querySelector(".rot").style.display="none";
  else tl.fromTo(id+" .rot",{opacity:0,y:-10},{opacity:1,y:0,duration:.6,ease:"power2.out",immediateRender:true},S+.4);
  if(!P.numero&&!P.sub) R.querySelector(".num").style.display="none";
  else { if(!P.numero) R.querySelector(".nv").style.display="none"; if(!P.sub) R.querySelector(".ns").style.display="none";
    tl.fromTo(id+" .num",{opacity:0,scale:.85},{opacity:1,scale:1,duration:.7,ease:"power3.out",immediateRender:true},S+.5); }
  if(!window.THREE) return;
  const T=THREE, rad=Math.PI/180;
  // EPSG:3031 (estereográfica polar sul, paralelo padrão -71) -> km
  const ps=(lat,lon)=>{const a=6378.137,e=0.0818191908,f=-lat*rad,fc=71*rad;
    const tt=x=>Math.tan(Math.PI/4-x/2)/Math.pow((1-e*Math.sin(x))/(1+e*Math.sin(x)),e/2);
    const mc=Math.cos(fc)/Math.sqrt(1-e*e*Math.sin(fc)*Math.sin(fc)); const r=a*mc*tt(f)/tt(fc);
    return [r*Math.sin(lon*rad), r*Math.cos(lon*rad)];};
  const EXT=3333.5, SZ=100, EX=+P.exag||35, KH=SZ/(2*EXT)*EX/1000;   // altura: metros -> unidades
  const toW=(xkm,ykm,hm)=>new T.Vector3(xkm/EXT*SZ/2, (hm||0)*KH, -ykm/EXT*SZ/2);
  const U=window.__UW=window.__UW||{};
  function hyps(h){ // paleta hipsométrica (estilo BEDMAP)
    const st=[[-6000,[10,24,46]],[-2500,[18,52,92]],[-1000,[30,96,140]],[-300,[58,150,170]],[0,[120,200,190]],[1,[96,160,90]],[600,[150,180,90]],[1300,[214,196,104]],[2000,[218,146,66]],[2800,[168,98,58]],[3600,[236,226,214]]];
    if(h<=st[0][0]) return st[0][1]; for(let i=1;i<st.length;i++){ if(h<=st[i][0]){ const [a,ca]=st[i-1],[b,cb]=st[i],k=(h-a)/(b-a); return ca.map((v,j)=>v+(cb[j]-v)*k);} } return st[st.length-1][1]; }
  function build(){
    if(U.ok) return true;
    const im=[R.querySelector(".h1"),R.querySelector(".h2"),R.querySelector(".h3")];
    if(im.some(x=>!x.complete||!x.naturalWidth)) return false;
    const N=im[0].naturalWidth, rd=(img,two)=>{const c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d");x.drawImage(img,0,0);const d=x.getImageData(0,0,N,N).data;const o=new Float32Array(N*N);for(let i=0;i<N*N;i++)o[i]=two?((d[i*4]<<8|d[i*4+1])-10000):d[i*4]/255;return o;};
    const bed=rd(im[0],1), sur=rd(im[1],1), ice=rd(im[2],0);
    const G=512, st=N/G;
    U.ren=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); U.ren.setSize(W,H,false); U.ren.setPixelRatio(1);
    U.sc=new T.Scene(); U.sc.background=new T.Color(0x0c1726); U.cam=new T.PerspectiveCamera(32,W/H,.1,2000);
    U.sc.add(new T.HemisphereLight(0xdfe9ff,0x1a2a40,.55)); const dl=new T.DirectionalLight(0xffffff,1.05); dl.position.set(-60,80,-40); U.sc.add(dl);
    const mk=(sel)=>{const g=new T.PlaneGeometry(SZ,SZ,G-1,G-1); g.rotateX(-Math.PI/2); const p=g.attributes.position, col=new Float32Array(G*G*3);
      for(let r=0;r<G;r++)for(let c=0;c<G;c++){const i=r*G+c, k=Math.min(N-1,Math.floor(r*st))*N+Math.min(N-1,Math.floor(c*st)); const v=sel(k); p.setY(i,v.h*KH); col.set(v.c,i*3);}
      g.setAttribute("color",new T.BufferAttribute(col,3)); g.computeVertexNormals(); return g;};
    const gb=mk(k=>{const h=bed[k]; const c=hyps(h).map(v=>v/255); return {h:Math.max(h,-2600),c};});
    const gi=mk(k=>{const isI=ice[k]>.5; if(isI){const s=sur[k], w=.86+Math.min(.12,s/30000); return {h:s,c:[w,w+.04,1]};} const h=bed[k]; return h>0?{h,c:hyps(h).map(v=>v/255)}:{h:-30,c:[.05,.11,.2]};});
    gi.morphAttributes.position=[gb.attributes.position]; gi.morphAttributes.normal=[gb.attributes.normal];
    U.mb=new T.Mesh(gb,new T.MeshStandardMaterial({vertexColors:true,roughness:.92,metalness:0}));
    U.mi=new T.Mesh(gi,new T.MeshStandardMaterial({vertexColors:true,roughness:.75,metalness:0,transparent:true}));
    U.mi.morphTargetInfluences=[0]; U.mi.renderOrder=2; U.sc.add(U.mb); U.sc.add(U.mi);
    U.hAt=(xkm,ykm)=>{const c=Math.round((xkm/EXT*.5+.5)*(N-1)), r=Math.round((-ykm/EXT*.5+.5)*(N-1)); const k=Math.max(0,Math.min(N-1,r))*N+Math.max(0,Math.min(N-1,c)); return {bed:bed[k],sur:ice[k]>.5?sur[k]:Math.max(bed[k],0)};};
    U.ok=true; return true;
  }
  const c2=R.querySelector(".c2").getContext("2d"), pinBox=R.querySelector(".pins");
  const M=P.modo||"sem-gelo"; let grp=null, pinEls=[], globe=null;
  function extras(){
    if(grp) return; grp=new T.Group();
    const surfH=(x,y)=>{const h=U.hAt(x,y); return (M==="gelo"?h.sur:h.bed)+60;};
    const line=(pts,cor,w)=>{const v=pts.map(q=>{const [x,y]=q.length===2&&Math.abs(q[0])<=90&&!q.km?ps(q[0],q[1]):q; return toW(x,y,Math.max(surfH(x,y),200)+250);});
      const cv=new T.CatmullRomCurve3(v); const tg=new T.TubeGeometry(cv,Math.max(40,v.length*12),w||.18,6,false);
      grp.add(new T.Mesh(tg,new T.MeshBasicMaterial({color:new T.Color(cor||"#ff9a2e")})));
      const gl=new T.Mesh(new T.TubeGeometry(cv,Math.max(40,v.length*12),(w||.18)*3,6,false),new T.MeshBasicMaterial({color:new T.Color(cor||"#ff9a2e"),transparent:true,opacity:.25,depthWrite:false})); grp.add(gl);};
    (P.linhas||[]).forEach(l=>line(l.pts,l.cor,l.w));
    (P.circulos||[]).forEach(c=>{const [cx,cy]=ps(c.c[0],c.c[1]), r=c.r_km||250, nd=28;
      for(let d=0;d<nd;d++){ const pts=[]; for(let j=0;j<=6;j++){const a=(d+j/6*.6)/nd*2*Math.PI, x=cx+r*Math.cos(a), y=cy+r*Math.sin(a); pts.push(toW(x,y,Math.max(surfH(x,y),200)+250));}
        grp.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),8,c.w||.2,5,false),new T.MeshBasicMaterial({color:new T.Color(c.cor||"#ff4545")}))); } });
    (P.setores||[]).forEach(z=>{ const pts=[new T.Vector2(0,0)]; const r=z.r_km||2600; for(let i=0;i<=40;i++){const lon=z.lon0+(z.lon1-z.lon0)*i/40; const [x,y]=ps(-90+r/111,lon); const w=toW(x,y,0); pts.push(new T.Vector2(w.x,-w.z));}
      const sg=new T.ShapeGeometry(new T.Shape(pts)); sg.rotateX(-Math.PI/2); const sm=new T.Mesh(sg,new T.MeshBasicMaterial({color:new T.Color(z.cor||"#ff4545"),transparent:true,opacity:z.op||.38,depthWrite:false,side:T.DoubleSide})); sm.position.y=2.5; grp.add(sm);
      const b=pts.slice(1).map(v=>new T.Vector3(v.x,2.52,-v.y)); b.unshift(new T.Vector3(0,2.52,0)); b.push(new T.Vector3(0,2.52,0));
      grp.add(new T.Line(new T.BufferGeometry().setFromPoints(b),new T.LineBasicMaterial({color:new T.Color(z.cor||"#ff4545")}))); });
    if(P.contorno){ for(const [key,cor] of [["usa","#ff4d5e"],["mex","#2ee08a"]]){ (P.contorno[key]||[]).forEach(ring=>{ const rot=(P.contorno.rot||0)*rad, ox=P.contorno.dx||0, oy=P.contorno.dy||0;
        const v=ring.map(([x,y])=>{const X=x*Math.cos(rot)-y*Math.sin(rot)+ox, Y=x*Math.sin(rot)+y*Math.cos(rot)+oy; return toW(X,Y,Math.max(surfH(X,Y),0)+400);}); v.push(v[0]);
        const cv=new T.CatmullRomCurve3(v,true); grp.add(new T.Mesh(new T.TubeGeometry(cv,v.length*2,.16,5,true),new T.MeshBasicMaterial({color:new T.Color(cor)})));
        const sh=new T.Shape(v.map(p=>new T.Vector2(p.x,-p.z))); const sg=new T.ShapeGeometry(sh); sg.rotateX(-Math.PI/2); const sm=new T.Mesh(sg,new T.MeshBasicMaterial({color:new T.Color(cor),transparent:true,opacity:.28,depthWrite:false,side:T.DoubleSide})); sm.position.y=Math.max(...v.map(p=>p.y))+.05; grp.add(sm); }); } }
    (P.pinos||[]).forEach(p=>{ const [x,y]=ps(p.c[0],p.c[1]); const e=document.createElement("div");
      e.style.cssText="position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;opacity:0";
      e.innerHTML='<div style="display:flex;align-items:center;background:rgba(8,12,20,.85);padding:6px 14px 6px 0;white-space:nowrap"><span style="width:5px;align-self:stretch;background:#f5c518;margin-right:10px"></span><span style="font:800 26px Montserrat,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.03em">'+p.label+'</span></div><div style="width:2px;height:46px;background:#f5c518"></div><div style="width:14px;height:14px;border-radius:50%;background:#f5c518;box-shadow:0 0 14px #f5c518;margin-top:-7px"></div>';
      pinBox.appendChild(e); pinEls.push({e,x,y,t:p.t||.8}); });
  }
  function globo(){
    if(globe) return true; const im=R.querySelector(".tg"); if(!im.complete||!im.naturalWidth) return false;
    U.gren=U.gren||new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); U.gren.setSize(W,H,false);
    const sc=new T.Scene(); sc.background=new T.Color(0x000000); const cam=new T.PerspectiveCamera(30,W/H,.1,100);
    const tx=new T.Texture(im); tx.needsUpdate=true; if(T.SRGBColorSpace) tx.colorSpace=T.SRGBColorSpace;
    const sp=new T.Mesh(new T.SphereGeometry(1,96,64),new T.MeshStandardMaterial({map:tx,roughness:1})); sc.add(sp);
    sc.add(new T.AmbientLight(0xffffff,.35)); const dl=new T.DirectionalLight(0xffffff,1.2); dl.position.set(-3,1,4); sc.add(dl);
    const at=new T.Mesh(new T.SphereGeometry(1.04,64,48),new T.MeshBasicMaterial({color:0x4a90ff,transparent:true,opacity:.12,side:T.BackSide})); sc.add(at);
    globe={sc,cam,sp}; return true;
  }
  const foco=Array.isArray(P.foco)?ps(P.foco[0],P.foco[1]):[0,0];
  const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  function upd(t){
    const k=Math.max(0,Math.min(1,t/Math.max(D,.01))), e=ease(k);
    if(M==="globo"){ if(!globo()) return; const g=globe; const lat=(P.el0!=null?P.el0:-20)+((P.el1!=null?P.el1:-70)-(P.el0!=null?P.el0:-20))*e;
      g.sp.rotation.y=(P.az0||0)*rad+((P.az1||40)-(P.az0||0))*rad*e; const d=(P.zoom0||4.2)+((P.zoom1||3.2)-(P.zoom0||4.2))*e;
      g.cam.position.set(0,d*Math.sin(lat*rad),d*Math.cos(lat*rad)); g.cam.lookAt(0,0,0); U.gren.render(g.sc,g.cam); c2.drawImage(U.gren.domElement,0,0,W,H); return; }
    if(!build()) return; extras();
    U.sc.add(grp);
    let m=0; if(M==="sem-gelo") m=1; else if(M==="derrete"){ const a=+P.derrete_ini||0, b=+P.derrete_fim||1; m=Math.max(0,Math.min(1,(k-a)/Math.max(.01,b-a))); m=ease(m); }
    U.mi.morphTargetInfluences[0]=m; U.mi.material.opacity=M==="gelo"?1:Math.max(0,1-Math.max(0,(m-.3)/.6)); U.mi.visible=U.mi.material.opacity>.01;
    const z=(+P.zoom0||1)+((+P.zoom1||1)-(+P.zoom0||1))*e, az=((+P.az0||0)+((+P.az1||0)-(+P.az0||0))*e)*rad, el=(+P.el||58)*rad, dist=118*z;
    const f=toW(foco[0],foco[1],0); U.cam.position.set(f.x+dist*Math.cos(el)*Math.sin(az), dist*Math.sin(el), f.z+dist*Math.cos(el)*Math.cos(az)); U.cam.lookAt(f);
    U.ren.render(U.sc,U.cam); c2.drawImage(U.ren.domElement,0,0,W,H); U.sc.remove(grp);
    for(const p of pinEls){ const h=U.hAt(p.x,p.y); const v=toW(p.x,p.y,(m>.5?h.bed:h.sur)+150).project(U.cam);
      p.e.style.left=((v.x*.5+.5)*W)+"px"; p.e.style.top=((-v.y*.5+.5)*H)+"px"; p.e.style.opacity=Math.max(0,Math.min(1,(t-p.t)/.5)); }
  }
  const o={_t:-1}; Object.defineProperty(o,"t",{get(){return this._t},set(v){this._t=v;upd(v);}});
  tl.fromTo(o,{t:0},{t:D,duration:D,ease:"none",immediateRender:true},S);
})(window.__timelines.main, {{json}});
</script>
