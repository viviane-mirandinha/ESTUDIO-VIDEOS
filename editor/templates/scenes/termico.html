<!--params {"intensidade":0.22,"cor":"rgba(157,255,122,.10)"}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
  <div class="term-scan" style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,{{p.intensidade}}) 3px,rgba(0,0,0,0) 4px)"></div>
  <div class="term-bar" style="position:absolute;left:0;right:0;height:140px;top:-160px;background:linear-gradient(180deg,rgba(255,255,255,0),{{p.cor}},rgba(255,255,255,0))"></div>
  <div class="term-vig" style="position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)"></div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}; const R=document.getElementById("{{id}}");
  const bar=R.querySelector(".term-bar"), sc=R.querySelector(".term-scan"); const st={_k:0}; Object.defineProperty(st,"k",{get(){return this._k},set(v){this._k=v;draw();}});
  function draw(){ const t=st.k*D; bar.style.top=(((t*260)%1020)-160).toFixed(1)+"px";
    sc.style.opacity=(0.85+0.15*Math.sin(t*23.0)).toFixed(3); }
  draw(); tl.fromTo(st,{k:0},{k:1,duration:D,ease:"none",immediateRender:false},S);
})(window.__timelines.main, {{json}});
</script>
