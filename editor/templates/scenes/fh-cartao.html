<!--params {"linha1":"15 de abril de 1989","linha2":"Sheffield · Inglaterra","linha3":"","t2":1.5,"t3":3.0,"tam1":64,"tam2":40,"fundo":"#000000"}-->
<div id="{{id}}" class="fh-cartao" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#2a2724 0%,#0d0c0b 55%,{{p.fundo}} 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Playfair Display','EB Garamond',Georgia,'Times New Roman',serif;color:#f2ede4;text-align:center">
  <div class="l1" style="font-size:{{p.tam1}}px;font-weight:400;letter-spacing:.01em;max-width:1100px;line-height:1.2">{{p.linha1}}</div>
  <div class="rule" style="width:0;height:1px;background:#b9ad98;margin:26px 0 22px"></div>
  <div class="l2" style="font-size:{{p.tam2}}px;font-style:italic;color:#d9d1c3;max-width:1100px;line-height:1.3">{{p.linha2}}</div>
  <div class="l3" style="font-size:{{p.tam2}}px;color:#b9ad98;margin-top:14px;letter-spacing:.08em">{{p.linha3}}</div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}";
  tl.set(id+" .l1,"+id+" .l2,"+id+" .l3",{opacity:0},0); tl.set(id+" .rule",{width:0},0); tl.set(id,{opacity:0},0);
  tl.to(id,{opacity:1,duration:.6,ease:"power1.out"},S);
  tl.fromTo(id+" .l1",{opacity:0,y:14},{opacity:1,y:0,duration:.9,ease:"power2.out",immediateRender:false},S+.15);
  tl.fromTo(id+" .rule",{width:0},{width:220,duration:.9,ease:"power2.inOut",immediateRender:false},S+.4);
  if(P.linha2) tl.fromTo(id+" .l2",{opacity:0,y:10},{opacity:1,y:0,duration:.8,ease:"power2.out",immediateRender:false},S+Number(P.t2));
  if(P.linha3) tl.fromTo(id+" .l3",{opacity:0},{opacity:1,duration:.8,ease:"power1.out",immediateRender:false},S+Number(P.t3));
  tl.to(id,{opacity:0,duration:.5,ease:"power1.in"},S+D-.5);
})(window.__timelines.main, {{json}});
</script>
