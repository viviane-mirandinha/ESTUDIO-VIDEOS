<!--params {"pose":"parado","fala":"","destaque":"","cenario":"chao","lado":"esq","pose2":"","fala2":"","cor":"#ff5a36","fundo":"#f7f4ec","traco":"#1c1c1c","desenhar":true,"entrada":"nada","zoom":true}-->
<div id="{{id}}" class="stk" style="position:absolute;inset:0;background:{{p.fundo}};overflow:hidden;font-family:'Patrick Hand','Comic Sans MS','Segoe Print',Inter,Arial,sans-serif">
  <svg class="stkSvg" viewBox="0 0 {{W}} {{H}}" width="{{W}}" height="{{H}}" style="position:absolute;inset:0;overflow:visible">
    <g class="cam"><g class="cen"></g><g class="fx"></g><g class="p1"></g><g class="p2"></g></g>
  </svg>
  <div class="stkDest"></div>
  <div class="stkBal b1"><span></span></div>
  <div class="stkBal b2"><span></span></div>
</div>
<style>
#{{id}} .stkDest{position:absolute;color:{{p.traco}};font-weight:800;line-height:1.02;text-align:center;letter-spacing:.5px;opacity:0}
#{{id}} .stkDest mark{background:none;color:{{p.cor}};position:relative}
#{{id}} .stkBal{position:absolute;background:#fff;border:4px solid {{p.traco}};border-radius:28px;padding:12px 22px;color:{{p.traco}};font-weight:700;
  text-align:center;opacity:0;box-shadow:6px 6px 0 #0002;max-width:44%}
#{{id}} .stkBal::after{content:"";position:absolute;bottom:-22px;width:26px;height:26px;background:#fff;border-right:4px solid {{p.traco}};border-bottom:4px solid {{p.traco}};transform:rotate(45deg) skew(12deg,12deg)}
#{{id}} .stkBal.tl::after{left:26%}#{{id}} .stkBal.tr::after{right:26%}
</style>
<script>
(function (tl, P) {
  const S = {{start}}, D = {{dur}}, W = {{W}}, H = {{H}}, ID = "{{id}}";
  const root = document.getElementById(ID), NS = "http://www.w3.org/2000/svg";
  const vert = H > W, u = Math.min(W, H) / 720;
  const INK = P.traco || "#1c1c1c", COR = P.cor || "#ff5a36";
  const SW = 7 * u;                                     // espessura do traço
  const GROUND = vert ? H * 0.70 : H * 0.84;
  const ESC = (vert ? 1.7 : 1.22) * u;                 // tamanho do boneco (altura ~ 300*ESC)
  const dois = !!P.pose2;
  const lado = P.lado === "dir" ? 1 : -1;
  const X1 = dois ? (vert ? W * 0.30 : W * 0.30) : vert ? W * 0.5 : (lado < 0 ? W * 0.28 : W * 0.72);
  const X2 = vert ? W * 0.70 : W * 0.72;
  const el = (tag, at, pai) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (pai) pai.appendChild(e); return e; };
  const q = (s) => root.querySelector(s);
  const traco = { stroke: INK, "stroke-width": SW, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" };

  // ------------------------------------------------ cenário (desenhado em linha; "desenha" na entrada)
  const cen = q(".cen"), linhas = [];
  const L = (tag, at) => { const e = el(tag, { ...traco, "stroke-width": SW * 0.8, opacity: 0.9, pathLength: 1, ...at }, cen); linhas.push(e); return e; };
  const ox = dois ? W * 0.5 : (vert ? W * 0.5 : (lado < 0 ? W * 0.72 : W * 0.28));   // lado livre do quadro
  const c = P.cenario || "chao";
  if (c !== "vazio") el("path", { ...traco, "stroke-width": SW * 0.8, opacity: 0.9, d: `M ${-20} ${GROUND} L ${W + 20} ${GROUND}` }, cen);   // chão fica sempre (não "se desenha")
  if (c === "casa") {
    const w = 260 * u, h = 190 * u, x = vert ? W * 0.5 - w / 2 : ox - w / 2, y = GROUND - h;
    if (!vert) { L("rect", { x, y, width: w, height: h }); L("path", { d: `M ${x - 20 * u} ${y} L ${x + w / 2} ${y - 120 * u} L ${x + w + 20 * u} ${y}` });
      L("rect", { x: x + w * 0.4, y: y + h * 0.45, width: w * 0.22, height: h * 0.55 }); L("rect", { x: x + w * 0.1, y: y + h * 0.2, width: w * 0.2, height: w * 0.2 }); }
    else { const yy = H * 0.36; L("rect", { x, y: yy, width: w, height: h }); L("path", { d: `M ${x - 20 * u} ${yy} L ${x + w / 2} ${yy - 120 * u} L ${x + w + 20 * u} ${yy}` }); }
  } else if (c === "cidade") {
    let x = -10 * u; let k = 0;
    while (x < W) { const w = (70 + ((k * 37) % 60)) * u, h = (120 + ((k * 53) % 170)) * u * (vert ? 1.6 : 1);
      const yb = vert ? H * 0.5 : GROUND; L("rect", { x, y: yb - h, width: w, height: h, opacity: 0.35 });
      for (let j = 1; j < h / (40 * u) - 1; j += 2) L("path", { d: `M ${x + w * 0.3} ${yb - h + j * 40 * u} l ${w * 0.4} 0`, opacity: 0.3 });
      x += w + 14 * u; k++; }
  } else if (c === "escritorio") {
    const dx = vert ? W * 0.5 : ox, dy = vert ? H * 0.5 : GROUND - 120 * u;
    L("path", { d: `M ${dx - 170 * u} ${dy} L ${dx + 170 * u} ${dy} M ${dx - 150 * u} ${dy} L ${dx - 150 * u} ${dy + 120 * u} M ${dx + 150 * u} ${dy} L ${dx + 150 * u} ${dy + 120 * u}` });
    L("rect", { x: dx - 80 * u, y: dy - 120 * u, width: 160 * u, height: 100 * u, rx: 8 * u });
    L("path", { d: `M ${dx} ${dy - 20 * u} L ${dx} ${dy}` });
  } else if (c === "natureza") {
    const tx = vert ? (lado < 0 ? W * 0.9 : W * 0.1) : ox + 60 * u, ty = GROUND, tr = (vert ? 62 : 75) * u, th = (vert ? 230 : 150) * u;   // árvore sempre no chão
    L("path", { d: `M ${tx} ${ty} L ${tx} ${ty - th}` }); L("circle", { cx: tx, cy: ty - th - tr + 4 * u, r: tr });
    L("circle", { cx: vert ? W * 0.82 : (lado < 0 ? W * 0.08 : W * 0.92), cy: vert ? H * 0.06 : H * 0.11, r: 38 * u, stroke: COR });   // sol do lado do boneco (não cobre o texto)
    L("path", { d: `M 0 ${GROUND - 40 * u} Q ${W * 0.25} ${GROUND - 110 * u} ${W * 0.5} ${GROUND - 40 * u} T ${W} ${GROUND - 50 * u}`, opacity: 0.35 });
  } else if (c === "quadro") {
    const bw = vert ? W * 0.84 : W * 0.44, bh = vert ? H * 0.26 : H * 0.42, bx = vert ? W * 0.08 : ox - bw / 2, by = vert ? H * 0.1 : H * 0.12;
    L("rect", { x: bx, y: by, width: bw, height: bh, rx: 10 * u });
    L("path", { d: `M ${bx + bw * 0.3} ${by + bh} L ${bx + bw * 0.22} ${by + bh + 70 * u} M ${bx + bw * 0.7} ${by + bh} L ${bx + bw * 0.78} ${by + bh + 70 * u}` });
  } else if (c === "palco") {
    L("path", { d: `M 0 ${H * 0.05} Q ${W * 0.12} ${H * 0.35} ${W * 0.06} ${GROUND}`, stroke: COR }); L("path", { d: `M ${W} ${H * 0.05} Q ${W * 0.88} ${H * 0.35} ${W * 0.94} ${GROUND}`, stroke: COR });
    L("path", { d: `M ${W * 0.5 - 40 * u} 0 L ${X1 - 160 * u} ${GROUND} M ${W * 0.5 + 40 * u} 0 L ${X1 + 160 * u} ${GROUND}`, opacity: 0.25 });
  }
  linhas.forEach((e, i) => {
    e.setAttribute("stroke-dasharray", "1 1");
    if (P.desenhar) tl.fromTo(e, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power1.inOut", immediateRender: false }, S + 0.02 + Math.min(0.6, i * 0.03));
    if (P.desenhar && S > 0) tl.set(e, { attr: { "stroke-dashoffset": 1 } }, 0);
  });

  // ------------------------------------------------ boneco de palito (ângulos em graus: 0 = pra baixo, 90 = direita, 180 = pra cima)
  const POSES = {
    parado:      { aL: [-14, -8], aR: [14, 8], lL: [-9, -4], lR: [9, 4], tilt: 0, boca: "sorri" },
    explicando:  { aL: [-14, -8], aR: [55, 118], lL: [-9, -4], lR: [9, 4], tilt: -3, boca: "fala" },
    apontando:   { aL: [-14, -6], aR: [96, 93], lL: [-9, -4], lR: [11, 4], tilt: -4, boca: "fala" },
    pensando:    { aL: [-35, 48], aR: [30, -164], lL: [-7, -3], lR: [7, 3], tilt: 9, boca: "reta" },
    surpreso:    { aL: [-140, -160], aR: [140, 160], lL: [-15, -8], lR: [15, 8], tilt: 0, boca: "o" },
    comemorando: { aL: [-155, -172], aR: [155, 172], lL: [-14, -2], lR: [14, 2], tilt: 0, boca: "sorri" },
    andando:     { aL: [-25, -15], aR: [25, 15], lL: [-22, -6], lR: [22, 6], tilt: 0, boca: "sorri" },
    triste:      { aL: [-6, -2], aR: [6, 2], lL: [-6, -2], lR: [6, 2], tilt: 14, boca: "triste" },
  };
  const R = Math.PI / 180, V = (a, l) => [Math.sin(a * R) * l, Math.cos(a * R) * l];
  function boneco(gp, X, nome, falaSel, espelho, atraso) {
    const pose = POSES[nome] ? nome : "parado", P0 = POSES[pose];
    const g = el("g", {}, gp), corpo = el("g", {}, g);
    const parte = () => el("path", { ...traco }, corpo);
    const tronco = parte(), bL = parte(), bR = parte(), pL = parte(), pR = parte();
    const cab = el("circle", { ...traco, r: 30, fill: P.fundo || "#f7f4ec" }, corpo);
    const olhoL = el("circle", { r: 3.6, fill: INK }, corpo), olhoR = el("circle", { r: 3.6, fill: INK }, corpo);
    const boca = el("path", { ...traco, "stroke-width": SW * 0.6 }, corpo);
    const st = { aL0: P0.aL[0], aL1: P0.aL[1], aR0: P0.aR[0], aR1: P0.aR[1], lL0: P0.lL[0], lL1: P0.lL[1], lR0: P0.lR[0], lR1: P0.lR[1], tilt: P0.tilt, y: 0, x: X, sq: 1 };
    if (espelho) ["aL0", "aL1", "aR0", "aR1", "lL0", "lL1", "lR0", "lR1"].forEach((k) => (st[k] = -st[k]));
    if (espelho) { [st.aL0, st.aR0] = [st.aR0, st.aL0]; [st.aL1, st.aR1] = [st.aR1, st.aL1]; }
    const desenha = () => {
      const k = ESC, quadril = [0, -120], ombro = [0, -212], pesc = [0, -232];
      const t = st.tilt * R, hx = Math.sin(t) * 32, hy = -262 + (1 - Math.cos(t)) * 4;
      const seg = (o, a0, a1, l0, l1) => { const e = [o[0] + V(a0, l0)[0], o[1] + V(a0, l0)[1]]; const m = [e[0] + V(a1, l1)[0], e[1] + V(a1, l1)[1]]; return `M ${o[0]} ${o[1]} L ${e[0]} ${e[1]} L ${m[0]} ${m[1]}`; };
      tronco.setAttribute("d", `M ${pesc[0]} ${pesc[1]} L ${quadril[0]} ${quadril[1]}`);
      bL.setAttribute("d", seg(ombro, st.aL0, st.aL1, 58, 52)); bR.setAttribute("d", seg(ombro, st.aR0, st.aR1, 58, 52));
      pL.setAttribute("d", seg(quadril, st.lL0, st.lL1, 62, 60)); pR.setAttribute("d", seg(quadril, st.lR0, st.lR1, 62, 60));
      cab.setAttribute("cx", hx); cab.setAttribute("cy", hy);
      const ol = espelho ? -1 : 1, oh = P0.tilt && pose === "pensando" ? 6 * ol : 0;
      olhoL.setAttribute("cx", hx - 10 + oh); olhoL.setAttribute("cy", hy - 5); olhoR.setAttribute("cx", hx + 10 + oh); olhoR.setAttribute("cy", hy - 5);
      const b = P0.boca, by = hy + 11;
      boca.setAttribute("d", b === "o" ? `M ${hx - 5} ${by} a 5 6 0 1 0 10 0 a 5 6 0 1 0 -10 0` : b === "reta" ? `M ${hx - 8} ${by + 2} L ${hx + 8} ${by}`
        : b === "triste" ? `M ${hx - 10} ${by + 6} Q ${hx} ${by - 4} ${hx + 10} ${by + 6}` : b === "fala" ? `M ${hx - 9} ${by} Q ${hx} ${by + 10 * st.sq} ${hx + 9} ${by}` : `M ${hx - 11} ${by} Q ${hx} ${by + 10} ${hx + 11} ${by}`);
      g.setAttribute("transform", `translate(${st.x} ${GROUND - 4 + st.y}) scale(${k})`);
    };
    desenha();
    const A = (vars, dur, at, extra) => tl.to(st, { ...vars, duration: dur, ease: "sine.inOut", onUpdate: desenha, immediateRender: false, ...(extra || {}) }, at);
    const T0 = S + (atraso || 0), fimCena = S + D;
    // entrada
    if (P.entrada === "anda" && !espelho) {
      const de = X < W / 2 ? -180 * u : W + 180 * u;
      tl.fromTo(st, { x: de }, { x: X, duration: Math.min(1.4, D * 0.5), ease: "power1.out", onUpdate: desenha, immediateRender: false }, T0);
      const passos = Math.max(1, Math.round(Math.min(1.4, D * 0.5) / 0.32));
      tl.fromTo(st, { lL0: -24, lR0: 24, aL0: 22, aR0: -22 }, { lL0: 24, lR0: -24, aL0: -22, aR0: 22, duration: 0.32, repeat: passos - 1, yoyo: true, ease: "sine.inOut", onUpdate: desenha, immediateRender: false }, T0);
      tl.to(st, { lL0: P0.lL[0], lR0: P0.lR[0], aL0: P0.aL[0], aR0: P0.aR[0], duration: 0.25, onUpdate: desenha, immediateRender: false }, T0 + passos * 0.32);
    } else if (P.entrada === "pula") {
      tl.fromTo(st, { y: -60 * u / ESC * 0 - 80, sq: 1 }, { y: 0, duration: 0.45, ease: "bounce.out", onUpdate: desenha, immediateRender: false }, T0);
    }
    // vida por pose (tudo em tempo absoluto; repeat finito = seguro pra seek)
    const vivo = Math.max(0.6, fimCena - T0 - 0.2), dentro = T0 + (P.entrada === "anda" ? Math.min(1.6, D * 0.55) : 0.15);
    const ciclos = (per) => Math.max(0, Math.floor((fimCena - dentro) / per) - 1);
    if (pose === "andando") {
      tl.to(st, { lL0: 24, lR0: -24, aL0: -24, aR0: 24, lL1: 4, lR1: -4, duration: 0.34, repeat: ciclos(0.34), yoyo: true, ease: "sine.inOut", onUpdate: desenha, immediateRender: false }, dentro);
      tl.to(st, { y: -6, duration: 0.17, repeat: ciclos(0.17), yoyo: true, ease: "sine.inOut", onUpdate: desenha, immediateRender: false }, dentro);
    } else if (pose === "comemorando") {
      tl.to(st, { y: -46, duration: 0.28, repeat: ciclos(0.28), yoyo: true, ease: "power1.out", onUpdate: desenha, immediateRender: false }, dentro);
      tl.to(st, { aL1: st.aL1 + 25, aR1: st.aR1 - 25, duration: 0.28, repeat: ciclos(0.28), yoyo: true, onUpdate: desenha, immediateRender: false }, dentro);
    } else if (pose === "explicando" || pose === "apontando") {
      tl.to(st, { aR0: st.aR0 + (pose === "apontando" ? 6 : 14), aR1: st.aR1 + 10, tilt: st.tilt + 2, duration: 0.55, repeat: ciclos(0.55), yoyo: true, onUpdate: desenha, immediateRender: false }, dentro);
    } else if (pose === "pensando") {
      tl.to(st, { tilt: st.tilt - 5, duration: 0.9, repeat: ciclos(0.9), yoyo: true, onUpdate: desenha, immediateRender: false }, dentro);
    } else if (pose === "surpreso") {
      tl.fromTo(st, { y: 0 }, { y: -26, duration: 0.16, yoyo: true, repeat: 1, onUpdate: desenha, immediateRender: false }, dentro);
      tl.to(st, { aL0: st.aL0 - 8, aR0: st.aR0 + 8, duration: 0.45, repeat: ciclos(0.45), yoyo: true, onUpdate: desenha, immediateRender: false }, dentro + 0.35);
    } else {
      tl.to(st, { y: -3, aL0: st.aL0 - 3, aR0: st.aR0 + 3, duration: 1.1, repeat: ciclos(1.1), yoyo: true, onUpdate: desenha, immediateRender: false }, dentro);
    }
    if (falaSel) tl.to(st, { sq: 0.2, duration: 0.12, repeat: Math.max(0, Math.floor((D - 0.6) / 0.12) - 1), yoyo: true, onUpdate: desenha, immediateRender: false }, S + 0.25);
    // efeitos simples ao redor da cabeça
    const fx = q(".fx"), cx = X, cy = GROUND - 262 * ESC;
    const fxs = [];
    if (pose === "pensando") [0, 1, 2].forEach((i) => fxs.push(el("circle", { cx: cx + (40 + i * 26) * ESC * (espelho ? -1 : 1), cy: cy - (40 + i * 30) * ESC, r: (6 + i * 4) * ESC, ...traco, "stroke-width": SW * 0.6 }, fx)));
    if (pose === "pensando") { const t = el("text", { x: cx + 128 * ESC * (espelho ? -1 : 1), y: cy - 128 * ESC, fill: COR, "font-size": 70 * ESC, "font-weight": 800, "text-anchor": "middle" }, fx); t.textContent = "?"; fxs.push(t); }
    if (pose === "surpreso") [-1, 1].forEach((s) => [0, 1, 2].forEach((i) => fxs.push(el("path", { d: `M ${cx + s * (44 + i * 6) * ESC} ${cy - (30 - i * 26) * ESC} l ${s * 30 * ESC} ${-(14 - i * 14) * ESC}`, ...traco, stroke: COR, "stroke-width": SW * 0.7 }, fx))));
    if (pose === "comemorando") for (let i = 0; i < 14; i++) { const a = i * 137.5 * R, r = (90 + (i * 23) % 70) * ESC;
      fxs.push(el("rect", { x: cx + Math.cos(a) * r, y: cy - 40 * ESC + Math.sin(a) * r * 0.7, width: 12 * ESC, height: 6 * ESC, fill: i % 2 ? COR : INK, transform: `rotate(${i * 40} ${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r * 0.7})` }, fx)); }
    fxs.forEach((e, i) => { tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, dentro + 0.1 + i * 0.04); if (S > 0) tl.set(e, { opacity: 0 }, 0); });
    return { cabX: () => st.x, topo: GROUND - 300 * ESC };
  }
  const b1 = boneco(q(".p1"), X1, P.pose, !!P.fala, false, 0);
  const b2 = dois ? boneco(q(".p2"), X2, P.pose2, !!P.fala2, true, 0.12) : null;

  // ------------------------------------------------ balões de fala
  const FS = (vert ? 46 : 34) * u;
  function balao(sel, txt, X, topo, atraso) {
    const b = q(sel); if (!txt) { b.style.display = "none"; return; }
    b.querySelector("span").textContent = txt;
    b.style.fontSize = FS + "px";
    if (vert) b.style.maxWidth = "72%";
    const dir = X < W / 2;
    b.classList.add(dir ? "tl" : "tr");
    if (dir) b.style.left = Math.max(W * 0.03, X - 60 * u) + "px"; else b.style.right = Math.max(W * 0.03, W - X - 60 * u) + "px";
    b.style.top = Math.max(H * 0.04, topo - (b.offsetHeight || FS * 2.4) - 30 * u) + "px";   // logo acima da cabeça (mede o balão já com o texto)
    tl.fromTo(b, { opacity: 0, scale: 0.4, transformOrigin: dir ? "20% 100%" : "80% 100%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, S + 0.2 + atraso);
    if (S > 0) tl.set(b, { opacity: 0 }, 0);
  }
  balao(".b1", P.fala, X1, b1.topo, 0);
  if (b2) balao(".b2", P.fala2, X2, b2.topo, Math.min(1.2, D * 0.45));
  else q(".b2").style.display = "none";

  // ------------------------------------------------ texto-chave grande
  const dst = q(".stkDest");
  if (P.destaque) {
    const pal = String(P.destaque).trim().split(/\s+/);
    const iMax = pal.reduce((m, w, i) => (w.replace(/[^\p{L}\p{N}%$]/gu, "").length > pal[m].replace(/[^\p{L}\p{N}%$]/gu, "").length || /\d/.test(w) ? i : m), 0);
    dst.innerHTML = pal.map((w, i) => (i === iMax ? `<mark>${w.replace(/[<&]/g, "")}</mark>` : w.replace(/[<&]/g, ""))).join(" ");
    const grande = c === "quadro";
    if (vert || dois) { dst.style.left = "6%"; dst.style.right = "6%"; dst.style.top = (vert ? (c === "quadro" ? H * 0.12 : H * 0.075) : H * 0.06) + "px"; dst.style.fontSize = (vert ? 72 : 66) * u + "px"; }
    else { const L0 = lado < 0 ? W * 0.5 : W * 0.06; dst.style.left = L0 + "px"; dst.style.width = W * 0.44 + "px"; dst.style.top = (grande ? H * 0.2 : H * 0.24) + "px"; dst.style.fontSize = 70 * u + "px"; }
    tl.fromTo(dst, { opacity: 0, y: 30 * u, rotation: -2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, S + 0.15);
    if (S > 0) tl.set(dst, { opacity: 0 }, 0);
  }
  // câmera viva (zoom lento)
  if (P.zoom) tl.fromTo(q(".cam"), { scale: 1, svgOrigin: `${W / 2} ${GROUND}` }, { scale: 1.035, duration: D, ease: "none", immediateRender: false }, S);
})(window.__timelines.main, {{json}});
</script>
