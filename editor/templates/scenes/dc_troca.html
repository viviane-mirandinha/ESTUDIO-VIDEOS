<!--params {"de":"","para":"","t_risca":1.0,"t_para":2.2}-->
<div id="{{id}}" style="position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 65%)">
 <div class="de" style="position:relative;font-family:'Barlow',sans-serif;font-weight:700;font-size:60px;color:rgba(255,255,255,.85);text-shadow:0 3px 18px rgba(0,0,0,.95)">{{p.de}}<div class="rk" style="position:absolute;left:-8px;right:-8px;top:52%;height:6px;background:#c8202a;transform-origin:0 50%"></div></div>
 <div class="pa" style="font-family:'Barlow',sans-serif;font-weight:700;font-size:72px;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.95)">{{p.para}}</div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}";
  tl.fromTo(id+" .de",{opacity:0},{opacity:1,duration:.5,immediateRender:true},S);
  tl.fromTo(id+" .rk",{scaleX:0},{scaleX:1,duration:.5,ease:"power2.inOut",immediateRender:true},S+(+P.t_risca||1));
  tl.fromTo(id+" .pa",{opacity:0,y:12},{opacity:1,y:0,duration:.6,ease:"power2.out",immediateRender:true},S+(+P.t_para||2.2));
  tl.to(id,{opacity:0,duration:.4},S+D-.4);
})(window.__timelines.main, {{json}});
</script>
