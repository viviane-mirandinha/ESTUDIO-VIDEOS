<!--params {"valor":"4","unidade":"milhões","legenda":"de massas solares","seed":5}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0f1b30 0%,#060a14 75%)">
 <canvas class="st" width="{{W}}" height="{{H}}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
 <div class="fr" style="position:absolute;left:90px;top:110px;right:90px;bottom:110px;border:1px solid rgba(90,200,230,.45);clip-path:polygon(0 0,140px 0,170px 18px,100% 18px,100% 100%,0 100%);"></div>
 <div class="fr2" style="position:absolute;left:90px;top:110px;width:140px;height:2px;background:rgba(90,200,230,.8)"></div>
 <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:'Outfit',sans-serif">
  <div style="display:flex;align-items:baseline;gap:26px"><span class="v" style="font-size:150px;font-weight:200;line-height:1">{{p.valor}}</span><span class="u" style="font-size:80px;font-weight:200">{{p.unidade}}</span></div>
  <div class="l" style="font-size:40px;font-weight:300;color:#bfe6f2;letter-spacing:.08em;margin-top:14px">{{p.legenda}}</div>
 </div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}", R=document.querySelector(id);
  const c=R.querySelector(".st"), x=c.getContext("2d"), W=c.width, H=c.height; let s=(+P.seed||5)*9973;
  const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const st=[];for(let i=0;i<420;i++)st.push([r()*W,r()*H,.4+r()*1.4,r()*6.28,.2+r()*.8]);
  const draw=t=>{x.clearRect(0,0,W,H);for(const q of st){const a=q[4]*(.55+.45*Math.sin(t*1.5+q[3]));x.fillStyle="rgba(220,235,255,"+a.toFixed(3)+")";x.beginPath();x.arc((q[0]-t*6*q[2]+W)%W,q[1],q[2],0,6.283);x.fill();}};
  const o={_t:0};Object.defineProperty(o,"t",{get(){return this._t},set(v){this._t=v;draw(v)}});
  tl.fromTo(o,{t:0},{t:D,duration:D,ease:"none",immediateRender:true},S);
  const v=R.querySelector(".v"), num=parseFloat(String(P.valor).replace(",","."));
  if(!isNaN(num)&&String(num)===String(P.valor)){const cn={_n:0};Object.defineProperty(cn,"n",{get(){return this._n},set(x){this._n=x;v.textContent=Math.round(x);}});tl.fromTo(cn,{n:0},{n:num,duration:Math.min(1.6,D*.5),ease:"power2.out",immediateRender:true},S+.3);}
  tl.fromTo(id,{opacity:0},{opacity:1,duration:.8,immediateRender:true},S);
  tl.fromTo(id+" .fr, "+id+" .fr2",{opacity:0},{opacity:1,duration:1},S+.2);
  tl.fromTo(id+" .u",{opacity:0,x:-20},{opacity:1,x:0,duration:.8,immediateRender:true},S+.6);
  tl.fromTo(id+" .l",{opacity:0,y:12},{opacity:1,y:0,duration:.8,immediateRender:true},S+1.0);
})(window.__timelines.main, {{json}});
</script>
