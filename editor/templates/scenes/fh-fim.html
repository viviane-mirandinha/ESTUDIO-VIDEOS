<!--params {"bg":"","capa":"","rotulo":"PRÓXIMO VÍDEO","titulo":"Relatório Taylor: como os estádios mudaram","inscreva":"Inscreva-se","sub":"mais casos que a história não esquece","t_inscreva":5.0}-->
<div id="{{id}}" style="position:absolute;inset:0;background:#000;overflow:hidden;font-family:'Playfair Display','EB Garamond',Georgia,serif;color:#f2ede4">
  <div class="bgimg" style="position:absolute;inset:-3%;background:url('{{p.bg}}') center/cover no-repeat;filter:grayscale(.85) sepia(.25) brightness(.45)"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.7) 100%)"></div>
  <div class="box" style="position:absolute;left:640px;top:150px;width:560px;height:315px;border:2px solid #e9e1d3;background:#0c0b0a;overflow:hidden">
    <div style="position:absolute;inset:0;background:url('{{p.capa}}') center/contain no-repeat"></div>
  </div>
  <div class="rot" style="position:absolute;left:640px;top:104px;font-size:28px;letter-spacing:.14em;color:#c9bfae">{{p.rotulo}}</div>
  <div class="ti" style="position:absolute;left:640px;top:482px;width:580px;font-size:34px;line-height:1.25">{{p.titulo}}</div>
  <div class="ins" style="position:absolute;left:80px;top:300px;width:500px">
    <div style="display:inline-block;font-size:48px;padding:12px 34px;border:2px solid #f2ede4;border-radius:6px">{{p.inscreva}}</div>
    <div style="font-size:30px;font-style:italic;color:#d9d1c3;margin-top:22px;line-height:1.3">{{p.sub}}</div>
  </div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}";
  tl.set(id,{opacity:0},0); tl.set(id+" .box,"+id+" .rot,"+id+" .ti,"+id+" .ins",{opacity:0},0);
  tl.to(id,{opacity:1,duration:.6},S);
  tl.fromTo(id+" .bgimg",{scale:1},{scale:1.05,duration:D,ease:"none",immediateRender:false},S);
  tl.fromTo(id+" .box",{opacity:0,y:16},{opacity:1,y:0,duration:.8,ease:"power2.out",immediateRender:false},S+.4);
  tl.to(id+" .rot",{opacity:1,duration:.6},S+.6); tl.to(id+" .ti",{opacity:1,duration:.6},S+.9);
  tl.fromTo(id+" .ins",{opacity:0,x:-16},{opacity:1,x:0,duration:.8,ease:"power2.out",immediateRender:false},S+Number(P.t_inscreva));
})(window.__timelines.main, {{json}});
</script>
