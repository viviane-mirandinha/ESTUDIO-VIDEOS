<!--params {"series":"3","reps":"12","sub":""}-->
<div id="{{id}}" class="cr" style="position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:'Inter',sans-serif">
 <svg class="ic" width="150" height="150" viewBox="0 0 100 100">
  <defs><marker id="{{id}}_ah" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#fff"/></marker></defs>
  <path d="M18.05 38.37 A34 34 0 0 1 81.95 38.37" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#{{id}}_ah)"/>
  <path d="M81.95 61.63 A34 34 0 0 1 18.05 61.63" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#{{id}}_ah)"/>
 </svg>
 <div class="t" style="font-size:58px;font-weight:400;margin-top:30px;letter-spacing:.01em">{{p.series}} x {{p.reps}} reps</div>
 <div class="s" style="font-size:36px;font-weight:300;color:#c8c8c8;margin-top:14px">{{p.sub}}</div>
</div>
<script>
(function(tl, P){ const S={{start}}, D={{dur}}, id="#{{id}}";
  if(!P.sub) document.querySelector(id+" .s").style.display="none";
  tl.fromTo(id+" .ic",{rotation:0,opacity:0},{rotation:360,opacity:1,duration:Math.min(1.4,D*.7),ease:"power2.inOut",transformOrigin:"50% 50%",immediateRender:true},S);
  tl.fromTo(id+" .t",{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:"power2.out",immediateRender:true},S+.2);
  tl.fromTo(id+" .s",{opacity:0},{opacity:1,duration:.45,immediateRender:true},S+.6);
})(window.__timelines.main, {{json}});
</script>
