/* ---- notas manuscritas ---- */
const NOTES=document.getElementById("notes");
EDIT.items.filter(it=>it.type==="text"&&it.by==="template"&&!it.hidden).forEach(it=>{
  const p=it.props,d=document.createElement("div");d.className="note "+(p.kind||"note");d.id=it.id;
  d.style.left=p.x+"px";d.style.top=p.y+"px";d.style.fontSize=p.size+"px";d.style.color=p.color;
  const s=document.createElement("span");s.className="txt";s.textContent=p.text;d.appendChild(s);NOTES.appendChild(d);
  const t=it.start,rev=Math.min(1.5,.3+p.text.length*.045);
  tl.fromTo(d,{opacity:0},{opacity:1,duration:.12},t);
  let off=0;
  if(p.kind==="branch"){const a=document.createElementNS(NS,"svg");a.setAttribute("class","arr");a.setAttribute("viewBox","0 0 40 48");
    const q=el("path",{d:"M6,0 L6,30 L34,30 M26,23 L34,30 L26,37",stroke:p.color==="#2a2a2a"?"#1f9e8f":p.color,"stroke-width":3,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},a);
    d.appendChild(a);draw(q,t,.35);off=.3;}
  if(p.kind==="bubble"){[[-38,62,22],[-62,92,13]].forEach(([x,y,r])=>{const c=document.createElement("div");c.className="dot";
    Object.assign(c.style,{left:(x+40)+"px",bottom:(-y+20)+"px",width:r+"px",height:r+"px"});d.appendChild(c);});
    tl.fromTo(d,{scale:.85},{scale:1,duration:.4,ease:"back.out(2)"},t);}
  tl.fromTo(s,{clipPath:"inset(-30% 100% -30% -5%)"},{clipPath:"inset(-30% -5% -30% -5%)",duration:rev,ease:"none"},t+off);
  if(p.kind==="title"){const u=document.createElementNS(NS,"svg");u.setAttribute("class","ul");u.setAttribute("viewBox","0 0 100 18");u.setAttribute("preserveAspectRatio","none");
    const q=el("path",{d:"M0,9 Q6,3 12,9 T24,9 T36,9 T48,9 T60,9 T72,9 T84,9 T96,9",stroke:"#1f9e8f","stroke-width":2.6,fill:"none","vector-effect":"non-scaling-stroke"},u);
    d.appendChild(u);draw(q,t+rev*.8,.6);}
  const end=it.start+it.dur;if(end<74.0-.05)tl.to(d,{opacity:0,duration:.3},end-.3);
});
