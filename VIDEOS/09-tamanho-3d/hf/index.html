<style>

#back{position:absolute;left:46px;top:330px;font-family:'Cinzel',serif;font-size:20px;opacity:0;display:flex;align-items:center;gap:12px;}
#back .arr{width:90px;height:14px;position:relative;}

#back .arr b{position:absolute;left:0;top:-5px;border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:18px solid #fff;}

#gal .s{font-size:16px;font-weight:300;opacity:.85;margin-top:6px;}

<script>
window.__timelines = window.__timelines || {};
window.__hfRender = window.__hfRender || null;
const tl = gsap.timeline({paused:true, onUpdate:()=>{ if(window.__hfRender) window.__hfRender(tl.time()); }});
tl.to({v:0},{v:1,duration:70.7,ease:"none"},0);

<script type="module">
import * as THREE from "three";
const W=1280,H=720,FOV=40,TH=Math.tan(FOV/2*Math.PI/180);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const sm=k=>{k=clamp(k);return k*k*(3-2*k);};
const ease=k=>{k=clamp(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;};
const win=(t,a,b,f=.5)=>clamp(Math.min((t-a)/f,(b-t)/f));
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

// ---------- fundo: estrelas + faixa da Via Láctea (procedural, estático) ----------
(function(){const c=document.getElementById("bg"),g=c.getContext("2d");g.fillStyle="#000";g.fillRect(0,0,1400,800);
  g.save();g.translate(700,400);g.rotate(-0.62);
  for(let i=0;i<2600;i++){const x=(rnd()-.5)*1900,y=(rnd()+rnd()+rnd()-1.5)*120,r=rnd()*38+6;
    const gr=g.createRadialGradient(x,y,0,x,y,r);const a=0.035*rnd();
    const col=rnd()<.5?`rgba(210,200,190,${a})`:`rgba(170,180,210,${a})`;gr.addColorStop(0,col);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  for(let i=0;i<700;i++){const x=(rnd()-.5)*1900,y=(rnd()-.5)*60+ (rnd()-.5)*40;const r=rnd()*30+8;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(20,12,8,${0.25*rnd()})`);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  for(let i=0;i<5000;i++){const x=(rnd()-.5)*1900,y=(rnd()+rnd()-1)*160;g.fillStyle=`rgba(255,250,240,${rnd()*.7})`;g.fillRect(x,y,rnd()<.9?1:1.6,rnd()<.9?1:1.6);}
  g.restore();
  for(let i=0;i<900;i++){g.fillStyle=`rgba(255,255,255,${rnd()*.6})`;const s=rnd()<.95?1:2;g.fillRect(rnd()*1400,rnd()*800,s,s);}
})();

// ---------- three ----------
const canvas=document.getElementById("gl");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true,logarithmicDepthBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(FOV,W/H,0.05,1e9);
scene.add(new THREE.AmbientLight(0xffffff,0.05));
const sunL=new THREE.DirectionalLight(0xffffff,3.2);sunL.position.set(-1,0.25,0.55);scene.add(sunL);

const tex=id=>{const t=new THREE.Texture(document.getElementById(id));t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.needsUpdate=true;return t;};
function glowTex(inner,outer){const c=document.createElement("canvas");c.width=c.height=256;const g=c.getContext("2d");
  const gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,inner);gr.addColorStop(0.42,inner);gr.addColorStop(0.5,outer);gr.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=gr;g.fillRect(0,0,256,256);const t=new THREE.CanvasTexture(c);return t;}

// raios em raios terrestres (1 = 6.371 km)
const R={earth:1,jup:10.97,sun:109.2,bet:764*109.2,uy:1000*109.2};
const X={};X.earth=0;X.jup=X.earth+R.earth+6+R.jup;X.sun=X.jup+R.jup+60+R.sun;X.bet=X.sun+R.sun+45000+R.bet;X.uy=X.bet+R.bet+55000+R.uy;
const bodies={};
function addStar(k,tint,glowIn,glowOut,glowScale){
  const m=new THREE.Mesh(new THREE.SphereGeometry(R[k],96,64),new THREE.MeshBasicMaterial({color:tint}));
  m.position.x=X[k];scene.add(m);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(glowIn,glowOut),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  sp.scale.setScalar(R[k]*2*glowScale);sp.position.copy(m.position);scene.add(sp);
  bodies[k]=m;return m;}
let earthClouds;
async function build(){
  await Promise.all([...document.querySelectorAll("#imgs img")].map(i=>i.decode().catch(()=>{})));
  try{await document.fonts.ready;}catch(e){}
  const e=new THREE.Mesh(new THREE.SphereGeometry(1,96,64),new THREE.MeshStandardMaterial({map:tex("t_earth"),roughness:.85,metalness:0}));
  e.position.x=X.earth;scene.add(e);bodies.earth=e;
  earthClouds=new THREE.Mesh(new THREE.SphereGeometry(1.012,96,64),new THREE.MeshStandardMaterial({alphaMap:tex("t_cloud"),color:0xffffff,transparent:true,depthWrite:false,roughness:1}));
  earthClouds.position.x=X.earth;scene.add(earthClouds);
  const atm=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex("rgba(0,0,0,0)","rgba(90,160,255,0.35)"),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  atm.scale.setScalar(2*1.19);atm.position.x=X.earth;scene.add(atm);
  const j=new THREE.Mesh(new THREE.SphereGeometry(R.jup,96,64),new THREE.MeshStandardMaterial({map:tex("t_jup"),roughness:.9}));
  j.position.x=X.jup;scene.add(j);bodies.jup=j;
  const st=tex("t_sun");
  addStar("sun",0xffffff,"rgba(255,240,200,0.9)","rgba(255,190,90,0.35)",1.6).material.map=st;
  addStar("bet",0xff7a45,"rgba(255,120,60,0.8)","rgba(255,70,30,0.30)",1.45).material.map=st;
  addStar("uy",0xff5530,"rgba(255,90,50,0.8)","rgba(220,40,20,0.30)",1.45).material.map=st;
  [bodies.sun,bodies.bet,bodies.uy].forEach(b=>b.material.needsUpdate=true);
  // órbita de Marte (1,524 UA = 35.800 raios terrestres) centrada em Betelgeuse, desenhada por cima
  const pts=[];for(let i=0;i<=256;i++){const a=i/256*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*35800,Math.sin(a)*35800,0));}
  orbit=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0xffe0b0,dashSize:2500,gapSize:1600,transparent:true,opacity:0,depthTest:false}));
  orbit.computeLineDistances();orbit.position.set(X.bet,0,R.bet*1.01);orbit.renderOrder=5;scene.add(orbit);
  sunDot=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex("rgba(255,250,230,1)","rgba(255,200,120,0.6)"),depthTest:false,transparent:true,opacity:0}));
  sunDot.scale.setScalar(3200);sunDot.position.set(X.bet,0,R.bet*1.02);sunDot.renderOrder=6;scene.add(sunDot);
  buildGalaxy();
  window.__hfRender=renderAt;window.addEventListener("hf-seek",ev=>renderAt(ev.detail.time));
  renderAt(tl.time());
}
let orbit,sunDot;

// ---------- galáxia procedural ----------
const gScene=new THREE.Scene();const gCam=new THREE.PerspectiveCamera(50,W/H,0.1,1000);let gal;
function buildGalaxy(){seed=42;const N=70000,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  const ci=new THREE.Color(0xffd9a0),co=new THREE.Color(0x6f9cff),cc=new THREE.Color();
  for(let i=0;i<N;i++){const arm=i%2,r=Math.pow(rnd(),1.6)*10;const a=arm*Math.PI+r*0.75+(rnd()-.5)*(0.9/(r*0.3+0.6));
    const sp=(rnd()-.5)*(0.35+r*0.05);
    pos[i*3]=Math.cos(a)*r+sp;pos[i*3+1]=(rnd()-.5)*0.3*Math.exp(-r*0.25)*3;pos[i*3+2]=Math.sin(a)*r+(rnd()-.5)*(0.35+r*0.05);
    cc.copy(ci).lerp(co,clamp(r/7));if(rnd()<.03)cc.set(0xff8fa8);col.set([cc.r,cc.g,cc.b],i*3);}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("color",new THREE.BufferAttribute(col,3));
  const c=document.createElement("canvas");c.width=c.height=32;const x=c.getContext("2d");const gr=x.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=gr;x.fillRect(0,0,32,32);
  gal=new THREE.Points(g,new THREE.PointsMaterial({size:0.07,map:new THREE.CanvasTexture(c),vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.9}));
  gScene.add(gal);
  const core=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex("rgba(255,230,180,0.9)","rgba(255,200,140,0.25)"),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
  core.scale.setScalar(5);gScene.add(core);}

// ---------- câmera: keyframes {t0,t1 = janela de transição, foco, distância} ----------
const pose=(k,f)=>({cx:X[k]-0.19*f*R[k]*6,d:f*R[k]*6});
const KF=[
 {t0:0,t1:0,  ...{cx:0,d:4.2}},
 {t0:0.2,t1:8.3, cx:0,d:5.6},
 {t0:8.5,t1:10.6, ...pose("jup",1)},
 {t0:10.6,t1:16.4, ...pose("jup",1.12)},
 {t0:16.5,t1:19.0, ...pose("sun",1)},
 {t0:19.0,t1:27.0, ...pose("sun",1.12)},
 {t0:27.1,t1:31.6, ...pose("bet",1)},
 {t0:31.6,t1:47.0, ...pose("bet",1.1)},
 {t0:47.2,t1:50.6, ...pose("uy",1)},
 {t0:50.6,t1:57.7, ...pose("uy",1.1)},
 {t0:57.7,t1:59.2, cx:X.uy,d:pose("uy",1.1).d*40},
];
function cam(t){let a=KF[0];for(let i=1;i<KF.length;i++){const b=KF[i];if(t<=b.t0)break;
  const p=b.t1>b.t0?clamp((t-b.t0)/(b.t1-b.t0)):1;const k=b.t1-b.t0>4?p:ease(p);
  const d=Math.exp(lerp(Math.log(a.d),Math.log(b.d),k));const big=b.d/a.d>3||a.d/b.d>3;
  a={cx:lerp(a.cx,b.cx,big?(d-a.d)/(b.d-a.d):k),d};}
  return a;}

// ---------- rótulos ----------
const EDIT={"version": 1, "name": "09 - Tamanho 3D - Da Terra a UY Scuti", "canvas": {"w": 1280, "h": 720, "fps": 30, "bg": "#000000"}, "duration": 70.7, "template": "local", "head": "", "audio": {"voice": {"src": "voz.wav", "volume": 1.0, "start": 0}}, "tracks": [{"id": "fundo", "name": "Cena 3D"}, {"id": "textos", "name": "Rótulos"}], "items": [{"id": "lab_earth", "type": "text", "track": "textos", "label": "Rótulo Terra", "start": 0.3, "dur": 58.7, "by": "template", "props": {"text": "Terra", "sub": "O nosso planeta", "km": "12.742 km", "light": "A luz leva 0,04 s para cruzar", "measure_at": 4.0, "fact": "", "fact_at": 0}}, {"id": "lab_jup", "type": "text", "track": "textos", "label": "Rótulo Júpiter", "start": 9.3, "dur": 49.7, "by": "template", "props": {"text": "Júpiter", "sub": "O maior planeta do Sistema Solar", "km": "139.820 km", "light": "A luz leva 0,47 s para cruzar", "measure_at": 10.4, "fact": "cabem mais de 1.000 Terras dentro dele", "fact_at": 13.2}}, {"id": "lab_sun", "type": "text", "track": "textos", "label": "Rótulo Sol", "start": 17.0, "dur": 42.0, "by": "template", "props": {"text": "Sol", "sub": "A nossa estrela", "km": "1.392.700 km", "light": "A luz leva 4,6 s para cruzar", "measure_at": 19.4, "fact": "≈ 1,3 milhão de Terras caberiam dentro", "fact_at": 22.8}}, {"id": "lab_bet", "type": "text", "track": "textos", "label": "Rótulo Betelgeuse", "start": 30.9, "dur": 28.1, "by": "template", "props": {"text": "Betelgeuse", "sub": "Supergigante vermelha · constelação de Órion", "km": "~1,06 bilhão de km*", "light": "A luz leva ~59 min para cruzar", "measure_at": 33.0, "fact": "raio > 700× o do Sol · tamanho incerto", "fact_at": 35.6}}, {"id": "lab_uy", "type": "text", "track": "textos", "label": "Rótulo UY Scuti", "start": 47.5, "dur": 11.5, "by": "template", "props": {"text": "UY Scuti", "sub": "Hipergigante vermelha · constelação do Escudo", "km": "~1,4 bilhão de km*", "light": "A luz leva ~1 h 17 min para cruzar", "measure_at": 49.6, "fact": "≈ 1.000× o raio do Sol (grande margem de erro)", "fact_at": 50.8}}, {"id": "galaxia", "type": "text", "track": "textos", "label": "Via Láctea", "start": 59.6, "dur": 4.4, "by": "template", "props": {"text": "VIA LÁCTEA", "sub": "~100.000 anos-luz de diâmetro · centenas de bilhões de estrelas"}}, {"id": "cta", "type": "text", "track": "textos", "label": "CTA final", "start": 63.8, "dur": 6.9, "by": "template", "props": {"text": "Qual astro mais te impressionou?", "button": "COMENTE · INSCREVA-SE"}}, {"id": "cena3d", "type": "html", "track": "fundo", "label": "Cena 3D (câmera Terra→UY Scuti→galáxia, keyframes KF no template)", "start": 0, "dur": 70.7, "by": "template", "props": {"html": ""}}], "notes": "Render teste feito de proj/index.html via render.ps1; template.html + assets/ = versão editável (build_from_edit.py)."};const ED=Object.fromEntries(EDIT.items.map(i=>[i.id,i]));
const LT=["earth","jup","sun","bet","uy"].map(k=>{const it=ED["lab_"+k],p=it.props;
  return {k,n:p.text,s:p.sub,km:p.km,lt:p.light,tn:it.hidden?1e9:it.start,tm:p.measure_at,facts:p.fact?[[p.fact_at,p.fact]]:[]};});
const GAL=ED.galaxia,CTA=ED.cta;
document.querySelector("#gal .n").textContent=GAL.props.text;document.querySelector("#gal .s").textContent=GAL.props.sub;
document.querySelector("#cta .q").textContent=CTA.props.text;document.querySelector("#cta .b").textContent=CTA.props.button;
const hud=document.getElementById("hud");
LT.forEach(L=>{L.el=document.createElement("div");L.el.className="lab";
  L.el.innerHTML=`<div class="n">${L.n}</div><div class="s">${L.s}</div>`+L.facts.map(f=>`<div class="f">${f[1]}</div>`).join("");
  L.me=document.createElement("div");L.me.className="mea";
  L.me.innerHTML=`<div class="ar"><b class="l"></b><i></i><b class="r"></b></div><div class="km">${L.km}</div><div class="bar"></div><div class="lt">${L.lt}</div>`;
  hud.append(L.el,L.me);});
const $=id=>document.getElementById(id);
const v3=new THREE.Vector3();
function scr(x,y,z){v3.set(x,y,z).project(camera);return [(v3.x+1)/2*W,(1-v3.y)/2*H];}

function renderAt(t){
  // fundo com parallax lento
  $("bg").style.transform=`translate(${-t*0.6}px,${t*0.12}px)`;
  const c=cam(t);camera.position.set(c.cx,c.d*0.04,c.d);camera.lookAt(c.cx,0,0);camera.updateMatrixWorld();
  Object.values(bodies).forEach((b,i)=>b.rotation.y=t*(i===0?0.06:0.025)+i);
  if(earthClouds)earthClouds.rotation.y=t*0.075;
  // órbita de Marte + ponto do Sol
  const ok=win(t,44.6,47.6,.6);orbit.material.opacity=ok*0.9;sunDot.material.opacity=ok;
  const op=scr(X.bet+35800*0.7,35800*0.72,R.bet);$("orb").style.opacity=ok;$("orb").style.transform=`translate(${op[0]+8}px,${op[1]-22}px)`;
  // rótulos
  LT.forEach(L=>{const b=bodies[L.k];const dist=camera.position.distanceTo(b.position);const rpx=R[L.k]/(dist*TH)*(H/2);
    const [sx,sy]=scr(b.position.x,0,0);
    const vis=clamp((rpx-14)/16)*clamp((sx+rpx+40)/80)*clamp((W+40-(sx-rpx))/80);
    const sc=clamp(rpx/170,0.55,1);
    L.el.style.opacity=vis*sm((t-L.tn)/0.6);
    L.el.style.transform=`translate(${sx}px,${sy-rpx-16}px) translate(-50%,-100%) scale(${sc})`;
    const facts=L.el.querySelectorAll(".f");L.facts.forEach((f,i)=>{facts[i].style.opacity=sm((t-f[0])/0.5);});
    const w=Math.max(2*rpx,60);L.me.style.width=w+"px";
    L.me.style.opacity=vis*sm((t-L.tm)/0.6);L.me.style.transform=`translate(${sx-w/2}px,${sy+rpx+16}px) scale(${Math.max(sc,0.75)})`;});
  // seta "← Sol" quando o Sol vira um ponto
  const bk=win(t,33.6,44.0,.6)+win(t,51.6,57.4,.6);$("back").style.opacity=Math.min(bk,1);
  $("backt").textContent=t<48?"Sol (pequeno demais para ver)":"Sol, Terra, Júpiter…";
  renderer.setClearColor(0x000000,0);renderer.clear();
  // transição para galáxia
  const fk=clamp((t-58.3)/0.8)-clamp((t-59.2)/0.8);$("fade").style.opacity=clamp(fk);
  if(t<59.1){renderer.render(scene,camera);}
  else{const gt=t-59.1;gal.rotation.y=gt*0.05;const r=lerp(26,18,ease(gt/6));
    gCam.position.set(Math.sin(gt*0.04)*r*0.3,r*0.55,r);gCam.lookAt(0,0,0);renderer.render(gScene,gCam);}
  $("bg").style.opacity=t<59.1?1:0.55;
  $("gal").style.opacity=GAL.hidden?0:win(t,GAL.start,GAL.start+GAL.dur,.7);
  const ck=CTA.hidden?0:sm((t-CTA.start)/0.7);$("cta").style.opacity=ck;$("cta").style.transform=`translateY(${(1-ck)*16}px)`;
}
