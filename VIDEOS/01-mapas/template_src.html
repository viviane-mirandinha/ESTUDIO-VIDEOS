  else if(el.classList.contains('stamp')){el.style.transform=`translate(-50%,-50%) scale(${1+0.6*(1-eo((t-el.dataset.in)/0.25))}) rotate(-3deg)`;}
  else if(!el.classList.contains('lab')&&!el.classList.contains('tag')&&!el.classList.contains('num'))el.style.transform=`translateY(${(1-v)*24}px)`;});
 $('frx').style.opacity=clamp((t-28.5)/0.2);
 // locks
 const sp=clamp((t-38.3)/6.0);const sx=150+sp*(560-150);const steps=[[200,350],[260,310],[320,270],[380,230]];let wy=400;for(const [x,y] of steps){if(sx+20>=x)wy=y;}
 $('ship').setAttribute('transform',`translate(${sx},${wy+2*Math.sin(t*4)})`);
 $('lkCom').setAttribute('opacity',clamp((t-39.4)/0.4));$('lkArr').setAttribute('opacity',clamp((t-42.1)/0.4));$('lkGat').setAttribute('opacity',clamp((t-43.9)/0.4));
 // ships
 $('sh2').setAttribute('opacity',clamp((t-54.5)/0.4));$('sh2').setAttribute('transform',`translate(40,200) scale(${0.85+0.15*eo((t-54.5)/0.6)},1)`);
 $('gLvl').style.height=(85-45*dry)+'%';$('gLvl').style.background=mix('#2f7fc1','#b0884a',dry);
 $('sub').style.transform=`translate(-50%,-50%) scale(${1+0.06*Math.sin(Math.max(0,t-67.6)*5)})`;
}
window.__hfRender=t=>renderAt(t);window.addEventListener("hf-seek",e=>renderAt(e.detail.time));renderAt(0);
</script>
