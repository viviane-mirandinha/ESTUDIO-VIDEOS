<script>

<script>
const K=20, NS='http://www.w3.org/2000/svg';
const mx=lon=>(lon+180)*K, my=lat=>-Math.log(Math.tan(Math.PI/4+Math.max(-80,Math.min(80,lat))*Math.PI/360))*180/Math.PI*K;
const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}, eo=x=>1-Math.pow(1-clamp(x),3);
const $=id=>document.getElementById(id);
// graticule
(()=>{let d='';for(let lo=-180;lo<=0;lo+=10)d+=`M${mx(lo)},${my(80)}L${mx(lo)},${my(-75)}`;for(let la=-70;la<=80;la+=10)d+=`M${mx(-180)},${my(la)}L${mx(0)},${my(la)}`;
 const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','grat');$('grat').appendChild(p);})();
// smooth path from lon/lat list (catmull-rom)
function spath(pts){const P=pts.map(([lo,la])=>[mx(lo),my(la)]);let d=`M${P[0][0]},${P[0][1]}`;
 for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
  d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return d;}
const NY=[-74,40.6],SF=[-122.5,37.8],PAN=[-79.7,9.1];
const R={ // id: [pts, color, width, t0, t1, out]
 horn:[[NY,[-70,34],[-62,22],[-48,6],[-34.5,-7],[-38,-20],[-48,-31],[-56,-40],[-63,-50],[-67.3,-57],[-75,-53.5],[-77,-45],[-75.5,-30],[-75,-15],[-84,-2],[-96,9],[-108,18],[-117,29],SF],'#ff3b4a',3.5,12.9,18.3,22.0],
 pan:[[NY,[-73,30],[-74,20.2],[-78,14],[-79.92,9.5],[-79.6,8.8],[-81,6.8],[-90,10.5],[-104,17.5],[-116,28],SF],'#3ddc84',3.5,22.0,24.6,25.6],
 canal:[[[-79.93,9.42],[-79.92,9.33],[-79.91,9.27],[-79.86,9.19],[-79.76,9.15],[-79.69,9.12],[-79.65,9.06],[-79.61,9.02],[-79.59,8.99],[-79.56,8.94],[-79.52,8.86]],'#4fb3ff',4,1.3,2.5,99],
 us:[[[-77,38.9],[-80,30],[-81,20],[-79.8,9.3]],'#ffffff',3,35.0,36.6,37.6],
};
const FAN=[[-150,32],[-150,12],[-150,-15],[-5,48],[-5,30],[-30,-30],[-74,40.6],[-90,29.5],[-72,-33],[-118,34]];
FAN.forEach((e,i)=>{R['f'+i]=[[PAN,[(PAN[0]+e[0])/2+(i%2?6:-6),(PAN[1]+e[1])/2+(i%3?4:-4)],e],'#ffc94a',2.2,2.6+i*0.12,4.6+i*0.12,5.5];
 R['g'+i]=[[PAN,[(PAN[0]+e[0])/2+(i%2?6:-6),(PAN[1]+e[1])/2+(i%3?4:-4)],e],'#ffc94a',2.2,62.7+i*0.1,64.6+i*0.1,67.4];});
const RP={};
for(const k in R){const [pts,c,w]=R[k];const p=document.createElementNS(NS,'path');p.setAttribute('d',spath(pts));p.setAttribute('class','route');
 p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);if(k!=='canal')p.setAttribute('filter','url(#glow)');$('routes').appendChild(p);
 const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
 const dt=document.createElementNS(NS,'circle');dt.setAttribute('class','dot');dt.setAttribute('fill',c);$('dots').appendChild(dt);RP[k]={p,L,dt};}
// lake
$('lake').setAttribute('d',spath([[-80.02,9.2],[-79.95,9.27],[-79.88,9.25],[-79.8,9.2],[-79.72,9.17],[-79.68,9.12],[-79.74,9.08],[-79.85,9.07],[-79.96,9.1],[-80.03,9.15],[-80.02,9.2]])+'Z');
// labels on map: [text, lon, lat, in, out, cls]
const EDIT=__EDIT__;const ED=Object.fromEntries(EDIT.items.map(i=>[i.id,i]));
const tx=i=>i.type==='text'&&!i.hidden;
const LB=EDIT.items.filter(i=>tx(i)&&i.props.lon!==undefined).map(i=>[i.props.text,i.props.lon,i.props.lat,i.start,i.start+i.dur,i.props.cls]);
LB.forEach(l=>{const d=document.createElement('div');d.className='it '+l[5];d.textContent=l[0];d.dataset.in=l[3];d.dataset.out=l[4];d.dataset.lon=l[1];d.dataset.lat=l[2];$('labels').appendChild(d);});
// free screen items: stamps/numbers
const SC=EDIT.items.filter(i=>tx(i)&&i.props.x!==undefined).map(i=>[i.props.text,i.props.x,i.props.y,i.start,i.start+i.dur,i.props.cls]);
SC.forEach(l=>{const d=document.createElement('div');d.className='it '+l[5];d.innerHTML=l[0];d.dataset.in=l[3];d.dataset.out=l[4];d.style.left=l[1]+'px';d.style.top=l[2]+'px';$('labels').appendChild(d);});
// highlights: [ADM0_A3, color, in, out]
const HL=[['PAN','#d9a21b',0.6,5.2],['PAN','#d9a21b',22.0,34.9],['PAN','#e63946',45.2,51.5],['PAN','#3e6e4a',56.6,67.3],
 ['USA','#2b6cb0',35.0,37.6],['BRA','#c9a227',14.6,18.5],['ARG','#c9a227',14.6,18.5],['CHL','#c9a227',14.6,18.5],['PER','#c9a227',14.6,18.5],['COL','#c9a227',14.6,18.5],['VEN','#c9a227',14.6,18.5],['BOL','#c9a227',14.6,18.5],['ECU','#c9a227',14.6,18.5],['PRY','#c9a227',14.6,18.5],['URY','#c9a227',14.6,18.5],['GUY','#c9a227',14.6,18.5],['SUR','#c9a227',14.6,18.5]];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)), mix=(a,b,k)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`;};
// camera keys [t0,t1, lon,lat,scale]
const CAM=ED.camera.props.value;
function cam(t){let c=CAM[0].slice(2);for(const k of CAM){if(t>=k[1]){c=k.slice(2);continue;}if(t>k[0]){const e=ease((t-k[0])/(k[1]-k[0]));
 const a=[mx(c[0]),my(c[1])],b=[mx(k[2]),my(k[3])];const s=Math.exp(Math.log(c[2])+(Math.log(k[4])-Math.log(c[2]))*e);
 return [a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e,s];}break;}
 // slow drift after settle
 let last=0;for(const k of CAM)if(t>=k[1])last=k[1];const dr=1+0.012*Math.min(6,t-last);return [mx(c[0]),my(c[1]),c[2]*dr];}
function vis(el,t){const a=+el.dataset.in,b=+el.dataset.out;if(t<a-0.01||t>b+0.35)return 0;return Math.min(eo((t-a)/0.35),1-clamp((t-b)/0.35));}
(()=>{const T=ED.titulo;let h=T.props.text;(T.props.highlight||[]).forEach(w=>h=h.replace(w,'<b>'+w+'</b>'));
 $('ttl').innerHTML=h.replace(' É ','<br>É ');$('ttl').dataset.in=T.start;$('ttl').dataset.out=T.hidden?-9:T.start+T.dur;
 ['frc','usa','locks','ships','gauge','cta'].forEach(id=>{const I=ED[id];if(!I)return;$(id).dataset.in=I.hidden?-9:I.start;$(id).dataset.out=I.hidden?-9:I.start+I.dur;});})();
const lands={};document.querySelectorAll('#lands path').forEach(p=>lands[p.id.slice(2)]=p);
function renderAt(t){
 const [cx,cy,s]=cam(t);$('cam').setAttribute('transform',`translate(640,360) scale(${s}) translate(${-cx},${-cy})`);
 const dim=(t>5.4&&t<8.7)||(t>37.7&&t<45)||(t>53.5&&t<56.5)||t>67.5?0.35:1;$('map').style.opacity=dim;
 for(const id in lands)lands[id].style.fill='#1a2430';
 HL.forEach(([id,c,a,b])=>{if(!lands[id])return;const k=Math.min(eo((t-a)/0.6),1-clamp((t-b)/0.5));if(k>0)lands[id].style.fill=mix('#1a2430',c,k*(0.75+0.12*Math.sin(t*3)));});
 for(const k in R){const [, , w,a,b,o]=R[k];const r=RP[k];const p=clamp((t-a)/(b-a)),pe=ease(p);const fade=1-clamp((t-o)/0.5);
  r.p.style.strokeDashoffset=r.L*(1-pe);r.p.style.opacity=t<a?0:fade;r.p.style.strokeWidth=w/s+'px';r.p.setAttribute('stroke-width',w/s);
  if(t>a&&t<b+0.3&&fade>0){const q=r.p.getPointAtLength(r.L*pe);r.dt.setAttribute('cx',q.x);r.dt.setAttribute('cy',q.y);r.dt.setAttribute('r',6/s);r.dt.style.opacity=fade;}else r.dt.style.opacity=0;}
 $('lake').setAttribute('opacity',t>56.6&&t<62.6?0.9:0);
 const dry=clamp((t-57.6)/3.2);$('lake').setAttribute('fill',mix('#2f7fc1','#8a7650',dry*0.7));
 $('lake').setAttribute('transform',`translate(${mx(-79.85)},${my(9.16)}) scale(${1-0.28*dry}) translate(${-mx(-79.85)},${-my(9.16)})`);
 document.querySelectorAll('.it').forEach(el=>{const v=vis(el,t);el.style.opacity=v;
  if(el.dataset.lon){const X=640+(mx(+el.dataset.lon)-cx)*s,Y=360+(my(+el.dataset.lat)-cy)*s;el.style.left=X+'px';el.style.top=Y+(1-v)*14+'px';}
  else if(el.classList.contains('stamp')){el.style.transform=`translate(-50%,-50%) scale(${1+0.6*(1-eo((t-el.dataset.in)/0.25))}) rotate(-3deg)`;}
  else if(!el.classList.contains('lab')&&!el.classList.contains('tag')&&!el.classList.contains('num'))el.style.transform=`translateY(${(1-v)*24}px)`;});
 $('frx').style.opacity=clamp((t-28.5)/0.2);
 // locks
 const sp=clamp((t-38.3)/6.0);const sx=150+sp*(560-150);const steps=[[200,350],[260,310],[320,270],[380,230]];let wy=400;for(const [x,y] of steps){if(sx+20>=x)wy=y;}
 $('ship').setAttribute('transform',`translate(${sx},${wy+2*Math.sin(t*4)})`);
 $('lkCom').setAttribute('opacity',clamp((t-39.4)/0.4));$('lkArr').setAttribute('opacity',clamp((t-42.1)/0.4));$('lkGat').setAttribute('opacity',clamp((t-43.9)/0.4));
 // ships
 $('sh2').setAttribute('opacity',clamp((t-54.5)/0.4));$('sh2').setAttribute('transform',`translate(40,200) scale(${0.85+0.15*eo((t-54.5)/0.6)},1)`);
 $('gLvl').style.height=(85-45*dry)+'%';$('gLvl').style.background=mix('#2f7fc1','#b0884a',dry);
 $('sub').style.transform=`translate(-50%,-50%) scale(${1+0.06*Math.sin(Math.max(0,t-67.6)*5)})`;
}
window.__hfRender=t=>renderAt(t);window.addEventListener("hf-seek",e=>renderAt(e.detail.time));renderAt(0);
</script>
