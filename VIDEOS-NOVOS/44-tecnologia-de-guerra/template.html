<style>

#three-layer{position:absolute;left:0;top:0;width:1280px;height:720px;display:block;}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0px,rgba(0,0,0,.18) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px);}

 color:#0a0a0a;padding:2px 10px 0 10px;text-transform:uppercase}

 text-shadow:0 0 12px rgba(255,176,0,.55)}

 <canvas id="three-layer" width="1280" height="720"></canvas>

<script>
window.__timelines = window.__timelines || {};
window.__hfRender = window.__hfRender || null;
const tl = gsap.timeline({paused:true, onUpdate:()=>{ if(window.__hfRender) window.__hfRender(tl.time()); }});
tl.to({v:0},{v:1,duration:__DUR__,ease:"none"},0);
window.__timelines["main"] = tl;

<script type="module">
import * as THREE from "three";

const W=1280,H=720,DUR=__DUR__;
const EDIT=__EDIT__;
const ED=Object.fromEntries(EDIT.items.map(i=>[i.id,i]));
const pv=(id,d)=>(ED[id]&&ED[id].props&&ED[id].props.value!==undefined)?ED[id].props.value:d;
const GRN=pv("cor_wire","#39ff88"), AMB=pv("cor_hud","#ffb000");
const S=k=>ED[k].start;
const T_EIF=S("sc_eiffel"),T_XR=S("sc_xray"),T_CAT=S("sc_cat"),T_LAND=S("sc_land"),T_BOL=S("sc_bolter"),T_MAP=S("sc_mapa"),T_FIN=S("sc_final");
const T_STEAM=S("rt_vapor"), T_LAUNCH=S("cnt_cat"), T_CATCH=S("cnt_land"), T_TOUCH=S("tx_toque");

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const sm=k=>{k=clamp(k);return k*k*(3-2*k);};
const io=k=>{k=clamp(k);return -(Math.cos(Math.PI*k)-1)/2;};
const seg=(t,a,b)=>sm((t-a)/(b-a));

// ---------- renderer ----------
const canvas=document.getElementById("three-layer");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color("#05080a");
scene.fog=new THREE.Fog("#05080a",40,140);
const camera=new THREE.PerspectiveCamera(38,W/H,0.05,600);
scene.add(new THREE.AmbientLight("#a8c0d0",0.55));
const key=new THREE.DirectionalLight("#fff2dd",1.6); key.position.set(20,30,18); scene.add(key);
const rim=new THREE.DirectionalLight("#5fd0ff",0.5); rim.position.set(-25,12,-20); scene.add(rim);

// ocean grid
const grid=new THREE.GridHelper(400,200,"#0f3a26","#0b2a1c"); grid.position.y=-1.8; scene.add(grid);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshBasicMaterial({color:"#04100c"}));
sea.rotation.x=-Math.PI/2; sea.position.y=-1.82; scene.add(sea);

// ---------- helpers ----------
const SOLIDS=[], EDGES=[];
const lineMat=(c,o=1)=>new THREE.LineBasicMaterial({color:c,transparent:true,opacity:o});
function addMesh(geo,color,parent,pos,opts={}){
  const mat=new THREE.MeshStandardMaterial({color,roughness:.7,metalness:.25,transparent:true,opacity:1,...opts});
  const m=new THREE.Mesh(geo,mat); if(pos) m.position.set(...pos); parent.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,18),lineMat(GRN,.9)); m.add(e);
  SOLIDS.push(m); EDGES.push(e); return m;
}
function shapeXZ(pts){const s=new THREE.Shape(); pts.forEach(([x,z],i)=>i?s.lineTo(x,-z):s.moveTo(x,-z)); s.closePath(); return s;}
function slab(pts,depth){const g=new THREE.ExtrudeGeometry(shapeXZ(pts),{depth,bevelEnabled:false}); g.rotateX(-Math.PI/2); g.translate(0,-depth,0); return g;}

// ---------- CARRIER (C) — 1 unidade = 10 m ----------
const C=new THREE.Group(); scene.add(C);
const DECK=[[-16.6,-2.2],[-16.6,2.9],[-4,3.9],[4,3.9],[10,2.6],[15.5,1.6],[16.7,0.8],[16.7,-0.9],[13,-1.8],[8.5,-3.9],[-2,-3.9],[-10,-3.1]];
const HULL=[[-16.2,-1.9],[-16.2,1.9],[-8,2.05],[6,2.05],[12,1.4],[16.5,0.05],[12,-1.4],[6,-2.05],[-8,-2.05]];
const deck=addMesh(slab(DECK,0.35),"#3a3f46",C);
const hull=addMesh(slab(HULL,2.2),"#2a3038",C,[0,-0.35,0]);
addMesh(new THREE.BoxGeometry(1.9,1.4,0.8),"#4a5058",C,[-0.5,0.7,3.25]);
addMesh(new THREE.BoxGeometry(1.2,0.8,0.62),"#4a5058",C,[-0.6,1.8,3.25]);
addMesh(new THREE.CylinderGeometry(0.06,0.09,1.4,6),"#4a5058",C,[-0.7,2.9,3.25]);
addMesh(new THREE.BoxGeometry(0.7,0.12,0.12),"#4a5058",C,[-0.7,3.3,3.25]);
// deck markings (landing axis)
const ANG=9*Math.PI/180, O=new THREE.Vector3(-12,0.01,0.4), Dv=new THREE.Vector3(Math.cos(ANG),0,-Math.sin(ANG)), Pv=new THREE.Vector3(Math.sin(ANG),0,Math.cos(ANG));
const onAxis=(s,p=0,y=0)=>O.clone().addScaledVector(Dv,s).addScaledVector(Pv,p).add(new THREE.Vector3(0,y,0));
const mkMat=new THREE.MeshBasicMaterial({color:"#c8d0d8"});
for(let s=-3.5;s<20;s+=1.3){const b=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.01,0.06),mkMat); b.position.copy(onAxis(s,0,0.005)); b.rotation.y=ANG; C.add(b);}
for(const p of [-1.25,1.25]){const b=new THREE.Mesh(new THREE.BoxGeometry(24,0.01,0.04),mkMat); b.position.copy(onAxis(8.2,p,0.005)); b.rotation.y=ANG; C.add(b);}
// catapult tracks (bow)
const catMat=new THREE.MeshBasicMaterial({color:AMB,transparent:true,opacity:.35});
const catZ=[-0.5,0.7]; const CATS=catZ.map(z=>{const b=new THREE.Mesh(new THREE.BoxGeometry(12,0.02,0.08),catMat); b.position.set(10.3,0.01,z); C.add(b); return b;});
// arresting wires
const WIRE_S=[1.0,2.5,4.0,5.5];
const WIRES=WIRE_S.map(s=>{const g=new THREE.BufferGeometry().setFromPoints([onAxis(s,-1.5,0.05),onAxis(s,0,0.05),onAxis(s,1.5,0.05)]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:"#d8dde3",transparent:true,opacity:1})); C.add(l); return l;});
// reactors + steam line (x-ray)
const glowCv=document.createElement("canvas"); glowCv.width=glowCv.height=64;
{const g=glowCv.getContext("2d"); const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,"rgba(255,220,120,1)"); gr.addColorStop(.4,"rgba(255,160,0,.5)"); gr.addColorStop(1,"rgba(255,120,0,0)"); g.fillStyle=gr; g.fillRect(0,0,64,64);}
const glowTex=new THREE.CanvasTexture(glowCv);
const REACT=[[-3,-1.35,0],[2,-1.35,0]].map(p=>{const g=new THREE.Group(); g.position.set(...p); C.add(g);
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.45,10,8),new THREE.MeshBasicMaterial({color:AMB,transparent:true,opacity:0}));
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:0})); sp.scale.set(3,3,1);
  g.add(core); g.add(sp); g.userData={core,sp}; return g;});
const steamCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-3,-1.35,0),new THREE.Vector3(2,-1.35,0.2),new THREE.Vector3(7,-0.9,0.6),new THREE.Vector3(9.4,-0.15,0.7),new THREE.Vector3(10,-0.02,0.7)]);
const steamMat=new THREE.MeshBasicMaterial({color:AMB,transparent:true,opacity:0,depthWrite:false});
const steam=new THREE.Mesh(new THREE.TubeGeometry(steamCurve,60,0.12,8,false),steamMat); C.add(steam);
const PUFF=[]; for(let i=0;i<14;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:0})); sp.scale.set(.6,.6,1); C.add(sp); PUFF.push(sp);}
// length dimension line
const dimMat=new THREE.LineBasicMaterial({color:AMB,transparent:true,opacity:0});
const dimGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-16.6,0.4,5.2),new THREE.Vector3(16.7,0.4,5.2)]);
const dim=new THREE.Line(dimGeo,dimMat); C.add(dim);
for(const x of [-16.6,16.7]){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,0.4,4.6),new THREE.Vector3(x,0.4,5.8)]); C.add(new THREE.Line(g,dimMat));}

// ---------- JET (J) — ~17 m ----------
const J=new THREE.Group(); C.add(J);
const jc="#7a828c";
const fus=addMesh(new THREE.CylinderGeometry(0.09,0.11,1.3,6).rotateZ(Math.PI/2),jc,J,[0,0.18,0]);
addMesh(new THREE.ConeGeometry(0.09,0.42,6).rotateZ(-Math.PI/2),jc,J,[0.86,0.18,0]);
addMesh(new THREE.BoxGeometry(0.28,0.07,0.1),"#1d4a6a",J,[0.42,0.27,0]);
const wing=new THREE.Shape(); wing.moveTo(0.25,0); wing.lineTo(-0.35,0.62); wing.lineTo(-0.5,0.62); wing.lineTo(-0.45,0); wing.closePath();
for(const s of [1,-1]){const g=new THREE.ExtrudeGeometry(wing,{depth:0.025,bevelEnabled:false}); g.rotateX(Math.PI/2); if(s<0) g.scale(1,1,-1); addMesh(g,jc,J,[0,0.17,0]);}
for(const z of [0.13,-0.13]){const v=new THREE.Shape(); v.moveTo(0,0); v.lineTo(-0.25,0.32); v.lineTo(-0.36,0.32); v.lineTo(-0.3,0); v.closePath();
  const g=new THREE.ExtrudeGeometry(v,{depth:0.02,bevelEnabled:false}); const m=addMesh(g,jc,J,[-0.35,0.22,z]); m.rotation.x=z>0?-0.35:0.35;}
const hook=new THREE.Group(); hook.position.set(-0.6,0.1,0); J.add(hook);
const hookBar=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.025,0.025),new THREE.MeshBasicMaterial({color:AMB})); hookBar.position.x=-0.21; hook.add(hookBar);
const exh=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:0})); exh.position.set(-0.75,0.18,0); exh.scale.set(.9,.5,1); J.add(exh);
J.scale.setScalar(1.0);

// ---------- EIFFEL (deitada, 1 un = 10 m) ----------
const TW=new THREE.Group(); scene.add(TW);
const twMat=lineMat(AMB,0);
const LV=[[0,6.2],[5.7,3.6],[11.6,2.0],[27.6,0.55],[32.4,0.12]];
for(let i=0;i<LV.length-1;i++){const [h0,r0]=LV[i],[h1,r1]=LV[i+1];
  const g=new THREE.CylinderGeometry(r1,r0,h1-h0,4,Math.max(1,Math.round((h1-h0)/2)),true); g.rotateY(Math.PI/4); g.translate(0,(h0+h1)/2,0);
  TW.add(new THREE.LineSegments(new THREE.WireframeGeometry(g),twMat));}
{const g=new THREE.CylinderGeometry(0.03,0.03,0.6,4); g.translate(0,32.7,0); TW.add(new THREE.LineSegments(new THREE.WireframeGeometry(g),twMat));}
TW.rotation.z=-Math.PI/2; TW.position.set(-16.5,0,14);

// ---------- anchors / labels ----------
const v3=new THREE.Vector3();
const wp=(obj,x,y,z)=>obj.localToWorld(new THREE.Vector3(x,y,z));
let jetFlag=0;
const ANCH={
  comp:()=>wp(C,0,0.4,5.2), ilha:()=>wp(C,-0.6,2.3,3.25), nimitz:()=>wp(C,-6,0.2,-3.5), eiffel:()=>wp(TW,0,20,0),
  r1:()=>wp(C,-3,-1.35,0), r2:()=>wp(C,2,-1.35,0), cat:()=>wp(C,13,0.02,0.7), vapor:()=>wp(C,7,-0.9,0.6),
  jato:()=>wp(J,0.6,0.2,0), cabos:()=>wp(C,...onAxis(2.5,1.2,0.05).toArray()), gancho:()=>wp(hook,-0.42,0,0)};
const LABELS=EDIT.items.filter(i=>i.track==="rotulos");
const lay=document.getElementById("labels"), lsvg=document.getElementById("lsvg");
const labEls=LABELS.map(L=>{const e=document.createElement("div"); e.className="lab"; e.style.background=AMB; e.textContent=L.props.text; lay.appendChild(e); return e;});
function proj(p){const q=p.clone().project(camera); return [(q.x+1)/2*W,(1-q.y)/2*H,q.z];}
// counters
const CNTS=EDIT.items.filter(i=>i.track==="contadores");
const cntEls=CNTS.map(c=>{const e=document.createElement("div"); e.className="cnt"; const p=c.props;
  e.style.cssText+=`right:${W-p.x}px;top:${p.y}px;font-size:${p.size||96}px;color:${AMB}`; e.innerHTML=`<span class="cl"></span><b></b><small></small>`;
  e.querySelector(".cl").textContent=p.label||""; e.querySelector("small").textContent=p.suffix||""; lay.appendChild(e); return e;});
// map rings
const RINGS=EDIT.items.filter(i=>i.track==="mapa");
const mapEl=document.getElementById("map"), msvg=document.getElementById("msvg");
const hsvg=document.getElementById("hsvg"), tcEl=document.getElementById("tc"); tcEl.style.color=GRN;
const HUDTXT=pv("hud_topo","ARQUIVO TÉCNICO 044 // ANÁLISE");

// ---------- jet trajectory ----------
const deckY=0.0;
function jetState(t){
  // returns {mode,pos,rotY,pitch,hook,burn,caught}
  if(t<T_LAND){ // catapult
    const u=clamp((t-T_LAUNCH)/2.1); let x=6+10.5*u*u, y=deckY, pitch=0;
    if(t>T_LAUNCH+2.1){const k=t-(T_LAUNCH+2.1); x=16.5+10*k; y=deckY+0.25*k*k+0.4*k; pitch=Math.min(0.22,0.12*k);}
    return {pos:new THREE.Vector3(x,y,catZ[1]),rotY:0,pitch,hook:0,burn:t>T_LAUNCH-0.6?1:0.35,caught:-1};
  }
  if(t<T_BOL){ // arrested landing
    const v=6, sT=2.8, sC=WIRE_S[2]; let s,y;
    if(t<T_CATCH){s=sC-v*(T_CATCH-t);} else {const u=clamp((t-T_CATCH)/2.0); s=sC+10*(1-(1-u)*(1-u));}
    y=s<sT?deckY+(sT-s)*0.07:deckY;
    const hk=seg(t,S("rt_gancho")-0.4,S("rt_gancho")+0.2);
    return {pos:onAxis(s,0,y),rotY:ANG,pitch:s<sT?0.05:0,hook:hk,burn:0.3,caught:t>=T_CATCH?2:-1};
  }
  // bolter: toque, potência máxima, gancho erra, decola de novo
  const v=5.2, sT=2.8; let s=sT+v*(t-T_TOUCH), y;
  if(t<T_TOUCH) y=deckY+(sT-s)*0.07; else y=deckY;
  const sEnd=21; if(s>sEnd-4){const k=s-(sEnd-4); y=deckY+0.012*k*k+0.05*k;}
  return {pos:onAxis(s,0,y),rotY:ANG,pitch:s>sEnd-4?Math.min(0.2,(s-sEnd+4)*0.03):(t<T_TOUCH?0.05:0),hook:1,burn:0.3+0.7*seg(t,T_TOUCH+0.6,T_TOUCH+1.2),caught:-1};
}

// ---------- camera keys ----------
const CK=[
 {a:0,b:T_EIF,k:[[0,[23,8,23],[0,0,0]],[T_EIF,[18,6,19],[0,-0.3,0]]]},
 {a:T_EIF,b:T_XR,k:[[T_EIF,[2,40,46],[0,0,7]],[T_XR,[-1,36,42],[0,0,7]]]},
 {a:T_XR,b:T_CAT,k:[[T_XR,[20,7,16],[0,-1,0]],[T_CAT,[-12,8,18],[0,-1,0]]]},
 {a:T_CAT,b:T_LAUNCH-0.3,k:[[T_CAT,[3.2,1.6,3.2],[7,0.2,0.7]],[T_STEAM-0.4,[2.6,1.2,2.6],[6.5,0.2,0.7]],[T_STEAM+0.4,[8,6,10],[4,-0.6,0]],[T_LAUNCH-1.2,[9,5,9],[5,-0.4,0]],[T_LAUNCH-0.3,[3.6,0.9,3.3],[6.8,0,0.7]]]},
 {a:T_LAUNCH-0.3,b:T_LAND,follow:[-2.4,0.9,2.6]},
 {a:T_LAND,b:S("rt_gancho")-1.5,k:[[T_LAND,[-26,6,12],[-10,0,0]],[S("rt_cabos"),[-15,3.4,-6],[-8.5,0,0.4]],[S("rt_gancho")-1.5,[-14,3.6,-6.5],[-9,0,0.4]]]},
 {a:S("rt_gancho")-1.5,b:T_BOL,follow:[-2.6,2.0,-5.6]},
 {a:T_BOL,b:T_MAP,follow:[-3.4,2.2,-6.2]},
 {a:T_MAP,b:T_FIN,k:[[T_MAP,[0,60,0.1],[0,0,0]],[T_FIN,[0,60,0.1],[0,0,0]]]},
 {a:T_FIN,b:DUR+1,k:[[T_FIN,[26,9,26],[0,0,0]],[DUR,[34,13,32],[0,-0.5,0]]]},
];
function camAt(s,t){const k=s.k; if(t<=k[0][0]) return [k[0][1],k[0][2]];
  for(let i=0;i<k.length-1;i++){const A=k[i],B=k[i+1]; if(t<=B[0]){const e=io((t-A[0])/(B[0]-A[0])); return [A[1].map((v,j)=>lerp(v,B[1][j],e)),A[2].map((v,j)=>lerp(v,B[2][j],e))];}}
  const L=k[k.length-1]; return [L[1],L[2]];}
const dip=document.getElementById("dip");

function setXray(a,edgeOp=1){SOLIDS.forEach(m=>{m.material.opacity=a; m.material.depthWrite=a>0.6;}); EDGES.forEach(e=>e.material.opacity=edgeOp);}

function renderAt(t){
  const sc=CK.find(x=>t>=x.a&&t<x.b)||CK[CK.length-1];
  // carrier rotation
  let ry=0;
  if(t<T_EIF) ry=0.5+t*0.16; else if(t>=T_XR&&t<T_CAT) ry=0.25*Math.sin((t-T_XR)*0.3); else if(t>=T_FIN) ry=0.5+(t-T_FIN)*0.16;
  C.rotation.y=ry; C.updateMatrixWorld(true);
  // jet
  const js=jetState(t);
  J.position.copy(js.pos); J.rotation.set(0,js.rotY,js.pitch); hook.rotation.z=0.6*js.hook;
  exh.material.opacity=js.burn*(0.75+0.25*Math.sin(t*40)); exh.scale.set(0.6+0.9*js.burn,0.35+0.25*js.burn,1);
  J.visible=t>=T_CAT&&t<T_MAP;
  C.updateMatrixWorld(true);
  // wires (caught one bends to hook)
  WIRES.forEach((w,i)=>{const p=w.geometry.attributes.position; const mid=onAxis(WIRE_S[i],0,0.05);
    if(js.caught===i){const hp=C.worldToLocal(wp(hook,-0.42,0,0)); mid.copy(hp);}
    p.setXYZ(1,mid.x,mid.y,mid.z); p.needsUpdate=true;
    const hl=seg(t,S("rt_cabos"),S("rt_cabos")+0.3)*(1-seg(t,T_BOL-0.3,T_BOL));
    w.material.color.set(hl>0.5?AMB:"#d8dde3");});
  // camera
  let cp,cl;
  if(sc.follow){const f=sc.follow; const jw=wp(J,0,0,0); const wide=(t>T_BOL)?seg(t,T_TOUCH+3.2,T_MAP)*1:0;
    cp=[jw.x+f[0]-wide*6,jw.y+f[1]+wide*3,jw.z+f[2]-wide*6]; cl=[jw.x+0.8,jw.y,jw.z];}
  else [cp,cl]=camAt(sc,t);
  const sw=Math.sin(t*0.37)*0.04;
  camera.position.set(cp[0]+sw,cp[1]+Math.sin(t*0.29)*0.03,cp[2]); camera.lookAt(cl[0],cl[1],cl[2]); camera.updateMatrixWorld(true);
  // modes
  const inMap=t>=T_MAP&&t<T_FIN;
  C.visible=!inMap; grid.visible=!inMap; sea.visible=!inMap;
  let xr=1, eo=0.75;
  if(t<T_EIF){xr=lerp(0.25,0.9,seg(t,1.5,4.5)); eo=1;}
  else if(t<T_XR){xr=0.85; eo=0.8;}
  else if(t<T_CAT){xr=lerp(0.85,0.1,seg(t,T_XR+0.3,T_XR+1.6)); eo=1;}
  else if(t<T_LAND){const st=seg(t,T_STEAM-0.2,T_STEAM+0.4)*(1-seg(t,T_LAUNCH-0.8,T_LAUNCH-0.2)); xr=lerp(1,0.18,st); eo=lerp(0.45,1,st);}
  else if(t>=T_FIN){xr=lerp(0.9,0.2,seg(t,T_FIN+1,T_FIN+3)); eo=1;}
  else {xr=1; eo=0.45;}
  setXray(xr,eo);
  // reactors + steam
  const rOn=Math.max(seg(t,S("rt_reator1"),S("rt_reator1")+0.5)*(1-seg(t,T_CAT-0.3,T_CAT)), seg(t,T_STEAM-0.2,T_STEAM+0.3)*(1-seg(t,T_LAUNCH-0.6,T_LAUNCH-0.1)));
  REACT.forEach(r=>{r.userData.core.material.opacity=0.85*rOn; r.userData.sp.material.opacity=rOn*(0.8+0.2*Math.sin(t*6));});
  const stOn=seg(t,T_STEAM,T_STEAM+0.4)*(1-seg(t,T_LAUNCH-0.6,T_LAUNCH-0.1));
  steamMat.opacity=0.55*stOn;
  PUFF.forEach((p,i)=>{const u=((t-T_STEAM)*0.45+i/PUFF.length)%1; p.position.copy(steamCurve.getPoint(clamp(u))); p.material.opacity=stOn*sm(Math.min(u,1-u)*6);});
  catMat.opacity=0.35+0.6*seg(t,S("rt_cat"),S("rt_cat")+0.3)*(1-seg(t,T_LAND-0.3,T_LAND));
  // dimension
  dimMat.opacity=seg(t,S("rt_comp"),S("rt_comp")+0.4)*(1-seg(t,T_XR-0.3,T_XR));
  const dk=seg(t,S("rt_comp"),S("rt_comp")+1.0); dimGeo.attributes.position.setX(1,lerp(-16.6,16.7,dk)); dimGeo.attributes.position.needsUpdate=true;
  // eiffel
  TW.visible=t>=T_EIF-0.1&&t<T_XR; twMat.opacity=seg(t,T_EIF+0.2,T_EIF+1.0);
  renderer.render(scene,camera);

  // dips
  let dp=0; for(const b of [T_EIF,T_XR,T_CAT,T_LAND,S("rt_gancho")-1.5,T_BOL,T_MAP,T_FIN]) dp=Math.max(dp,1-clamp(Math.abs(t-b)/0.22));
  dp=Math.max(dp,1-clamp(t/0.35),1-clamp((DUR-t)/0.6)); dip.style.opacity=sm(dp);

  // labels
  let lines="";
  LABELS.forEach((L,i)=>{const el=labEls[i]; const a=L.start,b=L.start+L.dur;
    const op=L.hidden?0:Math.min(seg(t,a,a+0.25),1-seg(t,b-0.25,b));
    if(op<=0||!ANCH[L.props.anchor]){el.style.opacity=0;return;}
    const [x,y,z]=proj(ANCH[L.props.anchor]()); if(z>1){el.style.opacity=0;return;}
    const lx=x+(L.props.dx||0), ly=y+(L.props.dy||0); const w=el.offsetWidth,h=el.offsetHeight;
    const right=(L.props.dx||0)>=0; let left=right?lx+4:lx-w-4; left=clamp(left,40,W-40-w); const top=clamp(ly-h/2,90,H-110-h);
    el.style.left=left+"px"; el.style.top=top+"px"; el.style.opacity=op;
    const ex=right?left:left+w, ey=top+h/2; const k=seg(t,a,a+0.45);
    lines+=`<g opacity="${op}"><line x1="${ex}" y1="${ey}" x2="${lerp(ex,x,k)}" y2="${lerp(ey,y,k)}" stroke="${AMB}" stroke-width="2"/>`+
      (k>0.9?`<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="${AMB}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2" fill="${AMB}"/>`:"")+`</g>`;});
  lsvg.innerHTML=lines;
  // counters
  CNTS.forEach((c,i)=>{const p=c.props, el=cntEls[i]; const a=c.start,b=c.start+c.dur;
    const op=c.hidden?0:Math.min(seg(t,a,a+0.2),1-seg(t,b-0.3,b)); el.style.opacity=op; if(op<=0) return;
    const u=clamp((t-a)/(p.ramp||2)); const ue=p.from<p.to?u*u:1-(1-u)*(1-u);
    el.querySelector("b").textContent=Math.round(lerp(p.from,p.to,ue)).toLocaleString("pt-BR");});
  // map
  const mOp=inMap?Math.min(seg(t,T_MAP,T_MAP+0.3),1-seg(t,T_FIN-0.25,T_FIN)):0; mapEl.style.opacity=mOp;
  if(mOp>0){const cx=640,cy=400,R=270; const kmMax=Math.max(...RINGS.map(r=>r.props.km));
    let m=`<rect width="1280" height="720" fill="#03100a"/>`;
    for(let x=0;x<=1280;x+=40) m+=`<line x1="${x}" y1="0" x2="${x}" y2="720" stroke="${GRN}" stroke-opacity=".08"/>`;
    for(let y=0;y<=720;y+=40) m+=`<line x1="0" y1="${y}" x2="1280" y2="${y}" stroke="${GRN}" stroke-opacity=".08"/>`;
    m+=`<line x1="${cx-R-40}" y1="${cy}" x2="${cx+R+40}" y2="${cy}" stroke="${GRN}" stroke-opacity=".35"/><line x1="${cx}" y1="${cy-R-40}" x2="${cx}" y2="${cy+R+40}" stroke="${GRN}" stroke-opacity=".35"/>`;
    const sweep=(t-T_MAP)*1.4; const sx=cx+Math.cos(sweep)*R*1.05, sy=cy+Math.sin(sweep)*R*1.05;
    m+=`<line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="${GRN}" stroke-opacity=".5" stroke-width="2"/>`;
    RINGS.forEach(r=>{if(r.hidden) return; const rr=R*r.props.km/kmMax; const k=seg(t,r.start,r.start+0.9); if(k<=0) return;
      const circ=2*Math.PI*rr; const main=r.props.km===kmMax;
      m+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${main?AMB:"none"}" fill-opacity="${main?0.06*k:0}" stroke="${main?AMB:GRN}" stroke-width="${main?3:1.6}" stroke-dasharray="${circ*k} ${circ}" transform="rotate(-90 ${cx} ${cy})"/>`;
      m+=`<text x="${cx+rr*0.7071+8}" y="${cy-rr*0.7071-8}" fill="${main?AMB:GRN}" font-family="Share Tech Mono" font-size="${main?30:24}" opacity="${seg(t,r.start+0.6,r.start+1)}">${r.props.text}</text>`;});
    m+=`<g transform="translate(${cx} ${cy})"><polygon points="0,-14 9,12 0,6 -9,12" fill="${AMB}"/></g>`;
    msvg.innerHTML=m;}
  // HUD frame
  const g=GRN; let hd=`<g stroke="${g}" stroke-width="2.5" fill="none" opacity=".85">`+
   `<path d="M40 80 V40 H80"/><path d="M1200 40 H1240 V80"/><path d="M40 640 V680 H80"/><path d="M1240 640 V680 H1200"/></g>`+
   `<text x="96" y="58" fill="${g}" font-family="Share Tech Mono" font-size="20" letter-spacing="2" opacity=".9">${HUDTXT}</text>`+
   `<circle cx="1186" cy="52" r="6" fill="#ff3b30" opacity="${Math.sin(t*5)>0?1:.25}"/><text x="1172" y="59" text-anchor="end" fill="${g}" font-family="Share Tech Mono" font-size="20">REC</text>`;
  hsvg.innerHTML=hd;
  const ss=Math.floor(t), ff=Math.floor((t-ss)*30); tcEl.textContent=`T+00:${String(ss).padStart(2,"0")}:${String(ff).padStart(2,"0")}`;
}
window.__hfRender=renderAt;
window.addEventListener("hf-seek",ev=>renderAt(ev.detail.time));
renderAt(window.__hfThreeTime||0);
</script>
