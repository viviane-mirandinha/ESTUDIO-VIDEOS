<!doctype html>
<html lang="pt"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1280, height=720" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,800;1,800&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:#f3ede4;}
#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#f3ede4;}
.shot{position:absolute;left:0;top:0;width:1280px;height:720px;opacity:0;overflow:hidden;background:#f3ede4;}
.cam{position:absolute;left:0;top:0;width:1280px;height:720px;}
.cam svg{position:absolute;left:0;top:0;}
.ov{position:absolute;left:0;top:0;width:1280px;height:720px;}
.vin{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:20;
 background:radial-gradient(ellipse 72% 70% at 50% 50%,rgba(0,0,0,0) 55%,rgba(70,58,44,.30) 100%);}
.lab{position:absolute;white-space:nowrap;font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;color:#1f2f57;opacity:0;line-height:1.1;letter-spacing:.5px;}
.lab b{color:#d8232a;font-weight:800;}
.big{position:absolute;font-family:'Poppins',sans-serif;font-weight:800;color:#1d3a6e;line-height:.9;opacity:0;}
.sinal{position:absolute;font-family:'Poppins',sans-serif;font-weight:800;color:#d8232a;font-size:60px;letter-spacing:6px;opacity:0;}
.rot{position:absolute;font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;color:#1f2f57;font-size:52px;line-height:1.12;width:540px;opacity:0;}
.bal{position:absolute;font-family:'Poppins',sans-serif;font-weight:800;font-size:50px;color:#d8232a;background:#fff;border:4px solid #2e2a26;border-radius:34px;padding:6px 28px;opacity:0;white-space:nowrap;}
.btn{position:absolute;font-family:'Poppins',sans-serif;font-weight:800;font-size:56px;color:#fff;background:#d8232a;border-radius:60px;padding:8px 46px 12px;opacity:0;border:4px solid #2e2a26;white-space:nowrap;}
.papel{position:absolute;left:250px;top:90px;width:780px;height:470px;background-color:#fbfbf8;opacity:0;
 background-image:linear-gradient(#dfe6ee 2px,transparent 2px),linear-gradient(90deg,#dfe6ee 2px,transparent 2px);background-size:34px 34px;
 box-shadow:0 10px 30px rgba(60,40,20,.18);border:1px solid #e3ddd2;}
.frase{position:absolute;left:0;width:780px;text-align:center;font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;font-size:54px;color:#1f2f57;line-height:1.15;opacity:0;}
.frase b{color:#d8232a;}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1280" data-height="720">
<div id="stage"></div>
<div class="vin"></div>
<!--__ITEMS__-->
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
tl.to({v:0},{v:1,duration:__DUR__,ease:"none"},0);
window.__timelines["main"] = tl;
</script>
<script>
%%RIG%%
(function(){
const EDIT=__EDIT__; const DUR=__DUR__;
const stage=document.getElementById('stage');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const hl=(s,k)=>{s=esc(s);return k?s.split(k).join(`<b>${k}</b>`):s;};
/* ---------- tempo / câmera ---------- */
function mk(it,svg,html='',zoom=.05){const d=document.createElement('div');d.className='shot';d.id='sh_'+it.id;
 d.innerHTML=`<div class="cam"><svg width="1280" height="720" viewBox="0 0 1280 720">${svg}</svg></div><div class="ov">${html}</div>`;
 stage.appendChild(d);const S=+it.start,D=+it.dur;if(S<.05)tl.set(d,{opacity:1},0);else tl.fromTo(d,{opacity:0},{opacity:1,duration:.12},S);if(S+D<DUR-.05)tl.set(d,{opacity:0},S+D);
 tl.fromTo(d.querySelector('.cam'),{scale:1},{scale:1+zoom,duration:D,ease:'none',transformOrigin:'50% 55%'},S);return d;}
function lab(id,txt,x,y,size=56,k=''){return txt?`<div id="${id}" class="lab" style="left:${x}px;top:${y}px;font-size:${size}px">${hl(txt,k)}</div>`:'';}
function showL(id,t){const e=document.getElementById(id);if(!e)return;gsap.set(e,{xPercent:-50,yPercent:-50});tl.fromTo(e,{opacity:0,y:20},{opacity:1,y:0,duration:.35,ease:'power2.out'},t);}
function showS(sel,t,d=.4,from=.6){tl.fromTo(sel,{opacity:0,scale:from},{opacity:1,scale:1,duration:d,ease:'back.out(1.5)',transformOrigin:'50% 50%'},t);}
/* ---------- rig ---------- */
function P(id,who,x,y,s=1,o={}){return `<g transform="translate(${x},${y})${o.flip?' scale(-1,1)':''}">${who==='palito'?PAL(id,o):PES(id,who,o)}</g>`;}
function rig(id,s,p='idle',e='neutro'){gsap.set('#'+id,{scale:s,svgOrigin:'0 0'});setPose(id,p);setEmo(id,e);}
function setPose(id,p){const a=POSE[p];['la','le','ra','re'].forEach((j,k)=>gsap.set(`#${id}_${j}`,{rotation:a[k],svgOrigin:'0 0'}));}
function pose(id,p,t,d=.4){const a=POSE[p];['la','le','ra','re'].forEach((j,k)=>tl.to(`#${id}_${j}`,{rotation:a[k],duration:d,ease:'power2.inOut',svgOrigin:'0 0'},t));}
const FP=['bn','bw','mn','ms','mt','mr'];
function setEmo(id,e){FP.forEach(k=>{const el=document.getElementById(`${id}_f_${k}`);if(el)gsap.set(el,{opacity:EMO[e].includes(k)?1:0});});}
function emo(id,e,t){FP.forEach(k=>{if(document.getElementById(`${id}_f_${k}`))tl.set(`#${id}_f_${k}`,{opacity:EMO[e].includes(k)?1:0},t);});}
function blink(id,t){tl.to(`#${id}_eo`,{scaleY:.1,duration:.07,yoyo:true,repeat:1,transformOrigin:'50% 50%',ease:'none'},t);}
function vivo(id,S,D,first=.7,gap=2.2){for(let t=S+first;t<S+D-.25;t+=gap)blink(id,t);
 const n=Math.max(1,Math.floor(D/1.4));tl.to(`#${id}_b`,{y:-3,duration:.7,yoyo:true,repeat:n*2-1,ease:'sine.inOut'},S);
 tl.to(`#${id}_h`,{rotation:3,duration:1.1,yoyo:true,repeat:Math.max(1,Math.floor(D/1.1))-1,ease:'sine.inOut',svgOrigin:'0 0'},S+.2);}
function nega(id,t){tl.to(`#${id}_h`,{rotation:9,duration:.13,yoyo:true,repeat:5,ease:'sine.inOut',svgOrigin:'0 0'},t);tl.to(`#${id}_h`,{rotation:0,duration:.1,svgOrigin:'0 0'},t+.8);}
function walk(id,t0,t1,per=.5,amp=10){const h=per/2,n=Math.max(1,Math.round((t1-t0)/h));
 for(let k=0;k<n;k++){const t=t0+k*h,s=k%2?1:-1;
  tl.to(`#${id}_ll`,{rotation:amp*s,duration:h,ease:'sine.inOut',svgOrigin:'0 0'},t);tl.to(`#${id}_rl`,{rotation:amp*s,duration:h,ease:'sine.inOut',svgOrigin:'0 0'},t);
  tl.to(`#${id}_${s>0?'l':'r'}k`,{rotation:-28*s,duration:h/2,yoyo:true,repeat:1,ease:'sine.out',svgOrigin:'0 0'},t);
  tl.to(`#${id}_la`,{rotation:16*s,duration:h,ease:'sine.inOut',svgOrigin:'0 0'},t);tl.to(`#${id}_ra`,{rotation:16*s,duration:h,ease:'sine.inOut',svgOrigin:'0 0'},t);
  tl.to(`#${id}_b`,{y:-6,duration:h/2,yoyo:true,repeat:1,ease:'sine.out'},t);}
 tl.to([`#${id}_ll`,`#${id}_rl`,`#${id}_la`,`#${id}_ra`],{rotation:0,duration:.2,svgOrigin:'0 0'},t0+n*h);}
/* ---------- cenário flat ---------- */
const st='stroke="#2e2a26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const chao=(y=600)=>`<path d="M0,${y} H1280" stroke="#d6cbb9" stroke-width="3"/><rect x="0" y="${y}" width="1280" height="${720-y}" fill="#ece4d6"/>`;
const blob=(x,y,r,c,o=1)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${o}"/>`;
function planta(x,y,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0,-40 Q-40,-110 -22,-150 Q-6,-100 0,-40 Z" fill="#8aa86b" ${st}/><path d="M0,-40 Q34,-120 20,-170 Q-2,-110 0,-40 Z" fill="#9dbb7c" ${st}/><path d="M0,-40 Q-60,-80 -66,-100 Q-20,-96 0,-40 Z" fill="#7d9b5f" ${st}/><path d="M-26,-44 L26,-44 L20,0 L-20,0 Z" fill="#d98c5f" ${st}/></g>`;}
function janela(x,y,w=200,h=230){return `<g transform="translate(${x},${y})"><rect width="${w}" height="${h}" fill="#dbe9f1" ${st}/><path d="M${w/2},0 V${h} M0,${h/2} H${w}" ${st}/><rect x="-12" y="${h}" width="${w+24}" height="14" fill="#fbf8f1" ${st}/></g>`;}
function quadro(x,y){return `<g transform="translate(${x},${y})"><rect width="110" height="84" fill="#fbf8f1" ${st}/><path d="M14,70 L44,36 L64,56 L80,42 L98,70 Z" fill="#c9b79a"/><circle cx="80" cy="24" r="9" fill="#e7b85b"/></g>`;}
function porta(i,x,y){return `<g transform="translate(${x},${y})"><rect x="-6" y="-336" width="172" height="342" fill="#5a4636" ${st}/><rect x="0" y="-330" width="160" height="330" fill="#3b2f27"/>
 <g id="${i}folha"><rect x="0" y="-330" width="160" height="330" fill="#e9dfcf" ${st}/><rect x="22" y="-300" width="116" height="120" fill="none" ${st}/><rect x="22" y="-160" width="116" height="130" fill="none" ${st}/><circle cx="138" cy="-165" r="7" fill="#c9a24a" ${st}/></g></g>`;}
function espelho(i,x,y,w=200,h=330,dentro=''){return `<g transform="translate(${x},${y})"><defs><clipPath id="${i}clip"><rect x="0" y="0" width="${w}" height="${h}" rx="12"/></clipPath></defs>
 <rect x="-12" y="-12" width="${w+24}" height="${h+24}" rx="18" fill="#c8a37a" ${st}/><rect x="0" y="0" width="${w}" height="${h}" rx="12" fill="#e3eef3" ${st}/>
 <g clip-path="url(#${i}clip)">${dentro}<path d="M20,${h} L${w*0.7},0 M60,${h} L${w},${h*0.2}" stroke="#fff" stroke-width="14" opacity=".55"/></g></g>`;}
function coracao(id,x,y,s=1,c='#d8232a',op=1){return `<g transform="translate(${x},${y})"><g id="${id}" opacity="${op}"><g transform="scale(${s})"><path d="M0,14 C-26,-6 -22,-30 -8,-30 C-2,-30 0,-24 0,-22 C0,-24 2,-30 8,-30 C22,-30 26,-6 0,14 Z" fill="${c}" stroke="#2e2a26" stroke-width="2.5"/></g></g></g>`;}
const SH={};
/* 1 — celular: não implora */
SH.celular=(it,P_,S,D,i)=>{const a=i+'leo';
 mk(it,blob(560,330,230,'#f0d9c2')+chao()+janela(860,150)+planta(1110,600,1.1)+quadro(250,170)+P(a,'leo',560,600,1,{celular:1})+
  `<g id="${i}chat" opacity="0"><path d="M690,170 h170 a24,24 0 0 1 24,24 v62 a24,24 0 0 1 -24,24 h-120 l-30,26 v-26 h-20 a24,24 0 0 1 -24,-24 v-62 a24,24 0 0 1 24,-24 Z" fill="#fff" ${st}/>
   <circle id="${i}d1" cx="735" cy="225" r="9" fill="#2e2a26"/><circle id="${i}d2" cx="775" cy="225" r="9" fill="#2e2a26"/><circle id="${i}d3" cx="815" cy="225" r="9" fill="#2e2a26"/></g>`);
 rig(a,1,'celular','serio');vivo(a,S,D);showS(`#${i}chat`,S+.4);
 [1,2,3].forEach(k=>tl.to(`#${i}d${k}`,{y:-8,duration:.22,yoyo:true,repeat:5,ease:'sine.inOut'},S+.6+k*.12));
 const tg=S+(+P_.t_guarda||1.8);pose(a,'bolso',tg,.45);tl.to(`#${a}_ph`,{opacity:0,duration:.25},tg+.2);tl.to(`#${i}chat`,{opacity:.25,duration:.4},tg);emo(a,'feliz',tg+.4);};
/* 2 — espelho: autoconhecimento */
SH.espelho=(it,P_,S,D,i)=>{const a=i+'leo',r=i+'ref';
 const ref=`<g transform="translate(110,345) scale(.78)">${P(r,'leo',0,0,1,{flip:1})}</g>`;
 mk(it,chao()+blob(600,330,250,'#f3d3b4',.8)+espelho(i,720,250,220,330,ref)+P(a,'leo',520,600,1)+
  `<g transform="translate(0,-78)"><g id="${i}ideia" opacity="0"><circle cx="520" cy="210" r="34" fill="#f7d36b" ${st}/><rect x="506" y="244" width="28" height="18" rx="4" fill="#c9c2b6" ${st}/>
   <path d="M520,150 V128 M470,170 L455,155 M570,170 L585,155 M455,210 H433 M585,210 H607" ${st}/></g></g>`,.06);
 rig(a,1,'idle','neutro');rig(r,1,'idle','neutro');vivo(a,S,D);vivo(r,S,D);
 tl.to(`#${a}_h`,{rotation:-6,duration:.4,svgOrigin:'0 0'},S+.1);showS(`#${i}ideia`,S+(+P_.t_ideia||.5),.45,.3);emo(a,'feliz',S+.7);emo(r,'feliz',S+.7);};
/* SINAL N — número gigante + Leo + rótulo */
const ICO={
 escudo:`<path d="M0,-50 L40,-36 Q42,14 0,44 Q-42,14 -40,-36 Z" fill="#7fa6c9" ${st}/><path d="M-16,0 L-4,12 L18,-14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>`,
 coracao:`<path d="M0,30 C-50,-6 -42,-50 -16,-50 C-4,-50 0,-40 0,-36 C0,-40 4,-50 16,-50 C42,-50 50,-6 0,30 Z" fill="#d8232a" ${st}/>`,
 setas:`<path d="M-50,-18 H34 M18,-34 L36,-18 L18,-2" fill="none" stroke="#1d3a6e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M50,22 H-34 M-18,6 L-36,22 L-18,38" fill="none" stroke="#d8232a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`};
SH.sinal=(it,P_,S,D,i)=>{const a=i+'leo';
 mk(it,chao(610)+blob(300,330,190,'#e9dcc8')+P(a,'leo',560,610,1.05)+`<g id="${i}ico" transform="translate(940,170)">${ICO[P_.icone]||''}</g>`,
  `<div id="${i}s" class="sinal" style="left:150px;top:96px">SINAL</div><div id="${i}n" class="big" style="left:150px;top:150px;font-size:400px">${esc(P_.n)}</div>
   <div id="${i}r" class="rot" style="left:700px;top:260px">${esc(P_.rotulo)}</div>`,.04);
 rig(a,1.05,'idle','neutro');vivo(a,S,D);
 tl.fromTo(`#${i}n`,{opacity:0,scale:.4,transformOrigin:'40% 60%'},{opacity:1,scale:1,duration:.5,ease:'back.out(1.7)'},S+.05);
 tl.fromTo(`#${i}s`,{opacity:0,x:-30},{opacity:1,x:0,duration:.35},S+.15);showS(`#${i}ico`,S+.5,.45,.3);
 tl.fromTo(`#${i}r`,{opacity:0,y:24},{opacity:1,y:0,duration:.4,ease:'power2.out'},S+(+P_.t_rot||.6));
 pose(a,P_.pose||'idle',S+(+P_.t_pose||.7),.5);emo(a,P_.emo||'serio',S+.8);};
/* balança: dignidade x presença */
SH.balanca=(it,P_,S,D,i)=>{const a=i+'leo';
 const prato=(id,x,txt,ico)=>`<g transform="translate(${x},0)"><g id="${id}"><path d="M0,0 L-70,150 M0,0 L70,150" stroke="#8a7a66" stroke-width="3"/><path d="M-95,150 H95 Q80,190 0,190 Q-80,190 -95,150 Z" fill="#e7c98f" ${st}/>${ico}
   <text x="0" y="250" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="44" fill="#1f2f57">${esc(txt)}</text></g></g>`;
 const medalha=`<circle cx="0" cy="112" r="34" fill="#f2c14e" ${st}/><path d="M-10,112 L-2,122 L14,100" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`;
 const sombra=`<g transform="translate(0,150) scale(.36)">${PES(i+'mini','ana')}</g>`;
 mk(it,chao(620)+blob(760,330,240,'#efe0cb')+`<g transform="translate(760,150)"><rect x="-10" y="0" width="20" height="440" fill="#b59a74" ${st}/><path d="M-80,470 H80 L60,440 H-60 Z" fill="#b59a74" ${st}/>
  <g id="${i}viga"><rect x="-230" y="-8" width="460" height="16" rx="8" fill="#b59a74" ${st}/>${prato(i+'pe',-220,P_.esq,medalha)}${prato(i+'pd',220,P_.dir,sombra)}</g><circle cx="0" cy="0" r="16" fill="#d8b46a" ${st}/></g>`+
  P(a,'leo',250,620,1),'',.04);
 rig(a,1,'idle','serio');rig(i+'mini',1,'idle','neutro');vivo(a,S,D);
 const tp=S+(+P_.t_pesa||.8);tl.fromTo(`#${i}viga`,{rotation:0},{rotation:-12,duration:.7,ease:'back.out(1.4)',svgOrigin:'0 0'},tp);
 tl.to(`#${i}pe`,{rotation:12,duration:.7,ease:'back.out(1.4)',svgOrigin:'0 0'},tp);tl.to(`#${i}pd`,{rotation:12,duration:.7,ease:'back.out(1.4)',svgOrigin:'0 0'},tp);
 nega(a,S+(+P_.t_nao||.3));pose(a,'cruz',tp+.5,.45);};
/* se diminui, sai */
SH.diminui=(it,P_,S,D,i)=>{const a=i+'leo',b=i+'ana';
 mk(it,chao()+janela(120,140,180,210)+porta(i,1040,600)+planta(950,600,.9)+P(b,'ana',330,600,1)+P(a,'leo',600,600,1),'',.03);
 rig(b,1,'aponta','serio');rig(a,1,'idle','neutro');vivo(b,S,D);vivo(a,S,D,.4);
 const td=S+(+P_.t_diminui||1.5);tl.to(`#${a}`,{scale:.55,duration:.6,ease:'power2.inOut',svgOrigin:'0 0'},td);emo(a,'triste',td);
 const ts=S+(+P_.t_sai||2.4);tl.to(`#${a}`,{scale:1,duration:.35,ease:'power2.out',svgOrigin:'0 0'},ts);emo(a,'serio',ts);
 tl.to(`#${i}folha`,{scaleX:.25,duration:.35,svgOrigin:'0 0'},ts);tl.to(`#${a}`,{x:520,duration:D-(ts-S)-.05,ease:'none'},ts+.25);walk(a,ts+.25,S+D-.05,.46);};
/* "eu te amo" — não precisa */
SH.amo=(it,P_,S,D,i)=>{const a=i+'leo',b=i+'ana';
 mk(it,chao()+blob(820,320,200,'#f3d3b4',.7)+planta(140,600,1)+P(b,'ana',380,600,1)+P(a,'leo',860,600,1)+
  `<g transform="translate(860,350)"><g id="${i}brilho" opacity="0"><circle cx="0" cy="0" r="46" fill="#f7d36b" opacity=".55"/><circle cx="0" cy="0" r="26" fill="#f2c14e" ${st}/>${coracao(i+'cv',0,6,.9)}</g></g>`,
  `<div id="${i}bal" class="bal" style="left:200px;top:120px">${esc(P_.balao)} &#10084;</div>`,.04);
 rig(b,1,'peito','feliz');rig(a,1,'idle','neutro');vivo(b,S,D);vivo(a,S,D,1);
 const tb=S+(+P_.t_balao||1.6);tl.fromTo(`#${i}bal`,{opacity:0,scale:.5,transformOrigin:'30% 100%'},{opacity:1,scale:1,duration:.4,ease:'back.out(1.6)'},tb);
 nega(a,S+.3);emo(a,'feliz',tb+.3);const tv=S+(+P_.t_valor||2.9);pose(a,'peito',tv-.3,.4);tl.fromTo(`#${i}brilho`,{opacity:0,scale:.3,svgOrigin:'0 0'},{opacity:1,scale:1,duration:.45,ease:'back.out(1.5)',svgOrigin:'0 0'},tv);tl.to(`#${i}brilho`,{scale:1.15,duration:.4,yoyo:true,repeat:1,svgOrigin:'0 0'},tv+.5);};
/* segurança nasce de dentro, não do reflexo */
SH.dentro=(it,P_,S,D,i)=>{const a=i+'leo',r=i+'ref';
 const ref=`<g transform="translate(100,345) scale(.78)">${P(r,'ana',0,0,1)}</g>`;
 mk(it,chao()+espelho(i,880,230,200,330,ref)+`<g id="${i}x" opacity="0"><path d="M870,230 L1090,570 M1090,230 L870,570" stroke="#d8232a" stroke-width="14" stroke-linecap="round"/></g>`+
  `<g transform="translate(420,370)"><g id="${i}sol" opacity="0">${[150,110,72].map((rr,k)=>`<circle id="${i}o${k}" r="${rr}" fill="#f7d36b" opacity="${.25+k*.2}"/>`).join('')}</g></g>`+P(a,'leo',420,600,1),'',.05);
 rig(a,1,'idle','neutro');rig(r,1,'idle','feliz');vivo(a,S,D);
 const td=S+(+P_.t_dentro||1);pose(a,'peito',td-.3,.4);tl.to(`#${i}sol`,{opacity:1,duration:.2},td);
 [0,1,2].forEach(k=>tl.fromTo(`#${i}o${k}`,{scale:0,svgOrigin:'0 0'},{scale:1,duration:.7,ease:'back.out(1.3)',svgOrigin:'0 0'},td+(2-k)*.12));
 tl.to(`#${i}sol`,{scale:1.06,duration:.5,yoyo:true,repeat:3,ease:'sine.inOut',svgOrigin:'0 0'},td+.8);emo(a,'feliz',td+.2);
 const tr=S+(+P_.t_reflexo||2.2);tl.to(`#${r}`,{opacity:.25,duration:.4},tr);showS(`#${i}x`,tr+.15,.35,.5);};
/* via de mão dupla + fluxo para */
SH.maodupla=(it,P_,S,D,i)=>{const a=i+'leo',b=i+'ana';
 let hs='';for(let k=0;k<4;k++){hs+=coracao(`${i}h1_${k}`,0,300,1,'#d8232a',0)+coracao(`${i}h2_${k}`,0,380,1,'#e58a9a',0);}
