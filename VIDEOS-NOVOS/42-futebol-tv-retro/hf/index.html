  const h=`<div id="${i}bg" class="photo" style="inset:0;background-image:url('${M(P.src)}');filter:grayscale(.35) brightness(.45) sepia(.3)"></div>
   <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(27,15,46,.2),rgba(27,15,46,.85))"></div>
   <div id="${i}q" class="abs ctr rt rgb" style="top:200px;font-size:96px;line-height:1.05;color:#fff;opacity:0">${esc(P.pergunta).replace(/\|/g,'<br>')}</div>
   <div class="abs ctr" style="top:470px"><span id="${i}cta" class="vt" style="display:inline-block;font-size:60px;color:#111;background:#ffd60a;padding:2px 24px;box-shadow:6px 6px 0 #e4572e;opacity:0">${esc(P.cta)}</span></div>`;
  shot(it,h); kb(`#${i}bg`,S,D,1.0,1.1); pop(`#${i}q`,at(S,P.t_q,1),{scale:.7}); pop(`#${i}cta`,at(S,P.t_cta,4),{y:30});
  const t=at(S,P.t_cta,4); for(let k=1;k<6;k++) tl.to(`#${i}cta`,{opacity:k%2?.25:1,duration:.05},t+.4+k*.35); };

for(const it of EDIT.items){ if(it.hidden||it.type!=='scene'||it.by!=='template') continue; const p=it.props||{}; const f=SH[p.scene]; if(f) f(it,p.params||{},+it.start,+it.dur); }

/* ---------- camada de TV: OSD, chiado, rolagem, liga/desliga ---------- */
const O=ED.osd; const op=(O&&O.props&&O.props.params)||{};
if(O&&O.hidden) document.getElementById('osd').style.display='none';
document.getElementById('osd_tl').textContent=op.play||'PLAY ►'; document.getElementById('osd_tr').textContent=op.canal||'CH 03'; document.getElementById('osd_br').textContent=op.data||'JUN. 21 1970';
const BL=document.getElementById('osd_bl'), STA=document.getElementById('static'), BAND=document.getElementById('band'), ROLL=document.getElementById('roll'), SCR=document.getElementById('scenes'), PL=document.getElementById('osd_tl');
const CH=ED.chiado; const cuts=(CH&&!CH.hidden&&CH.props.params.tempos)||[]; const dCh=(CH&&+CH.props.params.dur)||.26;
const hash=n=>{ let x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); };
tl.to({},{duration:DUR,ease:'none',onUpdate:function(){ const t=tl.time(); const f=Math.floor(t*30);
  const s=Math.floor(t); BL.textContent=(op.contador||'SP')+' 0:'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  PL.style.opacity=(Math.floor(t*1.6)%2)?'.55':'1';
  STA.style.backgroundPosition=`${Math.floor(hash(f)*1280)}px ${Math.floor(hash(f+.5)*720)}px`;
  BAND.style.backgroundPosition=`${Math.floor(hash(f+.3)*640)}px ${Math.floor(hash(f+.7)*360)}px`;
  ROLL.style.transform=`translateY(${((t*70)%900)-160}px)`;
  let k=0; for(const c of cuts){ const d=Math.abs(t-c); if(d<dCh/2) k=Math.max(k,1-d/(dCh/2)*.35); }
  const base=+(op.grao||.07); STA.style.opacity=String(Math.max(base,k*.95));
  BAND.style.opacity=k>0?'.9':'0'; BAND.style.top=(k>0?Math.floor(hash(f+.9)*640):0)+'px';
  SCR.style.transform=k>0?`translateX(${Math.round((hash(f+.2)-.5)*18)}px)`:'none';
}},0);
/* liga a TV */
tl.fromTo('#scr',{scaleY:.006,scaleX:.6},{scaleY:1,scaleX:1,duration:.32,ease:'power3.out'},0);
tl.fromTo('#flash',{opacity:.9},{opacity:0,duration:.35},0.05);
/* desliga a TV */
const off=DUR-.75; tl.to('#scr',{scaleY:.006,duration:.22,ease:'power3.in'},off); tl.to('#scr',{scaleX:0,duration:.25,ease:'power2.in'},off+.22);
tl.to('#osd',{opacity:0,duration:.1},off); tl.fromTo('#flash',{opacity:0},{opacity:.6,duration:.1,yoyo:true,repeat:1},off+.18);
})();
</script>
