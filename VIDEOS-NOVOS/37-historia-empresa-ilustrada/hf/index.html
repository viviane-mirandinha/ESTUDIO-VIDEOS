/* 1966 Ultra Hand */
SH.ultra=(it,P_,S,D,i)=>{

  const bola=`<g id="${i}bo" transform="translate(1110,400)"><circle r="34" fill="#4f7fbf" stroke="${K}" stroke-width="4"/><path d="M-30,-10 Q0,10 30,-10" stroke="#f2ead6" stroke-width="5" fill="none"/></g>`;
  const pers=P({id:i+'yk',x:260,y:660,s:1.05,roupa:'#4f6a8e',calca:'#3f5878',macacao:true,bone:'#4f6a8e',pose:'point',emo:'feliz'});
  const caixa=`<g transform="translate(150,520) rotate(-6)"><rect x="-90" y="-60" width="180" height="120" fill="#e8c23f" stroke="${K}" stroke-width="4"/><text y="-8" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="30" fill="${K}">ULTRA</text><text y="28" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="30" fill="${RED}">HAND</text></g>`;

  tl.to(`#${i}lat`,{scaleX:.3,duration:.8,ease:'power2.inOut',svgOrigin:'0 0'},te+1.5); tl.to(`#${i}gar`,{x:L0*.3,duration:.8,ease:'power2.inOut'},te+1.5);

/* 1981 Miyamoto + arcade */
SH.miya=(it,P_,S,D,i)=>{
  let bg=wallPlanks('#3b3a46','#2e2d38')+`<rect x="0" y="580" width="1280" height="140" fill="#5a4a5e" stroke="${K}" stroke-width="4"/>`;

  const tela=`<rect x="-120" y="-150" width="240" height="190" fill="#0d0d16"/>`+[0,1,2].map(k=>`<path d="M-110,${-110+k*55} L110,${-95+k*55-(k%2)*30}" stroke="#d24a5a" stroke-width="7"/><path d="M-110,${-110+k*55} L110,${-95+k*55-(k%2)*30}" stroke="#ffb0b8" stroke-width="2" stroke-dasharray="10 8"/>`).join('')+`<g id="${i}px">${pxGuy(-60,30,0.42)}</g><rect x="60" y="-150" width="40" height="34" fill="#8b5a2b"/>`;
  const arc=`<g transform="translate(930,600)"><path d="M-170,0 V-470 L-140,-500 H140 L170,-470 V0Z" fill="#3c5fa8" stroke="${K}" stroke-width="5"/><rect x="-150" y="-490" width="300" height="70" fill="#e8c23f" stroke="${K}" stroke-width="4"/><text y="-442" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="40" fill="${RED}">${esc(P_.jogo)}</text><g transform="translate(0,-210)">${tela}<rect x="-130" y="-160" width="260" height="210" fill="none" stroke="${K}" stroke-width="6"/></g><rect x="-160" y="-150" width="320" height="60" fill="#2c4a8a" stroke="${K}" stroke-width="4"/><circle cx="-60" cy="-120" r="12" fill="${RED}" stroke="${K}" stroke-width="3"/><circle cx="40" cy="-120" r="12" fill="#e8c23f" stroke="${K}" stroke-width="3"/></g>`;
  const prancheta=`<g transform="translate(330,470) rotate(-8)"><rect x="-130" y="-90" width="260" height="180" fill="#f8f3e6" stroke="${K}" stroke-width="4"/><g transform="translate(-30,40)">${pxGuy(0,0,.55)}</g><path d="M40,-50 q30,-10 50,10 M40,-20 h60 M40,10 h40" stroke="${K}" stroke-width="3" fill="none"/></g>`;
  const pers=P({id:i+'my',x:230,y:680,s:1.1,roupa:'#c8a24a',longo:'#2b2620',pose:'hold',emo:'feliz'});
  const cont=prancheta+pers+arc+lab(i+'ano',P_.ano,470,150,{size:100,rot:-3,color:'#f4efe4',stroke:K})+plaque(i+'pl',P_.nome,470,235,{size:38,bg:'#f2ead6'})+lab(i+'l1',P_.rotulo,600,320,{size:54,color:'#f7d58a',stroke:K,sw:9,rot:-4});
  mk(it,bg,cont,{z0:1.0,z1:1.1,ox:900,oy:380});
  tl.to(`#${i}px`,{x:150,duration:D,ease:'steps(24)'},S); breath(i+'my',S,D); blink(i+'my',S+2);
  show(`#${i}ano`,S+.1); show(`#${i}pl`,S+(+P_.t_nome||2.3)); show(`#${i}l1`,S+(+P_.t_rot||5.1)); };
/* o futuro Mario */
SH.futuro=(it,P_,S,D,i)=>{
  let bg=`<rect width="1280" height="720" fill="#20202c"/><path d="M640,0 L360,720 H920Z" fill="#f7d58a" opacity=".18"/><ellipse cx="640" cy="600" rx="260" ry="40" fill="#f7d58a" opacity=".35"/>`;
  const cont=pxGuy(640,600,2.6,i+'pg')+lab(i+'l1',P_.rotulo,640,170,{size:84,color:'#f7d58a',stroke:K,sw:10});
  mk(it,bg,cont,{z0:1.0,z1:1.12,oy:450});
  show(`#${i}pg`,S,.5); show(`#${i}l1`,S+(+P_.t_rot||.3)); };
/* 1983 Famicom sala japonesa */
SH.famicom=(it,P_,S,D,i)=>{
  let bg=wallPlanks('#e2d3b0','#cdbb94')+`<rect x="0" y="520" width="1280" height="200" fill="url(#tatami)" stroke="${K}" stroke-width="4"/>`;
  bg+=`<g transform="translate(160,120)"><rect x="0" y="0" width="200" height="260" fill="#f3ead3" stroke="${K}" stroke-width="5"/><path d="M100,0 V260 M0,86 H200 M0,173 H200" stroke="${K}" stroke-width="3"/></g>`;
  const tela=`<g id="${i}tl"><rect x="-90" y="-72" width="150" height="130" fill="#6fa8dc"/><rect x="-90" y="20" width="150" height="38" fill="#b5653a"/>${pxGuy(-30,20,.3)}</g>`;
  const tv=`<g transform="translate(860,420)"><rect x="-150" y="90" width="300" height="70" fill="${WOOD}" stroke="${K}" stroke-width="4"/>${crt(0,0,1.05,tela)}</g>`;
  const cons=`<g transform="translate(860,600)"><rect x="-80" y="-24" width="160" height="40" rx="4" fill="#efe6d2" stroke="${K}" stroke-width="4"/><rect x="-80" y="-4" width="160" height="20" fill="#b03a32" stroke="${K}" stroke-width="3"/><path d="M-60,16 Q-140,60 -330,40 M60,16 Q120,70 -140,60" stroke="${K}" stroke-width="3" fill="none"/></g>`;
  const fam=P({id:i+'f1',x:420,y:680,s:.95,roupa:'#8e5b4a',cabelo:'#2b2620',pose:'hold',emo:'feliz'})+P({id:i+'f2',x:560,y:690,s:.7,roupa:'#4f7fbf',cabelo:'#2b2620',pose:'hold',emo:'uau'})+P({id:i+'f3',x:270,y:690,s:.75,roupa:'#c8a24a',cabelo:'#2b2620',pose:'up',emo:'feliz'});
  const cont=tv+cons+fam+lab(i+'ano',P_.ano,640,150,{size:100,rot:-3})+plaque(i+'pl',P_.nome,640,235,{size:42,bg:'#f2ead6'});
  mk(it,bg,cont,{z0:1.0,z1:1.08});
  ['f1','f2','f3'].forEach((f,k)=>{breath(i+f,S,D,.03,.9+k*.2);}); show(`#${i}ano`,S+.1); show(`#${i}pl`,S+(+P_.t_nome||1.3));
  tl.to(`#${i}tl`,{x:-6,duration:.2,yoyo:true,repeat:Math.floor(D/.4)*2-1},S); };
/* 1985 NES nos EUA */
SH.nes=(it,P_,S,D,i)=>{
  let bg=`<rect width="1280" height="720" fill="#bcd3d0"/>`; const r=rng(4); for(let k=0;k<40;k++) bg+=`<path d="M${r()*1280},${r()*720} q10,-6 20,0 q10,6 20,0" stroke="#8fb1ad" stroke-width="3" fill="none"/>`;
  bg+=`<path d="M60,200 Q140,150 200,210 Q260,300 210,380 Q170,440 120,420 Q70,360 90,300Z" fill="#d9c49a" stroke="${K}" stroke-width="4"/><path d="M830,140 Q1000,110 1200,160 Q1240,260 1180,360 Q1060,420 960,400 Q860,360 840,280Z" fill="#d9c49a" stroke="${K}" stroke-width="4"/>`;
  const lbls=lab(i+'jp',P_.de,150,470,{size:38,q:false})+lab(i+'us',P_.para,1030,280,{size:46,q:false});
  const rota=`<path id="${i}rt" pathLength="1" d="M200,260 Q520,40 860,230" stroke="${RED}" stroke-width="8" fill="none" stroke-dasharray="1" stroke-linecap="round"/>`;
  const cx=`<g id="${i}cx" opacity="0" transform="translate(640,470)"><rect x="-150" y="-60" width="300" height="120" rx="6" fill="#bdbdb8" stroke="${K}" stroke-width="5"/><rect x="-150" y="-60" width="300" height="40" fill="#dcdcd6" stroke="${K}" stroke-width="4"/><rect x="-110" y="0" width="140" height="22" fill="#2b2b2b"/><rect x="60" y="4" width="20" height="14" fill="${RED}"/><text x="0" y="-28" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="30" fill="${K}">${esc(P_.nome)}</text></g>`;
  const cart=`<g id="${i}ct" opacity="0" transform="translate(640,320) rotate(-5)"><rect x="-150" y="-50" width="300" height="100" fill="#8a8a86" stroke="${K}" stroke-width="4"/><rect x="-130" y="-36" width="260" height="70" fill="#f2ead6" stroke="${K}" stroke-width="3"/><text y="12" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="34" fill="${RED}">${esc(P_.jogo)}</text></g>`;
  const cont=rota+lbls+cx+cart+lab(i+'ano',P_.ano,640,150,{size:100,rot:-3});
  mk(it,bg,cont,{z0:1.0,z1:1.06});
  fade(`#${i}jp`,S); drawOn(`#${i}rt`,S+.2,1.0); show(`#${i}ano`,S+(+P_.t_ano||.6)); fade(`#${i}us`,S+1.1); show(`#${i}cx`,S+(+P_.t_nome||1.7)); show(`#${i}ct`,S+(+P_.t_jogo||3.7)); };
/* linha de consoles */
SH.linha=(it,P_,S,D,i)=>{
  let bg=`<rect width="1280" height="720" fill="#efe6d2"/>`+`<path d="M80,470 H1200" stroke="${K}" stroke-width="6" stroke-dasharray="14 10"/>`;
  const ic=[
   `<rect x="-55" y="-95" width="110" height="180" rx="12" fill="#c9c6bb" stroke="${K}" stroke-width="5"/><rect x="-40" y="-78" width="80" height="66" fill="#9bb07a" stroke="${K}" stroke-width="3"/><path d="M-30,30 h24 M-18,18 v24" stroke="${K}" stroke-width="7"/><circle cx="20" cy="36" r="8" fill="${RED}"/><circle cx="38" cy="24" r="8" fill="${RED}"/>`,
   `<rect x="-24" y="-100" width="48" height="180" rx="6" fill="#f6f5f0" stroke="${K}" stroke-width="5"/><rect x="40" y="-60" width="22" height="110" rx="10" fill="#f6f5f0" stroke="${K}" stroke-width="4"/><circle cx="51" cy="-40" r="5" fill="#bbb"/>`,
   `<rect x="-60" y="-50" width="120" height="80" rx="6" fill="#3a3a3a" stroke="${K}" stroke-width="5"/><rect x="-50" y="-42" width="100" height="64" fill="#6fa8dc"/><rect x="-92" y="-50" width="32" height="80" rx="14" fill="#3ab0d8" stroke="${K}" stroke-width="4"/><rect x="60" y="-50" width="32" height="80" rx="14" fill="#e0503a" stroke="${K}" stroke-width="4"/>`,
   `<rect x="-74" y="-56" width="148" height="92" rx="6" fill="#2e2e2e" stroke="${K}" stroke-width="5"/><rect x="-64" y="-48" width="128" height="76" fill="#8fb8e0"/><rect x="-110" y="-56" width="36" height="92" rx="14" fill="#2e2e2e" stroke="${K}" stroke-width="4"/><rect x="74" y="-56" width="36" height="92" rx="14" fill="#2e2e2e" stroke="${K}" stroke-width="4"/><text y="0" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="40" fill="#fff">2</text>`];
  const N=[P_.n1,P_.n2,P_.n3,P_.n4], A=[P_.a1,P_.a2,P_.a3,P_.a4], T=[P_.t1,P_.t2,P_.t3,P_.t4];
  let nd=''; N.forEach((n,k)=>{ const x=200+k*293; nd+=`<g id="${i}n${k}" opacity="0" transform="translate(${x},330)">${ic[k]}<text y="140" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="40" fill="${K}">${esc(n)}</text><circle cy="140" cx="0" r="0"/></g><g id="${i}d${k}" opacity="0"><circle cx="${x}" cy="470" r="16" fill="${RED}" stroke="${K}" stroke-width="4"/><text x="${x}" y="560" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="46" fill="${RED}">${esc(A[k])}</text></g>`; });
  const cont=nd;
  mk(it,bg,cont,{z0:1.0,z1:1.05});
  N.forEach((_,k)=>{ show(`#${i}n${k}`,S+(+T[k]),.35); show(`#${i}d${k}`,S+(+T[k])+.05,.35); }); };
/* de cartas a gigante */
SH.gigante=(it,P_,S,D,i)=>{
  let bg=`<rect width="1280" height="720" fill="#efe2bd"/>`+`<rect x="0" y="600" width="1280" height="120" fill="#c9a86e" stroke="${K}" stroke-width="4"/>`;
  const c1=card(250,470,-6,'sol',1.6,i+'cd');
  const seta=`<path id="${i}st" pathLength="1" d="M380,470 Q560,380 740,440" stroke="${RED}" stroke-width="12" fill="none" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1"/><path id="${i}sp" opacity="0" d="M720,410 L760,446 L712,462Z" fill="${RED}"/>`;
  let pilha=''; const cores=['#3c5fa8','#c8372d','#e8c23f','#4f9a6a','#7c6a8e']; for(let k=0;k<7;k++) pilha+=`<g transform="translate(${960+(k%2)*14-7},${590-k*62})"><rect x="-130" y="-56" width="260" height="56" rx="6" fill="${cores[k%5]}" stroke="${K}" stroke-width="4"/><rect x="-100" y="-40" width="60" height="24" fill="#f2ead6" stroke="${K}" stroke-width="2.5"/></g>`;
  const cont=c1+seta+`<g id="${i}pi">${pilha}</g>`+lab(i+'l1',P_.rotulo,640,150,{size:62});
  mk(it,bg,cont,{z0:1.0,z1:1.06});
  show(`#${i}cd`,S+.05); show(`#${i}l1`,S+.3); drawOn(`#${i}st`,S+(+P_.t_seta||1.0),.6); fade(`#${i}sp`,S+(+P_.t_seta||1.0)+.55,.1);
  gsap.set(`#${i}pi`,{scaleY:0,svgOrigin:'960 600'}); tl.to(`#${i}pi`,{scaleY:1,duration:.8,ease:'back.out(1.4)',svgOrigin:'960 600'},S+(+P_.t_gig||1.7)); };

/* ---------- montar cenas ---------- */
for(const it of EDIT.items){ if(it.hidden||it.type!=='scene'||it.by!=='template') continue; const p=it.props||{}; const f=SH[p.scene]; if(f) f(it,p.params||{},+it.start,+it.dur,it.id+'_'); }

/* ---------- régua do tempo (anos) por cima ---------- */
const TL=EDIT.items.find(x=>x.id==='regua');
if(TL && !TL.hidden){ const pr=TL.props.params; const anos=pr.anos, tempos=pr.tempos; const x0=170,x1=1110,y=668;
  let s=`<g id="rg" opacity="0"><rect x="${x0-40}" y="${y-30}" width="${x1-x0+80}" height="58" rx="29" fill="#f4efe4" stroke="${K}" stroke-width="3" opacity=".92"/><path d="M${x0},${y} H${x1}" stroke="${K}" stroke-width="3"/>`;
  anos.forEach((a,k)=>{ const x=x0+(x1-x0)*k/(anos.length-1); s+=`<circle id="rgd${k}" cx="${x}" cy="${y}" r="6" fill="#f4efe4" stroke="${K}" stroke-width="3"/><text id="rgt${k}" x="${x}" y="${y-10}" text-anchor="middle" font-family="'Kalam'" font-weight="700" font-size="17" fill="#8a7d68">${a}</text>`; });
  s+=`<g id="rgm" transform="translate(${x0},${y})"><circle r="11" fill="${RED}" stroke="${K}" stroke-width="3"/></g></g>`;
  document.getElementById('over').innerHTML=`<svg viewBox="0 0 1280 720" width="1280" height="720">${s}</svg>`;
  tl.to('#rg',{opacity:1,duration:.4},+TL.start); tl.to('#rg',{opacity:0,duration:.4},+TL.start+(+TL.dur));
  anos.forEach((a,k)=>{ const x=x0+(x1-x0)*k/(anos.length-1), t=+tempos[k];
    tl.to('#rgm',{x:x,duration:.5,ease:'power2.inOut'},t); tl.to(`#rgd${k}`,{attr:{fill:RED},duration:.1},t+.4); tl.to(`#rgt${k}`,{attr:{fill:K,'font-size':22},duration:.2},t+.4); }); }
})();
</script>

})();</script>
