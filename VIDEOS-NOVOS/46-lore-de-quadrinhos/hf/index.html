function camOf(r){const m=34;const s=Math.min(1280/(r[2]+m*2),720/(r[3]+m*2));return {s,cx:r[0]+r[2]/2,cy:r[1]+r[3]/2};}

    /* câmera passeando entre os quadros */
    let ki=0;for(let i=0;i<pg.keys.length;i++)if(t>=pg.keys[i].t-0.3)ki=i;
    const cur=camOf(pg.keys[ki].r);let c=cur;
    if(ki>0){const prev=camOf(pg.keys[ki-1].r);const p=eio(lin(t,pg.keys[ki].t-0.3,pg.keys[ki].t+0.35));c={s:mix(prev.s,cur.s,p)*(1-0.10*Math.sin(Math.PI*p)),cx:mix(prev.cx,cur.cx,p),cy:mix(prev.cy,cur.cy,p)};}
    const t0=pg.keys[ki].t,t1=ki+1<pg.keys.length?pg.keys[ki+1].t:pg.E;const dr=lin(t,t0,t1);
    const s=c.s*(1+0.045*dr),dx=12*Math.sin(dr*Math.PI*.9);
    pg.cam.setAttribute('transform',`translate(${f(640+dx)},360) scale(${s.toFixed(4)}) translate(${f(-c.cx)},${f(-c.cy)})`);
    pg.pops.forEach(o=>{if(t<o.at){o.n.style.opacity=0;return;}const p=lin(t,o.at,o.at+.35);o.n.style.opacity=Math.min(1,p*3);
      o.n.setAttribute('transform',o.ns?(o.sl?`translate(0,${f(-30*(1-eo(p)))})`:''):`scale(${f(.4+.6*bk(p))})`);});
    pg.flash.forEach(o=>{const inn=t>=o.a&&t<o.b;const fl=inn&&(t-o.a<.5?(Math.floor((t-o.a)*14)%2===0):Math.floor(t*3)%4===0);o.n.style.opacity=fl?1:0;});
    pg.pulse.forEach(n=>{n.style.opacity=f(.75+.25*Math.sin(t*4));});
