#clockS{font-size:24px;color:#ffd23f;letter-spacing:2px;margin-top:6px;}
.ttl{position:absolute;left:56px;top:40px;display:none;max-width:980px;}
.ttl .a{font-size:58px;line-height:1.05;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.8);background:rgba(6,8,10,.7);padding:8px 18px 10px;border-left:8px solid #ffd23f;display:inline-block;}
.ttl .b{font-size:30px;color:#ffd23f;letter-spacing:2px;margin-top:8px;padding-left:4px;text-shadow:0 2px 8px #000;}

.ttl.mid .a{border-left:0;background:none;font-size:64px;}
.ttl.btn{left:50%;top:auto;bottom:70px;transform:translateX(-50%);}
.ttl.btn .a{background:#d23b3b;border-left:0;padding:10px 34px 12px;border-radius:6px;}
.num{position:absolute;left:56px;bottom:50px;display:none;}
.num.r{left:auto;right:56px;text-align:right;}
.num .a{font-size:96px;line-height:.95;color:#ffd23f;text-shadow:0 4px 20px rgba(0,0,0,.9);}
.num .b{font-size:34px;letter-spacing:1.5px;background:rgba(6,8,10,.8);padding:6px 14px;display:inline-block;}
