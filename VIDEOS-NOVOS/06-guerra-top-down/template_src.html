#clockT div{height:52px;line-height:52px;}

.num{position:absolute;left:56px;bottom:50px;display:none;}

.num .a{font-size:96px;line-height:.95;color:#ffd23f;text-shadow:0 4px 20px rgba(0,0,0,.9);}

// estaleiro / tanques / Hickam
for(let i=0;i<34;i++){const x=lerp(0.9,2.5,rnd()),y=lerp(-2.7,-1.75,rnd()),w=lerp(.06,.16,rnd()),h=lerp(.04,.1,rnd());el('rect',{x,y:-y,width:w,height:h,fill:rnd()<.35?'#a0473b':'#c9c3b4'},gH);}
el('rect',{x:1.05,y:1.68,width:.4,height:.075,fill:'#5f666b',transform:'rotate(-28 1.25 1.72)'},gH);
for(let i=0;i<4;i++)for(let j=0;j<3;j++)el('circle',{cx:2.15+i*.13,cy:.45+j*.13,r:.048,fill:'#e9e6dc',stroke:'#9c9a90','stroke-width':.008},gH);
el('rect',{x:1.7,y:3.95,width:1.9,height:.07,fill:'#c2b48a',transform:'rotate(-18 2.65 4)'},gH);
el('rect',{x:1.8,y:3.8,width:1.4,height:.07,fill:'#c2b48a',transform:'rotate(52 2.5 3.85)'},gH);
el('rect',{x:2.2,y:3.3,width:.7,height:.25,fill:'#a9a28a'},gH);
// navios

 const hull=el('path',{d,fill:'#8f969c',stroke:'#3b4044','stroke-width':.004},g);const det=el('g',{},g);

const SHIPS={},ROWD=[['california',-.72,.58],['maryland',-.42,.58],['oklahoma',-.42,.627],['tennessee',-.12,.58],['westvirginia',-.12,.627],['arizona',.18,.58],['vestal',.18,.627,.18],['nevada',.48,.6]];
const rowG=el('g',{transform:RT},gShips);
for(const [n,u,v,L] of ROWD){const g=el('g',{transform:`translate(${u},${v})`},rowG);SHIPS[n]={g,u,v,...shipShape(g,L||.26,.044),bs:n!=='vestal'};}
{const g=el('g',{transform:'translate(1.25,1.72) rotate(-28)'},gShips);SHIPS.pennsylvania={g,...shipShape(g,.24,.04),bs:true,fixed:[1.25,1.72]};}

for(const n in SHIPS){if(!SHIPS[n].bs)continue;const p=shipWorld(n);SHIPS[n].box=el('rect',{x:-.17,y:-.05,width:.34,height:.1,rx:.02,fill:'none',stroke:YEL,'stroke-width':3,'vector-effect':'non-scaling-stroke',opacity:0,transform:`translate(${p[0]},${p[1]}) rotate(${n==='pennsylvania'?-28:-35})`},hl);}

const EV=BY('eventos');const evOf=t=>EV.filter(e=>e.props.tipo===t);

smoke(shipWorld('westvirginia'),40.2,.075);smoke(shipWorld('california'),42.6,.07);smoke(shipWorld('nevada'),55.5,.07);
smoke(shipWorld('tennessee'),63.5,.06,8);smoke(shipWorld('maryland'),64.0,.055,8);smoke(shipWorld('pennsylvania'),62.5,.06,8);

const PLANE='M0,-11 L2,-6 L2,-2 L12,1 L12,3 L2,2 L1.5,7 L5,9 L5,10.5 L0,9.5 L-5,10.5 L-5,9 L-1.5,7 L-2,2 L-12,3 L-12,1 L-2,-2 L-2,-6Z';
const ARR=[];
for(const e of EV.filter(e=>e.props.tipo==='onda'||e.props.tipo==='retirada')){
 const g=el('g',{opacity:0},ov),ret=e.props.tipo==='retirada';
 const body=el('path',{fill:'none',stroke:RED,'stroke-width':ret?8:13,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.85,'stroke-dasharray':ret?'20 14':'none'},g);
 const head=el('path',{d:'M0,0 L-30,-17 L-24,0 L-30,17Z',fill:RED},g);
 const pl=[];for(let i=0;i<e.props.avioes;i++){const pg=el('g',{},g);el('path',{d:PLANE,fill:'#e4dfd2',stroke:'#2a2a2a','stroke-width':.8},pg);el('circle',{cx:7,cy:1.6,r:1.6,fill:'#c8102e'},pg);el('circle',{cx:-7,cy:1.6,r:1.6,fill:'#c8102e'},pg);
  pl.push({pg,lag:rnd()*.9,off:(i%2?1:-1)*(8+Math.floor(i/2)*9)*(.8+rnd()*.4),sc:.95+rnd()*.25});}
 const bursts=[];if(e.props.alvo)for(let k=0;k<3;k++)bursts.push({c:el('circle',{r:0,fill:'url(#fire)'},g),dx:(rnd()-.5)*40,dy:(rnd()-.5)*30,dt:k*.28+rnd()*.15});

 el('path',{d,fill,stroke,'stroke-width':3},g);if(!sub){el('rect',{x:-L*.1,y:-B*.25,width:L*.22,height:B*.5,fill:'#5d646a'},g);for(const f of[-.34,.3])el('circle',{cx:L*f,cy:0,r:B*.24,fill:'#4c5257'},g);el('rect',{x:-L*.02,y:-B*.12,width:L*.05,height:B*.24,fill:'#333'},g);}
