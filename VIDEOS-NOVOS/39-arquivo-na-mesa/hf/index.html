for(const it of ITEMS){ if(it.by!=='template'||it.track!=='fios') continue; const p=it.props.params; const A=O[p.a],B=O[p.b]; if(!A||!B) continue;
  const pin=o=>[o.x, o.y-(o.k==='nota'?34:(o.h||80)*0.36)];
  const [x1,y1]=pin(A),[x2,y2]=pin(B); const mx=(x1+x2)/2, my=(y1+y2)/2+Math.hypot(x2-x1,y2-y1)*0.07;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('opacity','0');
  g.innerHTML=`<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" stroke="rgba(0,0,0,.45)" stroke-width="5" fill="none" transform="translate(4,9)" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
   <path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" stroke="${COR}" stroke-width="5" fill="none" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>
   <circle cx="${x1}" cy="${y1}" r="11" fill="${COR}" stroke="#4a0508" stroke-width="2"/><circle cx="${x1-3}" cy="${y1-3}" r="3.5" fill="#ff8a8a"/>
   <circle class="p2" cx="${x2}" cy="${y2}" r="11" fill="${COR}" stroke="#4a0508" stroke-width="2" opacity="0"/>`;
  cord.appendChild(g); fios.push({g,t:+it.start,paths:g.querySelectorAll('path'),p2:g.querySelector('.p2')});
}
/* lupas */
const LU=[];
for(const it of lupas){ const p=it.props.params; const T=O[p.alvo]; if(!T) continue; const R=+p.r||100;
  const W=document.createElement('div'); W.className='lupaW';
  W.innerHTML=`<div class="cabo" style="left:${R*0.72}px;top:${R*0.72}px;transform:rotate(-45deg)"></div><div class="lens" style="left:${-R-12}px;top:${-R-12}px;width:${2*R}px;height:${2*R}px"><div class="in"></div><div class="glare"></div></div>`;
  world.appendChild(W); const inn=W.querySelector('.in'); const cl_=T.el.cloneNode(true); cl_.id=''; inn.appendChild(cl_);
  LU.push({it,p,W,inn,cl:cl_,T,R,t:+it.start,d:+it.dur});
}
/* câmera */
const CAM=ITEMS.filter(i=>i.track==='camera').map(i=>({t:+i.start,...i.props.params})).sort((a,b)=>a.t-b.t);
const CREEP=0.006;
function camAt(t){ let k=0; for(let i=0;i<CAM.length;i++) if(CAM[i].t<=t) k=i;
  const c=CAM[k], pv=CAM[Math.max(0,k-1)];
  const pvz=+pv.zoom*(1+CREEP*Math.max(0,c.t-pv.t));
  const u=k===0?1:io(cl((t-c.t)/(+c.mov||1.3)));
  let x=+pv.x+(+c.x-+pv.x)*u, y=+pv.y+(+c.y-+pv.y)*u, r=+pv.rot+(+c.rot-+pv.rot)*u;
  let z=pvz+(+c.zoom-pvz)*u; z*=1+CREEP*Math.max(0,t-c.t-(+c.mov||1.3));
  x+=Math.sin(t*.63)*6+Math.sin(t*1.7)*2; y+=Math.cos(t*.51)*5+Math.sin(t*1.3)*1.5; r+=Math.sin(t*.4)*.3;
  const hw=(640+70)/z, hh=(360+70)/z;
  x=hw*2>3200?1600:Math.max(hw,Math.min(3200-hw,x)); y=hh*2>2000?1000:Math.max(hh,Math.min(2000-hh,y));
  return {x,y,z,r}; }
/* legendas / canto / final */
const SUBS=ITEMS.filter(i=>i.track==='legenda').map(i=>({a:+i.start,b:+i.start+(+i.dur),t:i.props.text}));
const subEl=document.getElementById('sub'); let subCur=null;
const canto=PAR('canto'); document.querySelector('#canto span').textContent=canto||''; if(!canto) document.getElementById('canto').style.display='none';
const FI=ITEMS.find(i=>i.id==='final'); const fin=document.getElementById('fin');
if(FI){ const q=FI.props.params; fin.querySelector('h1').textContent=q.titulo||''; fin.querySelector('p').textContent=q.sub||''; fin.querySelector('.carimbo').textContent=q.carimbo||''; }
const finSt=fin.querySelector('.carimbo'); const grao=document.getElementById('grao'); const luz=document.getElementById('luz');

function render(t){
  const c=camAt(t);
  world.style.transform=`translate(640px,360px) rotate(${c.r}deg) scale(${c.z}) translate(${-c.x}px,${-c.y}px)`;
  for(const id in O){ const o=O[id]; const el=o.el; const dt=t-o.t; let op=0,s=1,ty=0;
    if(dt>=0){
      if(o.k==='carimbo'){ const a=cl(dt/0.2); s=2.3-1.3*oq(a); op=.9*cl(a*1.6); }
      else if(o.k==='nota'){ op=1; const d=Math.max(.5,Math.min(1.4,o.txt.length*.05)); el.style.clipPath=`inset(-20% ${(100*(1-cl(dt/d))).toFixed(1)}% -20% 0)`; }
      else if(o.k==='circulo'){ op=1; el.querySelector('path').style.strokeDashoffset=1-io(cl(dt/0.7)); }
      else { const a=io(cl(dt/0.5)); op=cl(a*1.4); s=1.10-0.10*a; ty=-26*(1-a); }
      if(o.k==='ficha'){ const tx=o.txt, d0=+o.p.t_tipo||0.2; const n=Math.floor(cl((dt-d0)/(tx.length*0.035))*tx.length); const sb=tx.slice(0,n);
        const e=el.firstChild; if(e.__n!==n){e.textContent=sb+(n<tx.length&&n>0?'_':''); e.__n=n;} }
      if(o.k==='tempo'){ const u=cl((dt-(+o.p.t_linha||.8))/2.2); el.querySelector('.ln').style.strokeDashoffset=1-io(u);
        el.querySelector('.m2').setAttribute('opacity',u>=1?1:0); el.querySelector('.big').style.opacity=cl((dt-1.6)/.4);
        el.querySelector('.sub').style.opacity=cl((dt-(+o.p.t_sub||3))/.4); }
    }
    el.style.opacity=op; el.style.transform=`translate(${o.x-o.w/2}px,${o.y-o.h/2+ty}px) rotate(${o.rot}deg) scale(${s})`;
    if(o.k==='nota'||o.k==='carimbo'){ el.style.transform=`translate(${o.x}px,${o.y}px) translate(-50%,-50%) rotate(${o.rot}deg) scale(${s})`; }
  }
  for(const f of fios){ const dt=t-f.t; const u=io(cl(dt/0.9)); f.g.setAttribute('opacity',dt>=0?1:0); f.paths.forEach(p=>p.style.strokeDashoffset=1-u); f.p2.setAttribute('opacity',u>=1?1:0); }
  for(const L of LU){ const dt=t-L.t; const p=L.p; let op=0;
    if(dt>=0&&dt<=L.d){ op=Math.min(cl(dt/.35),cl((L.d-dt)/.35)); }
    L.W.style.opacity=op; if(op<=0) continue;
    const u=io(cl((dt-(+p.t0||0))/((+p.t1||2)-(+p.t0||0))));
    const lx=+p.x0+(+p.x1-+p.x0)*u, ly=+p.y0+(+p.y1-+p.y0)*u, M=+p.zoom||2;
    L.W.style.transform=`translate(${lx}px,${ly}px) scale(${1+0.06*Math.sin(dt*2)})`;
    L.inn.style.transform=`translate(${L.R}px,${L.R}px) scale(${M}) translate(${-lx}px,${-ly}px)`;
    L.cl.style.transform=L.T.el.style.transform; L.cl.style.opacity=L.T.el.style.opacity; }
  // legenda
  let cur=null; for(const s of SUBS) if(t>=s.a&&t<s.b) cur=s;
  if(cur!==subCur){ subEl.textContent=cur?cur.t:''; subCur=cur; }
  subEl.style.opacity=cur?Math.min(cl((t-cur.a)/.12),cl((cur.b-t)/.12)):0;
  // luz / grão
  const fr=Math.floor(t*30); grao.style.backgroundPosition=`${(fr*137)%640}px ${(fr*71)%360}px`;
  luz.style.opacity=0.94+0.06*Math.sin(t*7.3)*Math.sin(t*2.1);
  // final
  if(FI){ const dt=t-(+FI.start); const a=cl(dt/.8); fin.style.opacity=a; const b=cl((dt-1.0)/.2); finSt.style.opacity=b*.92; finSt.style.transform=`rotate(-8deg) scale(${2.2-1.2*oq(b)})`; }
}
const drv={t:0};
tl.to(drv,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>render(drv.t)},0);
render(0);
})();
</script>
<script>(function(){const tl=window.__timelines&&window.__timelines.main;if(!tl)return;

})();</script>
