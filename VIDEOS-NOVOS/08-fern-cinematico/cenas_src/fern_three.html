<!--params {"modo":"terreno","cor":"#e8a33d","t1":0.6,"t2":1.0,"seed":3}-->
<div id="{{id}}" style="position:absolute;inset:0;overflow:hidden;background:#05070a">
 <canvas class="gl" width="{{W}}" height="{{H}}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
 <div class="fx" style="position:absolute;inset:0"></div>
 <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)"></div>
 <div class="gr" style="position:absolute;inset:0;mix-blend-mode:overlay"></div>
</div>
<script>
/*FERNLIB*/
(function(tl, P){ const S={{start}}, D={{dur}}, R=document.getElementById("{{id}}"), W={{W}}, H={{H}};
  if(!window.THREE){ return; }
  const T=THREE, rnd=FERN.rng(+P.seed||3);
  const ren=new T.WebGLRenderer({canvas:R.querySelector(".gl"),antialias:true,preserveDrawingBuffer:true});
  ren.setSize(W,H,false); ren.setClearColor(0x0c1520,1);
  const sc=new T.Scene(); sc.fog=new T.FogExp2(0x0c1520, P.modo==="terreno"?0.011:0.022);
  const cam=new T.PerspectiveCamera(P.modo==="terreno"?50:42,W/H,.1,600);
  let upd=function(){};
  if(P.modo==="terreno"){
    const N=140, geo=new T.PlaneGeometry(260,260,N,N); geo.rotateX(-Math.PI/2);
    const hgt=(x,z)=>{ let h=Math.sin(x*.045)*Math.cos(z*.05)*7+Math.sin(x*.11+z*.07)*3+Math.sin(z*.021+1.3)*9; const d=Math.abs(x+8)/24; return h*Math.min(1,d*d)+(d<1?-2:0); };
    const pos=geo.attributes.position; for(let i=0;i<pos.count;i++){ pos.setY(i,hgt(pos.getX(i),pos.getZ(i))); } geo.computeVertexNormals();
    sc.add(new T.Mesh(geo,new T.MeshStandardMaterial({color:0x1a2634,roughness:1,metalness:0,flatShading:true})));
    const wire=new T.LineSegments(new T.WireframeGeometry(geo),new T.LineBasicMaterial({color:0x8fb4d8,transparent:true,opacity:.42}));
    wire.position.y=.03; sc.add(wire);
    const pts=[], cols=[];
    for(let c=0;c<9;c++){ const cx=(rnd()-.5)*200, cz=(rnd()-.5)*200, n=60+rnd()*140, sp=4+rnd()*9;
      for(let i=0;i<n;i++){ const x=cx+(rnd()-.5)*sp*2*(1+rnd()), z=cz+(rnd()-.5)*sp*2*(1+rnd()); pts.push(x,hgt(x,z)+.5,z); const w=rnd(); cols.push(1,.62+w*.3,.3+w*.4); } }
    const pg=new T.BufferGeometry(); pg.setAttribute("position",new T.Float32BufferAttribute(pts,3)); pg.setAttribute("color",new T.Float32BufferAttribute(cols,3));
    sc.add(new T.Points(pg,new T.PointsMaterial({size:.8,vertexColors:true,transparent:true,opacity:.95})));
    const rv=new T.Mesh(new T.PlaneGeometry(10,260),new T.MeshBasicMaterial({color:0x183048,transparent:true,opacity:.7})); rv.rotation.x=-Math.PI/2; rv.position.set(-8,-1.6,0); sc.add(rv);
    sc.add(new T.AmbientLight(0x6a8aaa,1.1)); const dl=new T.DirectionalLight(0xbfd8ff,1.5); dl.position.set(-60,40,-80); sc.add(dl);
    upd=function(t){ const k=t/Math.max(D,1); cam.position.set(30-k*18,26-k*6,70-k*40); cam.lookAt(-6,0,-30-k*20); };
  } else {
    const ledTex=function(c){ const cv=document.createElement("canvas"); cv.width=64; cv.height=160; const x=cv.getContext("2d"); x.fillStyle="#0a0d11"; x.fillRect(0,0,64,160);
      const r=FERN.rng(c); for(let row=0;row<16;row++){ x.fillStyle="#141a21"; x.fillRect(4,row*10+1,56,8); for(let k=0;k<5;k++){ if(r()<.6){ x.fillStyle=c===1?"#ff3030":(r()<.75?"#5fd0ff":"#ffb347"); x.fillRect(8+k*10,row*10+4,3,2);} } }
      return new T.CanvasTexture(cv); };
    const mats=function(c){ const side=new T.MeshStandardMaterial({color:0x2a3542,roughness:.5,metalness:.4}); const front=new T.MeshBasicMaterial({map:ledTex(c)}); return [side,side,side,side,front,side]; };
    const g=new T.BoxGeometry(1.6,4,1.2);
    const grid=new T.GridHelper(120,60,0x2a4a6a,0x15283a); grid.material.transparent=true; grid.material.opacity=.5; sc.add(grid);
    const main=new T.Mesh(g,mats(1)); main.position.set(0,2,0); sc.add(main);
    const copies=[];
    for(let i=-6;i<=6;i++)for(let j=-6;j<=1;j++){ if(i===0&&j===0) continue; const m=new T.Mesh(g,mats(2+((i*7+j*3)&3))); const d=Math.hypot(i*2.6,j*3.2);
      m.position.set(i*2.6,-2.2,j*3.2); m.userData.d=d; sc.add(m); copies.push(m); }
    sc.add(new T.AmbientLight(0x7090b0,1.2)); const sp=new T.SpotLight(0xffffff,2.2,90,.7,.5); sp.position.set(4,18,10); sc.add(sp);
    const red=new T.PointLight(0xff2020,0,14); red.position.set(0,3,2.5); sc.add(red);
    const t1=+P.t1, t2=+P.t2;
    upd=function(t){ const fall=Math.max(0,Math.min(1,(t-t1)/.5)); main.position.y=2-fall*1.2; main.rotation.z=fall*.22; red.intensity=fall*(2+Math.sin(t*30)*.8);
      copies.forEach(function(m){ const k=Math.max(0,Math.min(1,(t-t2-m.userData.d*.045)/.45)); const e=1-Math.pow(1-k,3); m.position.y=-2.2+e*4.2; });
      const k=t/Math.max(D,1); cam.position.set(Math.sin(k*.6)*3,4+k*7,9+k*12); cam.lookAt(0,1.5,-3); };
  }
  FERN.drive(tl,S,D,function(t){ upd(t); ren.render(sc,cam); });
  const gc=FERN.mk(R.querySelector(".gr"),W/2,H/2), fc=FERN.mk(R.querySelector(".fx"),W/2,H/2);
  FERN.drive(tl,S,D,function(t){ FERN.fog(fc,t,13,"rgba(140,175,210,A)",.6); FERN.grain(gc,t,.10); });
  tl.fromTo(R,{opacity:.55},{opacity:1,duration:.2,ease:"none",immediateRender:false},S);
  if(+P.saida) tl.to(R,{opacity:0,duration:.6,ease:"none"},S+D-.6);
})(window.__timelines.main, {{json}});
</script>
