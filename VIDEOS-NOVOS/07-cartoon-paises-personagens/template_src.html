<!doctype html>
<html lang="pt"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1280, height=720" />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Permanent+Marker&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>

.shot svg{position:absolute;left:0;top:0;}
#pre{position:absolute;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:0;}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1280" data-height="720">
<svg width="0" height="0" style="position:absolute"><defs>
<clipPath id="hexc"><polygon points="128,-160 64,-270.9 -64,-270.9 -128,-160 -64,-49.1 64,-49.1"/></clipPath>
<linearGradient id="fotoesc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
</defs></svg>
<div id="stage"></div>
<div id="pre">%%PRE%%</div>
<!--__ITEMS__-->
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
tl.to({v:0},{v:1,duration:__DUR__,ease:"none"},0);
window.__timelines["main"] = tl;
</script>
<script>
(function(){
const EDIT=__EDIT__; const DUR=__DUR__;
const EU=%%EUROPA%%;
const K='#151515', RED='#e5262a', BLUE='#1f4fbf';
const stage=document.getElementById('stage');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* ---------- rosto ---------- */
function eye(cx,cy,r,lx,ly){return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*1.2}" fill="#fff" stroke="${K}" stroke-width="${r*.2}"/><circle cx="${cx+lx*r*.38}" cy="${cy+ly*r*.4}" r="${r*.42}" fill="${K}"/><circle cx="${cx+lx*r*.38+r*.13}" cy="${cy+ly*r*.4-r*.15}" r="${r*.13}" fill="#fff"/>`;}
function face(f,emos){
  const {x,y,sep,r}=f, L=x-sep, R=x+sep, sw=r*.24, my=y+r*2.0, m=r/30, by=y-r*1.5;
  const E=(a=0,b=0)=>eye(L,y,r,a,b)+eye(R,y,r,a,b);
  const P=(d,fill='none',w=sw)=>`<path d="${d}" stroke="${K}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="${fill}"/>`;
  const ln=(a,b,c,d)=>P(`M${a},${b} L${c},${d}`);
  const bRaiva=ln(L-r*.9,by-r*.3,L+r*.7,by+r*.35)+ln(R+r*.9,by-r*.3,R-r*.7,by+r*.35);
  const bMedo=ln(L-r*.8,by+r*.15,L+r*.6,by-r*.4)+ln(R+r*.8,by+r*.15,R-r*.6,by-r*.4);
  const bArc=P(`M${L-r*.6},${by} Q${L},${by-r*.6} ${L+r*.6},${by}`)+P(`M${R-r*.6},${by} Q${R},${by-r*.6} ${R+r*.6},${by}`);
  const suor=`<path d="M${R+r*1.5},${y-r*.6} q${-r*.35},${r*.6} 0,${r*.75} q${r*.35},${-r*.15} 0,${-r*.75}Z" fill="#7fd6ff" stroke="${K}" stroke-width="${sw*.6}"/>`;
  const parts={
    neutro:E()+ln(x-14*m,my,x+14*m,my),
    feliz:E()+bArc+P(`M${x-26*m},${my-6*m} Q${x},${my+32*m} ${x+26*m},${my-6*m} Z`,'#7a1d1d'),
    raiva:E(0,.35)+bRaiva+`<rect x="${x-24*m}" y="${my-8*m}" width="${48*m}" height="${18*m}" rx="${4*m}" fill="#fff" stroke="${K}" stroke-width="${sw*.8}"/>`+ln(x-24*m,my+1*m,x+24*m,my+1*m),
    medo:E(0,-.3)+bMedo+`<ellipse cx="${x}" cy="${my+4*m}" rx="${11*m}" ry="${15*m}" fill="#5a1414" stroke="${K}" stroke-width="${sw*.8}"/>`+suor,
    duvida:E(.6,-.3)+ln(L-r*.7,by+r*.1,L+r*.7,by+r*.1)+P(`M${R-r*.7},${by-r*.1} Q${R},${by-r*.8} ${R+r*.7},${by-r*.2}`)+P(`M${x-18*m},${my} Q${x-9*m},${my-9*m} ${x},${my} Q${x+9*m},${my+9*m} ${x+18*m},${my}`),
    surpresa:E()+P(`M${L-r*.6},${by-r*.3} Q${L},${by-r*.9} ${L+r*.6},${by-r*.3}`)+P(`M${R-r*.6},${by-r*.3} Q${R},${by-r*.9} ${R+r*.6},${by-r*.3}`)+`<circle cx="${x}" cy="${my+4*m}" r="${13*m}" fill="#5a1414" stroke="${K}" stroke-width="${sw*.8}"/>`,
    dorme:P(`M${L-r*.7},${y} Q${L},${y+r*.7} ${L+r*.7},${y}`)+P(`M${R-r*.7},${y} Q${R},${y+r*.7} ${R+r*.7},${y}`)+ln(x-10*m,my,x+10*m,my),
    nojo:E(-.5,.3)+bMedo+P(`M${x-20*m},${my} Q${x-10*m},${my-8*m} ${x},${my} Q${x+10*m},${my+8*m} ${x+20*m},${my}`)+`<path d="M${x-2*m},${my+1*m} q${7*m},${18*m} ${14*m},0Z" fill="#ff6b8a" stroke="${K}" stroke-width="${sw*.6}"/>`+suor,
    grita:E(0,.2)+bRaiva+P(`M${x-24*m},${my-10*m} Q${x},${my+42*m} ${x+24*m},${my-10*m} Z`,'#5a1414'),
    psst:E(.8,0)+ln(L-r*.7,by+r*.1,L+r*.7,by+r*.1)+P(`M${R-r*.7},${by-r*.1} Q${R},${by-r*.8} ${R+r*.7},${by-r*.2}`)+`<circle cx="${x}" cy="${my+2*m}" r="${7*m}" fill="#5a1414" stroke="${K}" stroke-width="${sw*.6}"/>`
  };
  return emos.map((e,i)=>`<g class="emo emo-${e}" opacity="${i?0:1}">${parts[e]}</g>`).join('');
}
/* ---------- bracos ---------- */
function arm(sx,sy,d,kind,A,f){
  const L=A.L; let c,e;
  switch(kind){
    case 'up': c=[sx+d*L*.55,sy-L*.15]; e=[sx+d*L*.5,sy-L*.95]; break;
    case 'point': c=[sx+d*L*.5,sy-L*.05]; e=[sx+d*L*1.05,sy-L*.45]; break;
    case 'pointdown': c=[sx+d*L*.6,sy+L*.1]; e=[sx+d*L*1.0,sy+L*.55]; break;
    case 'hold': c=[sx+d*L*.35,sy+L*.55]; e=[d*L*.3,sy+L*.45]; break;
    case 'hip': c=[sx+d*L*.6,sy+L*.3]; e=[sx+d*L*.12,sy+L*.6]; break;
    case 'nose': c=[sx+d*L*.7,sy+L*.6]; e=[f.x+d*f.r*.3,f.y+f.r*1.9]; break;
    case 'wave': c=[sx+d*L*.6,sy-L*.1]; e=[sx+d*L*.8,sy-L*.8]; break;
    default: c=[sx+d*L*.35,sy+L*.5]; e=[sx+d*L*.3,sy+L*.95];
  }
  let s=`<path d="M${sx},${sy} Q${c[0]},${c[1]} ${e[0]},${e[1]}" stroke="${K}" stroke-width="${A.w}" stroke-linecap="round" fill="none"/>`;
  if(kind==='point') s+=`<path d="M${e[0]},${e[1]} l${d*A.hr*1.6},${-A.hr*.7}" stroke="${K}" stroke-width="${A.w*.8}" stroke-linecap="round"/><path d="M${e[0]},${e[1]} l${d*A.hr*1.5},${-A.hr*.65}" stroke="#fff" stroke-width="${A.w*.35}" stroke-linecap="round"/>`;
  return s+`<circle cx="${e[0]}" cy="${e[1]}" r="${A.hr}" fill="#fff" stroke="${K}" stroke-width="${A.w*.6}"/>`;
}
const POSES={idle:['down','down'],up:['up','up'],point:['down','point'],pointL:['point','down'],hold:['hold','hold'],hip:['hip','hip'],nariz:['down','nose'],acena:['down','wave'],aperta:['down','pointdown'],upR:['down','up'],upL:['up','down']};
/* ---------- personagens (origem = pes) ---------- */
const T={
  fr:{face:{x:0,y:-172,sep:42,r:30},sh:[112,-140],A:{L:95,w:9,hr:16},legs:[-42,42,-52],
      body:()=>`<g clip-path="url(#hexc)"><rect x="-130" y="-280" width="88" height="240" fill="${BLUE}"/><rect x="-43" y="-280" width="86" height="240" fill="#fff"/><rect x="43" y="-280" width="88" height="240" fill="${RED}"/></g><polygon points="128,-160 64,-270.9 -64,-270.9 -128,-160 -64,-49.1 64,-49.1" fill="none" stroke="${K}" stroke-width="8" stroke-linejoin="round"/><path d="M-82,-262 Q-24,-322 74,-278 Q70,-256 -82,-262Z" fill="#1d1d1d" stroke="${K}" stroke-width="5"/><circle cx="-8" cy="-300" r="9" fill="#1d1d1d"/>`},
  sind:{face:{x:0,y:-205,sep:34,r:25},sh:[86,-150],A:{L:90,w:9,hr:15},legs:[-38,38,-45],
      body:()=>`<rect x="-90" y="-290" width="180" height="250" rx="85" fill="#e63b2e" stroke="${K}" stroke-width="7"/><path d="M-80,-258 Q0,-350 80,-258Z" fill="#ffd21f" stroke="${K}" stroke-width="6"/><rect x="-98" y="-266" width="196" height="18" rx="9" fill="#ffd21f" stroke="${K}" stroke-width="6"/>`},
  gov:{face:{x:0,y:-232,sep:36,r:25},sh:[92,-150],A:{L:92,w:9,hr:15},legs:[-38,38,-42],
      body:()=>`<rect x="-95" y="-300" width="190" height="262" rx="34" fill="#2b3a67" stroke="${K}" stroke-width="7"/><path d="M-95,-262 Q-92,-318 0,-312 Q92,-318 95,-262 Q40,-296 -95,-262Z" fill="#222" stroke="${K}" stroke-width="5"/><path d="M-42,-152 L0,-120 L42,-152 L0,-140Z" fill="#fff" stroke="${K}" stroke-width="4"/><path d="M0,-134 L-15,-112 L0,-58 L15,-112Z" fill="${RED}" stroke="${K}" stroke-width="4"/>`},
  sis:{face:{x:0,y:-182,sep:50,r:28},sh:[122,-128],A:{L:92,w:9,hr:15},legs:[-50,50,-40],
      body:()=>`<rect x="-125" y="-272" width="250" height="234" rx="10" fill="#c9c9c9" stroke="${K}" stroke-width="7"/><rect x="-125" y="-272" width="250" height="34" fill="#a9a9a9" stroke="${K}" stroke-width="5"/><text x="0" y="-58" text-anchor="middle" font-family="'Luckiest Guy'" font-size="50" fill="${K}">${esc(T.sis.txt||'SISTEMA')}</text>`},
  clone:{face:{x:0,y:-88,sep:13,r:10},sh:[28,-62],A:{L:36,w:5,hr:7},legs:[-12,12,-24],
      body:(o)=>`<rect class="cb" x="-30" y="-120" width="60" height="98" rx="28" fill="${o.cor||'#e63b2e'}" stroke="${K}" stroke-width="4"/>`+(o.velho?`<circle cx="-27" cy="-108" r="11" fill="#fff" stroke="${K}" stroke-width="3"/><circle cx="27" cy="-108" r="11" fill="#fff" stroke="${K}" stroke-width="3"/>`:'')+(o.gravata?`<path d="M0,-64 L-5,-56 L0,-36 L5,-56Z" fill="${RED}" stroke="${K}" stroke-width="2"/>`:'')}
};
function C(type,o){
  const t=T[type], f={...t.face}; f.my=f.y+f.r*2;
  const emos=o.emos||['neutro'], poses=o.poses||['idle'];
  const lw=t.A.w*0.95;
  const legs=[t.legs[0],t.legs[1]].map((lx,i)=>`<path d="M${lx},${t.legs[2]} L${lx},-6" stroke="${K}" stroke-width="${lw}" stroke-linecap="round"/><ellipse cx="${lx+(i?1:-1)*t.A.hr*.5}" cy="-5" rx="${t.A.hr*1.25}" ry="${t.A.hr*.6}" fill="${K}"/>`).join('');
  const arms=poses.map((p,i)=>{const pp=POSES[p]; return `<g class="pose pose-${p}" opacity="${i?0:1}">${arm(-t.sh[0],t.sh[1],-1,pp[0],t.A,f)}${arm(t.sh[0],t.sh[1],1,pp[1],t.A,f)}</g>`;}).join('');
  return `<g transform="translate(${o.x},${o.y}) scale(${o.s||1})"><g id="${o.id}"><g class="an"><g class="br">${o.back||''}${legs}${t.body(o)}${face(f,emos)}${arms}${o.extra||''}</g></g></g></g>`;
}
function state(id,kind,name,t){ tl.set(`#${id} .${kind}`,{opacity:0},t); tl.set(`#${id} .${kind}-${name}`,{opacity:1},t);
  tl.to(`#${id} .an`,{scaleY:1.06,scaleX:.97,duration:.1,yoyo:true,repeat:1,transformOrigin:'50% 100%'},t); }
function breath(id,S,D,amp=.025,per=.75){ const n=Math.max(1,Math.floor(D/per)); tl.to(`#${id} .br`,{scaleY:1+amp,scaleX:1-amp*.4,duration:per/2,yoyo:true,repeat:n*2-1,ease:'sine.inOut',transformOrigin:'50% 100%'},S); }
function nod(id,t,n=2){ tl.to(`#${id} .an`,{y:10,duration:.14,yoyo:true,repeat:n*2-1,ease:'sine.inOut'},t); }
/* ---------- rotulos / props ---------- */
function lab(id,txt,x,y,o={}){ const fam=o.font==='LG'?"'Luckiest Guy'":"'Permanent Marker'";
  return `<g transform="translate(${x},${y}) rotate(${o.rot||0})"><text id="${id}" opacity="0" text-anchor="${o.anchor||'middle'}" font-family="${fam}" font-size="${o.size||56}" fill="${o.color||RED}" stroke="${o.stroke||'#fff'}" stroke-width="${o.sw??10}" paint-order="stroke" stroke-linejoin="round">${esc(txt)}</text></g>`; }
function show(sel,t,d=.35){ gsap.set(sel,{scale:.55,transformOrigin:'50% 50%'}); tl.to(sel,{opacity:1,scale:1,duration:d,ease:'back.out(2.2)'},t); }
function fade(sel,t,d=.25){ tl.to(sel,{opacity:1,duration:d},t); }
function hide(sel,t,d=.2){ tl.to(sel,{opacity:0,duration:d},t); }
function drawOn(sel,t,d=.4){ gsap.set(sel,{strokeDasharray:1,strokeDashoffset:1}); tl.to(sel,{strokeDashoffset:0,duration:d,ease:'power1.inOut'},t); }
function flame(x,y,s,cls='fl'){ return `<g transform="translate(${x},${y}) scale(${s})"><g class="${cls}"><path d="M-60,0 C-85,-60 -40,-90 -48,-140 C-22,-110 -15,-125 -4,-205 C22,-140 42,-152 36,-100 C56,-122 72,-90 62,-40 C72,-18 60,0 60,0 Z" fill="#ff7a1a" stroke="${K}" stroke-width="6" stroke-linejoin="round"/><path d="M-32,-4 C-44,-40 -18,-60 -20,-92 C-4,-70 2,-80 8,-120 C22,-82 34,-86 30,-56 C40,-40 34,-4 30,-4Z" fill="#ffd21f"/></g></g>`; }
function flicker(sel,S,D){ const n=Math.max(1,Math.floor(D/.36)); tl.to(sel,{scaleY:1.12,scaleX:.94,duration:.18,yoyo:true,repeat:n*2-1,ease:'sine.inOut',transformOrigin:'50% 100%',stagger:{each:.06}},S); }
function check(id,x,y,s=1){ return `<g transform="translate(${x},${y}) scale(${s})"><path id="${id}" pathLength="1" d="M-30,0 L-8,24 L36,-30" stroke="#16a34a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:1"/></g>`; }
function xmark(id,x,y,s=1){ return `<g transform="translate(${x},${y}) scale(${s})" id="${id}"><path class="x1" pathLength="1" d="M-120,-60 L120,60" stroke="${RED}" stroke-width="20" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1"/><path class="x2" pathLength="1" d="M120,-60 L-120,60" stroke="${RED}" stroke-width="20" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:1"/></g>`; }
function arrow(id,d){ return `<path id="${id}" pathLength="1" d="${d}" stroke="${RED}" stroke-width="9" stroke-linecap="round" fill="none" style="stroke-dasharray:1;stroke-dashoffset:1"/>`; }
function rng(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function crowd(pre,n,x0,x1,y0,y1,cor,seed,s0=1,s1=1.6,extra){ const r=rng(seed); const cols=Math.ceil(Math.sqrt(n*(x1-x0)/(y1-y0))); const rows=Math.ceil(n/cols); let a=[];
  for(let i=0;i<n;i++){ const c=i%cols, rw=Math.floor(i/cols); const y=y0+(y1-y0)*(rows>1?rw/(rows-1):.5)+(r()-.5)*14; const x=x0+(x1-x0)*((c+.5+(r()-.5)*.5)/cols); a.push({i,x,y}); }
  a.sort((p,q)=>p.y-q.y);
  return a.map(p=>C('clone',{id:pre+p.i,x:p.x,y:p.y,s:s0+(s1-s0)*((p.y-y0)/Math.max(1,y1-y0)),cor:(typeof cor==='function'?cor(p.i):cor),emos:['neutro','raiva','feliz'],poses:['idle','up'],...(extra?extra(p.i):{})})).join(''); }
/* ---------- fundos ---------- */
function bgCidade(){ let s=`<rect width="1280" height="720" fill="#38d6ff"/>`; const B=[[-20,150,300,360],[260,90,260,420],[500,170,300,340],[790,110,250,400],[1030,160,280,350]];
  B.forEach(([x,y,w,h],k)=>{ s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${k%2?'#a7a7a7':'#bdbdbd'}" stroke="${K}" stroke-width="6"/>`; for(let yy=y+30;yy<y+h-110;yy+=62) for(let xx=x+26;xx<x+w-40;xx+=56) s+=`<rect x="${xx}" y="${yy}" width="30" height="38" rx="5" fill="#38d6ff" stroke="${K}" stroke-width="4"/>`; });
  s+=`<path d="M0,470 Q320,440 640,470 T1280,460 L1280,720 L0,720Z" fill="#2ee07a" stroke="${K}" stroke-width="6"/><path d="M120,560 q60,-14 120,0 M820,600 q70,-16 140,0 M480,660 q50,-12 100,0" stroke="#1fb35e" stroke-width="8" stroke-linecap="round" fill="none"/>`; return s; }
function bgParl(){ let s=`<rect width="1280" height="720" fill="#d9963f"/>`; for(let x=0;x<1280;x+=160) s+=`<rect x="${x+12}" y="30" width="136" height="230" rx="6" fill="#c98432" stroke="#7a4a17" stroke-width="5"/>`;
  s+=`<rect x="560" y="50" width="160" height="104" fill="#fff" stroke="${K}" stroke-width="5"/><rect x="560" y="50" width="53" height="104" fill="${BLUE}"/><rect x="667" y="50" width="53" height="104" fill="${RED}"/><rect x="560" y="50" width="160" height="104" fill="none" stroke="${K}" stroke-width="5"/>`;
  s+=`<path d="M0,330 Q640,250 1280,330 L1280,720 L0,720Z" fill="#b8732f" stroke="${K}" stroke-width="6"/>`;
  for(let k=0;k<3;k++){ const y=360+k*70; s+=`<path d="M-20,${y+40} Q640,${y-50} 1300,${y+40}" stroke="#7a4a17" stroke-width="22" fill="none"/><path d="M-20,${y+40} Q640,${y-50} 1300,${y+40}" stroke="${K}" stroke-width="4" fill="none"/>`; }
  return s; }
function bgPalco(){ return `<rect width="1280" height="720" fill="#2a1414"/><ellipse cx="640" cy="560" rx="560" ry="70" fill="#ffe9a8" opacity=".25"/><rect x="0" y="560" width="1280" height="160" fill="#8b5a2b" stroke="${K}" stroke-width="6"/><path d="M0,600 H1280 M0,650 H1280" stroke="#6d4420" stroke-width="5"/>`; }
function cortinas(id){ const fold=(x,w)=>{ let s=''; for(let k=0;k<5;k++) s+=`<path d="M${x+k*w/5+w/10},0 V720" stroke="#8a0f14" stroke-width="10"/>`; return s; };
  return `<g id="${id}L"><rect x="0" y="0" width="660" height="720" fill="#c4161c" stroke="${K}" stroke-width="6"/>${fold(0,660)}</g><g id="${id}R"><rect x="620" y="0" width="660" height="720" fill="#c4161c" stroke="${K}" stroke-width="6"/>${fold(620,660)}</g><path d="M0,0 H1280 V70 Q1120,110 960,70 Q800,110 640,70 Q480,110 320,70 Q160,110 0,70Z" fill="#a50f14" stroke="${K}" stroke-width="6"/>`; }
function bgMapa(){ return `<rect width="1280" height="720" fill="#38d6ff"/><path class="oth" d="${EU.oth}" fill="#2ee07a" stroke="${K}" stroke-width="2.5" stroke-linejoin="round"/><path class="fra" d="${EU.fra}" fill="#10275e" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>`; }
function bgLiso(c,chao){ return `<rect width="1280" height="720" fill="${c}"/>`+(chao?`<rect x="0" y="560" width="1280" height="160" fill="${chao}" stroke="${K}" stroke-width="6"/>`:''); }
function bgFoto(src,id){ return `<g id="${id}"><image href="m/${src}" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/></g><rect width="1280" height="720" fill="url(#fotoesc)"/>`; }
/* ---------- tomadas ---------- */
function mk(it,bg,content){ const S=it.start,D=it.dur; const d=document.createElement('div'); d.className='shot'; d.id='sh_'+it.id;
  d.innerHTML=`<svg viewBox="0 0 1280 720" width="1280" height="720"><g class="cam">${bg}<g class="zm">${content}</g></g></svg>`; stage.appendChild(d);
  tl.set(d,{opacity:1},S); tl.set(d,{opacity:0},S+D);
  const cam=d.querySelector('.cam'); gsap.set(cam,{svgOrigin:'640 360'}); tl.to(cam,{scale:1.05,duration:D,ease:'none'},S); return d; }
function kb(sel,S,D,a=1.12,x=0){ gsap.set(sel,{svgOrigin:'640 360'}); tl.to(sel,{scale:a,x:x,duration:D,ease:'none'},S); }
const SH={};

  mk(it,bgCidade(),C('gov',{id:i+'gv',x:230,y:690,s:.9,emos:['neutro','duvida']})+C('sind',{id:i+'sd',x:640,y:690,s:.9,emos:['neutro','duvida']})+cl+labs);
  breath(i+'gv',S,D); breath(i+'sd',S,D);
  const t0=S+(+L[0][2]),t1=S+(+L[1][2]),t2=S+(+L[2][2]);
  state(i+'gv','emo','duvida',t0); nod(i+'gv',t0); show(`#${i}l0`,t0); drawOn(`#${i}ck0`,t0+.1,.3);
  state(i+'sd','emo','duvida',t1); nod(i+'sd',t1); show(`#${i}l1`,t1); drawOn(`#${i}ck1`,t1+.1,.3);
  [...Array(6).keys()].forEach(k=>{state(`${i}c${k}`,'emo','feliz',t2+k*.03); nod(`${i}c${k}`,t2);}); show(`#${i}l2`,t2); drawOn(`#${i}ck2`,t2+.1,.3); };
SH.teatro=(it,P,S,D,i)=>{ const t=S+(+P.t_lei||3.4);
  const papel=`<g id="${i}pp" transform="translate(-200,250)"><g class="rot"><rect x="-90" y="-110" width="180" height="220" rx="6" fill="#fff" stroke="${K}" stroke-width="6"/><text y="-40" text-anchor="middle" font-family="'Luckiest Guy'" font-size="52" fill="${K}">${esc(P.lei)}</text><text y="50" text-anchor="middle" font-family="'Luckiest Guy'" font-size="34" fill="#16a34a" transform="rotate(-12)">${esc(P.carimbo)}</text></g></g>`;
  mk(it,bgPalco(),C('gov',{id:i+'gv',x:400,y:660,s:.95,emos:['raiva'],poses:['point']})+C('sind',{id:i+'sd',x:880,y:660,s:.95,emos:['grita'],poses:['up']})+cortinas(i+'ct')+lab(i+'l1',P.rotulo,640,170,{font:'LG',size:78,color:'#ffd21f',stroke:K,sw:12})+lab(i+'l2',P.sub,640,250,{size:52,color:'#fff',stroke:K,sw:10})+papel);
  tl.to(`#${i}ctL`,{x:-560,duration:.7,ease:'power2.inOut'},S+.05); tl.to(`#${i}ctR`,{x:560,duration:.7,ease:'power2.inOut'},S+.05);
  tl.to([`#${i}gv .an`,`#${i}sd .an`],{rotation:7,duration:.35,yoyo:true,repeat:Math.floor(D/.7)*2-1,ease:'sine.inOut',transformOrigin:'50% 100%'},S);
  show(`#${i}l1`,S+(+P.t_rot||.8)); show(`#${i}l2`,S+(+P.t_sub||2.1)); hide(`#${i}l2`,t-.05,.15);
  tl.to(`#${i}pp`,{x:1700,duration:1.1,ease:'none'},t); tl.to(`#${i}pp .rot`,{rotation:360,duration:1.1,ease:'none',transformOrigin:'50% 50%'},t); };
SH.casa=(it,P,S,D,i)=>{ let hs=''; [[960,470,1],[1110,500,1.1],[1230,460,.9]].forEach(([x,y,s])=>hs+=`<g transform="translate(${x},${y}) scale(${s})"><rect x="-70" y="-60" width="140" height="120" fill="#f4c95d" stroke="${K}" stroke-width="6"/><path d="M-90,-56 L0,-130 L90,-56Z" fill="${RED}" stroke="${K}" stroke-width="6" stroke-linejoin="round"/><rect x="-20" y="0" width="40" height="60" fill="#7a4a17" stroke="${K}" stroke-width="5"/></g>`);
  let cl=''; for(let k=0;k<7;k++) cl+=C('clone',{id:i+'c'+k,x:80+k*85,y:620+(k%2)*50,s:1.5,emos:['feliz']});
  mk(it,bgCidade(),hs+`<g id="${i}g">${cl}</g>`+lab(i+'l1',P.rotulo,560,120,{size:62,color:K}));
  tl.to(`#${i}g`,{x:340,duration:D,ease:'none'},S); for(let k=0;k<7;k++) tl.to(`#${i}c${k} .an`,{y:-12,duration:.18,yoyo:true,repeat:Math.floor(D/.36)*2-1},S+k*.05);
  show(`#${i}l1`,S+.1); };
SH.ciclo=(it,P,S,D,i)=>{ const cx=640,cy=420,R=200; const N=[P.n1,P.n2,P.n3,P.n4]; let nd='';
  N.forEach((txt,k)=>{ const a=-Math.PI/2+k*Math.PI/2, x=cx+R*1.3*Math.cos(a)*1.25, y=cy+R*Math.sin(a)*1.0; nd+=`<g id="${i}n${k}" opacity="0"><rect x="${x-130}" y="${y-38}" width="260" height="76" rx="38" fill="#fff" stroke="${K}" stroke-width="6"/><text x="${x}" y="${y+16}" text-anchor="middle" font-family="'Luckiest Guy'" font-size="46" fill="${k===1?RED:K}">${esc(txt)}</text></g>`; });
  const anel=`<ellipse id="${i}an" pathLength="1" cx="${cx}" cy="${cy}" rx="${R*1.6}" ry="${R}" stroke="${RED}" stroke-width="12" fill="none" stroke-dasharray="0.06 0.03" opacity="0"/>`;
  mk(it,bgLiso('#38d6ff'),anel+nd+C('fr',{id:i+'fr',x:cx,y:cy+110,s:.6,emos:['duvida']})+lab(i+'l1',P.rotulo,640,85,{font:'LG',size:64}));
  tl.to(`#${i}an`,{opacity:1,duration:.2},S); tl.to(`#${i}an`,{strokeDashoffset:-1,duration:D,ease:'none'},S);
  N.forEach((_,k)=>show(`#${i}n${k}`,S+.1+k*.22)); show(`#${i}l1`,S+.25); tl.to(`#${i}fr .an`,{rotation:-10,duration:.4,yoyo:true,repeat:Math.floor(D/.8)*2-1,transformOrigin:'50% 100%'},S); };
SH.diva=(it,P,S,D,i)=>{
  const sofa=`<g transform="translate(470,600)"><path d="M-300,-40 Q-330,-160 -250,-170 L-210,-60 L260,-60 L260,40 L-300,40Z" fill="#8b3a2b" stroke="${K}" stroke-width="7" stroke-linejoin="round"/><rect x="-300" y="-60" width="560" height="70" rx="20" fill="#a64b37" stroke="${K}" stroke-width="7"/><path d="M-270,40 v40 M230,40 v40" stroke="${K}" stroke-width="14"/></g>`;
  const mist=`<g transform="translate(1110,690) scale(.62)"><g id="${i}mi"><path d="M-110,-40 Q-140,-200 -40,-260 Q60,-300 120,-210 Q150,-120 100,-40Z" fill="#7d7d7d" stroke="${K}" stroke-width="8"/><text x="0" y="-110" text-anchor="middle" font-family="'Luckiest Guy'" font-size="120" fill="#fff" stroke="${K}" stroke-width="6" paint-order="stroke">?</text></g></g>`;
  const bt=`<g id="${i}bt" opacity="0" transform="translate(640,215)"><rect x="-230" y="-48" width="460" height="96" rx="48" fill="${RED}" stroke="${K}" stroke-width="7"/><text y="20" text-anchor="middle" font-family="'Luckiest Guy'" font-size="56" fill="#fff">${esc(P.botao)}</text></g>`;
  mk(it,bgLiso('#ffd84d','#b8732f'),sofa+`<g transform="rotate(-86 430 548)">${C('fr',{id:i+'fr',x:430,y:548,s:.72,emos:['duvida','feliz'],poses:['idle','acena']})}</g>`+mist+bt+lab(i+'l1',P.rotulo,640,90,{font:'LG',size:66})+lab(i+'l2',P.prox,1100,380,{size:46,color:K,rot:-4}));
  breath(i+'fr',S,D,.03,1.1); show(`#${i}l1`,S+(+P.t_rot||1.8)); const t=S+(+P.t_insc||3.5);
  show(`#${i}bt`,t,.45); tl.to(`#${i}bt`,{scale:1.08,duration:.4,yoyo:true,repeat:5,ease:'sine.inOut'},t+.5); state(i+'fr','emo','feliz',t); state(i+'fr','pose','acena',t);
  show(`#${i}l2`,S+(+P.t_prox||4.8)); tl.to(`#${i}mi`,{y:-14,duration:.3,yoyo:true,repeat:5},S+(+P.t_prox||4.8)); };
/* ---------- montar ---------- */
for(const it of EDIT.items){ if(it.hidden||it.type!=='scene'||it.by!=='template') continue; const p=it.props||{}; const f=SH[p.scene]; if(f) f(it,p.params||{},+it.start,+it.dur,it.id+'_'); }
})();
