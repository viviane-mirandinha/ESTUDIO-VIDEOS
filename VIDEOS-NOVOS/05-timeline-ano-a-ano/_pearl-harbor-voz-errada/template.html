<!doctype html>
<html lang="pt"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1280, height=720" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:#0d1a24;}
#root{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:#102e4e;font-family:'Oswald',sans-serif;}
.map{position:absolute;left:0;top:0;transform-origin:0 0;display:none;}
#sv{position:absolute;left:0;top:0;width:1280px;height:720px;}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%);pointer-events:none;}
#dim{position:absolute;inset:0;background:#000;opacity:0;}
#tit{position:absolute;left:0;width:1280px;top:34px;text-align:center;font-family:'Oswald';font-weight:700;font-size:60px;line-height:1.1;color:#fff;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.6);}
#tit .hl{color:#111;padding:0 12px;text-shadow:none;box-shadow:0 3px 0 rgba(0,0,0,.4);}
#pill{position:absolute;left:36px;top:132px;background:rgba(12,12,12,.88);border:2px solid #3a3a3a;border-radius:8px;padding:6px 18px 8px;min-width:150px;}
#pill .h{font-family:'Anton';font-size:52px;line-height:1.05;letter-spacing:1px;}
#pill .s{font-family:'Oswald';font-size:24px;color:#c4c4c4;text-transform:uppercase;line-height:1.1;margin-top:2px;}
#leg{position:absolute;right:26px;bottom:18px;font-family:'Oswald';font-size:24px;color:rgba(255,255,255,.62);text-transform:uppercase;text-shadow:0 1px 3px #000;}
#num{position:absolute;right:40px;top:132px;background:rgba(12,12,12,.9);border:3px solid #e8c547;border-radius:8px;padding:6px 22px 10px;text-align:center;}
#num .v{font-family:'Anton';font-size:64px;color:#ffd23f;line-height:1.05;}
#num .r{font-family:'Oswald';font-size:24px;color:#fff;text-transform:uppercase;}
#cx{position:absolute;left:640px;bottom:64px;transform:translateX(-50%);background:rgba(10,10,10,.92);border:2px solid #555;border-radius:6px;padding:10px 26px 12px;text-align:center;white-space:nowrap;}
#cx .t{font-family:'Oswald';font-weight:700;font-size:34px;color:#fff;text-transform:uppercase;}
#cx .r{font-family:'Oswald';font-size:24px;color:#bdbdbd;text-transform:uppercase;}
#cards{position:absolute;left:0;top:0;width:1280px;height:720px;}
.ic{position:absolute;top:250px;width:300px;height:250px;background:rgba(8,8,8,.92);border:3px solid #9a9a9a;border-radius:10px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.6);}
.ic svg{margin-top:18px;}
.ic .v{font-family:'Anton';font-size:64px;color:#ffd23f;line-height:1.05;}
.ic .r{font-family:'Oswald';font-size:26px;color:#fff;text-transform:uppercase;}
#card{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at center,#f4f5f6 0%,#dcdee1 100%);}
#card .topo{position:absolute;top:96px;left:640px;transform:translateX(-50%);background:#1f4fa8;color:#fff;font-family:'Oswald';font-weight:700;font-size:42px;padding:2px 18px;text-transform:uppercase;white-space:nowrap;}
#card .pal{position:absolute;top:150px;width:1280px;text-align:center;font-family:'Anton';font-size:200px;color:#2756c5;line-height:1.15;letter-spacing:2px;}
#card svg{position:absolute;left:0;top:0;}
#card .sub{position:absolute;top:430px;width:1280px;text-align:center;font-family:'Oswald';font-weight:700;font-size:34px;color:#2a2a2a;text-transform:uppercase;}
#card .pils{position:absolute;top:500px;left:640px;transform:translateX(-50%);display:flex;gap:18px;white-space:nowrap;}
#card .pl{background:#1d5a70;color:#fff;font-family:'Oswald';font-size:30px;padding:8px 26px;border-radius:6px;text-transform:uppercase;}
#card .tag{position:absolute;top:590px;left:640px;transform:translateX(-50%);border:3px solid #d42a2a;color:#d42a2a;background:rgba(255,255,255,.6);font-family:'Oswald';font-weight:700;font-size:34px;padding:2px 18px;border-radius:6px;text-transform:uppercase;white-space:nowrap;}
#cta{position:absolute;left:640px;top:330px;transform:translateX(-50%);display:flex;gap:30px;}
.bt{background:rgba(10,10,10,.92);border:3px solid #ddd;border-radius:12px;padding:14px 28px;display:flex;align-items:center;gap:14px;font-family:'Oswald';font-weight:700;font-size:40px;color:#fff;text-transform:uppercase;}
.bt.red{background:#d32424;border-color:#fff;}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1280" data-height="720">
<img id="m_ilha" class="map" src="img/ilha.jpg" width="5098" height="4392">
<img id="m_porto" class="map" src="img/porto.jpg" width="2620" height="3347">
<div id="dim"></div>
<svg id="sv" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="smk" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8322a"/></marker>
 </defs>
 <g id="g_obj"></g>
</svg>
<div id="vig"></div>
<div id="cards"></div>
<div id="cta" style="display:none"></div>
<div id="tit"></div>
<div id="pill"><div class="h"></div><div class="s"></div></div>
<div id="num"><div class="v"></div><div class="r"></div></div>
<div id="cx"><div class="t"></div><div class="r"></div></div>
<div id="leg">Esquemático · posições aproximadas</div>
<div id="card"><div class="topo"></div><div class="pal"></div><svg width="1280" height="720"><path id="sq" fill="none" stroke="#d42a2a" stroke-width="8" stroke-linecap="round"/></svg><div class="sub"></div><div class="pils"></div><div class="tag"></div></div>
<!--__ITEMS__-->
</div>
<script>
const EDIT=__EDIT__;
const META={"ilha":{"z":12,"x0":61603,"y0":456999,"scale":1.0},"porto":{"z":14,"x0":256260,"y0":1841878,"scale":2.5}};
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,eo=p=>1-Math.pow(1-p,3);
const P=k=>((EDIT.items.find(i=>i.id===k)||{}).props||{}).value;
function geo(m,lat,lon){const M=META[m],n=256*Math.pow(2,M.z),r=lat*Math.PI/180;
 return[((lon+180)/360*n-M.x0)*M.scale,((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n-M.y0)*M.scale];}
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;}
// ---------- icones SVG (desenhados apontando para +x)
function icon(tipo,g,cor){
 if(tipo==='navio'){el('path',{d:'M-34,0 L-30,-7 L22,-7 L34,0 L22,7 L-30,7 Z',fill:cor||'#9aa1a8',stroke:'#111',"stroke-width":2.2},g);
  el('rect',{x:-8,y:-4,width:14,height:8,fill:'#5d646b',stroke:'#111',"stroke-width":1.2},g);
  for(const x of[-22,-14,14,22])el('circle',{cx:x,cy:0,r:3,fill:'#4a5056',stroke:'#111',"stroke-width":1},g);}
 else if(tipo==='destroier'){el('path',{d:'M-22,0 L-19,-4.5 L14,-4.5 L23,0 L14,4.5 L-19,4.5 Z',fill:'#cfd5da',stroke:'#111',"stroke-width":2},g);el('rect',{x:-4,y:-2.5,width:8,height:5,fill:'#555'},g);}
 else if(tipo==='sub'){el('ellipse',{cx:0,cy:0,rx:13,ry:3.6,fill:'#2b2b2b',stroke:'#fff',"stroke-width":1.6},g);el('rect',{x:-2,y:-2,width:5,height:4,fill:'#fff'},g);}
 else if(tipo==='aviao'){el('path',{d:'M12,0 L4,-2 L1,-12 L-3,-12 L-2,-2 L-9,-2 L-11,-6 L-13,-6 L-12,0 L-13,6 L-11,6 L-9,2 L-2,2 L-3,12 L1,12 L4,2 Z',fill:'#f1f1f1',stroke:'#111',"stroke-width":1.4},g);el('circle',{cx:-0.5,cy:-7.5,r:2.2,fill:'#d31f1f'},g);el('circle',{cx:-0.5,cy:7.5,r:2.2,fill:'#d31f1f'},g);}
 else if(tipo==='blip'){el('circle',{cx:0,cy:0,r:5,fill:'#ff9a2a',filter:'url(#glow)'},g);}
 else if(tipo==='radar'){el('circle',{cx:0,cy:0,r:9,fill:'#111',stroke:'#fff',"stroke-width":2.5},g);el('path',{d:'M-5,3 A7,7 0 0 1 4,-5',fill:'none',stroke:'#7CFC7C',"stroke-width":2.5},g);}
 else if(tipo==='base'){el('rect',{x:-11,y:-11,width:22,height:22,rx:3,fill:'#111',stroke:'#fff',"stroke-width":2.5},g);el('path',{d:'M-7,0 L7,0 M0,-7 L0,7',stroke:'#fff',"stroke-width":2.5},g);}
}
// ---------- cenas
const SC=EDIT.items.filter(i=>i.type==='scene'&&i.props&&i.props.params).map(i=>({it:i,p:i.props.params,kind:i.props.scene,s:i.start,e:i.start+i.dur}));
const OBJ=[];  // objetos do mapa por cena
for(const S of SC){ if(S.kind!=='mapa-timeline')continue; const p=S.p, g=el('g',{style:'display:none'},$('g_obj')); S.g=g; S.objs=[];
 for(const f of (p.fumaca||[])){const gg=el('g',{},g);const cs=[];for(let k=0;k<5;k++)cs.push(el('circle',{r:16+k*5,fill:'#3b3b3b',opacity:.5,filter:'url(#smk)'},gg));S.objs.push({kind:'fumaca',d:f,gg,cs});}
 for(const a of (p.setas||[])){const path=el('path',{fill:'none',stroke:'#e8322a',"stroke-width":7,"stroke-linecap":'round',"marker-end":'url(#ah)',opacity:.95},g);S.objs.push({kind:'seta',d:a,path});}
 for(const c of (p.icones||[])){const gg=el('g',{},g);const inner=el('g',{},gg);icon(c.tipo,inner,c.cor);
   let lab=null;if(c.rotulo){lab=el('text',{"font-family":'Oswald',"font-weight":700,"font-size":24,fill:'#fff',stroke:'#000',"stroke-width":4,"paint-order":'stroke',"text-anchor":'middle'},gg);lab.textContent=c.rotulo;}
   let fx=null;if(c.fogo!=null){fx=el('g',{},gg);for(let k=0;k<3;k++)el('circle',{r:10-k*3,fill:['#ff5a1f','#ff9a2a','#ffe36a'][k],filter:'url(#glow)'},fx);}
   let rings=[];if(c.tipo==='radar'){for(let k=0;k<3;k++)rings.push(el('circle',{r:10,fill:'none',stroke:'#7CFC7C',"stroke-width":3},gg));gg.insertBefore(rings[0],inner);}
   S.objs.push({kind:'icone',d:c,gg,inner,lab,fx,rings});}
 for(const x of (p.explosoes||[])){const gg=el('g',{},g);const parts=[];for(let k=0;k<3;k++)parts.push(el('circle',{r:1,fill:['#ff4a1a','#ff9a2a','#fff3a0'][k],filter:'url(#glow)'},gg));S.objs.push({kind:'expl',d:x,gg,parts});}
 for(const w of (p.enxame||[])){const items=[];for(let k=0;k<w.n;k++){const gg=el('g',{},g);const tr=el('line',{stroke:'#ff9a2a',"stroke-width":2,opacity:.55,"stroke-dasharray":'5 5'},g);g.appendChild(gg);icon(w.tipo||'aviao',gg);items.push({gg,tr,j1:Math.sin(k*12.9898)*43758.5453%1,j2:Math.sin(k*78.233)*12345.678%1});}S.objs.push({kind:'enxame',d:w,items});}
 for(const l of (p.lugares||[])){const gg=el('g',{},g);el('circle',{r:5,fill:'#fff',stroke:'#000',"stroke-width":2},gg);const t=el('text',{x:10,y:8,"font-family":'Oswald',"font-weight":700,"font-size":26,fill:'#fff',stroke:'#000',"stroke-width":4.5,"paint-order":'stroke'},gg);t.textContent=l[0];S.objs.push({kind:'lugar',d:l,gg});}
}
let curScene=null,lastTit='',lastPill='',lastCard='';
function camAt(S,t){const p=S.p,u=ease(clamp((t-S.s)/(S.e-S.s)));const f1=p.foco,f2=p.foco2||p.foco;
 const lat=f1[0]+(f2[0]-f1[0])*u,lon=f1[1]+(f2[1]-f1[1])*u;const k=p.zoom*(1+((p.push||1.06)-1)*u);const c=geo(p.mapa,lat,lon);
 return {k,tx:640-c[0]*k,ty:(p.cy||400)-c[1]*k};}
function scr(cam,m,ll){const c=geo(m,ll[0],ll[1]);return[cam.tx+c[0]*cam.k,cam.ty+c[1]*cam.k];}
function setTit(arr,t){let cur=null;for(const x of arr||[])if(t>=x[0])cur=x;const T=$('tit');
 if(!cur){T.innerHTML='';lastTit='';return;}const key=cur.join('|');
 if(key!==lastTit){lastTit=key;let h=cur[1];if(cur[2])h=h.replace(cur[2],`<span class="hl" style="background:${cur[3]||'#ffd23f'}">${cur[2]}</span>`);T.innerHTML=h;}
 const a=clamp((t-cur[0])/0.3);T.style.opacity=a;T.style.transform=`translateY(${(1-eo(a))*-14}px)`;}
function fmt(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function renderAt(t){
 const S=SC.find(s=>!s.it.hidden&&t>=s.s&&t<s.e)||SC[SC.length-1];
 for(const s of SC)if(s.g)s.g.style.display=(s===S&&S.kind==='mapa-timeline')?'':'none';
 const p=S.p;
 // ---- card claro
 const C=$('card');
 if(S.kind==='card-palavra'){C.style.display='block';$('m_ilha').style.display='none';$('m_porto').style.display='none';
  ['tit','pill','num','cx','leg','cta'].forEach(i=>$(i).style.display='none');$('cards').innerHTML='';
  if(lastCard!==S.it.id){lastCard=S.it.id;C.querySelector('.pal').textContent=p.palavra;C.querySelector('.topo').textContent=p.topo||'';C.querySelector('.sub').textContent=p.sub||'';
   C.querySelector('.tag').textContent=p.tag||'';C.querySelector('.pils').innerHTML=(p.pilulas||[]).map(x=>`<div class="pl">${x[1]}</div>`).join('');}
  const lt=t-S.s;const pal=C.querySelector('.pal');const a=clamp(lt/0.35);pal.style.opacity=a;pal.style.transform=`scale(${0.92+0.08*eo(a)})`;
  const tp=C.querySelector('.topo');tp.style.opacity=(p.topo&&t>=(p.topo_t||S.s))?clamp((t-(p.topo_t||S.s))/0.25):0;
  const sb=C.querySelector('.sub');sb.style.opacity=(p.sub&&t>=(p.sub_t||S.s))?clamp((t-(p.sub_t||S.s))/0.3):0;
  const tg=C.querySelector('.tag');tg.style.display=p.tag?'':'none';tg.style.opacity=(t>=(p.tag_t||S.s))?clamp((t-(p.tag_t||S.s))/0.25):0;
  [...C.querySelectorAll('.pl')].forEach((d,i)=>{const pt=(p.pilulas[i]||[])[0]||S.s;const b=clamp((t-pt)/0.3);d.style.opacity=b;d.style.transform=`translateY(${(1-eo(b))*16}px)`;});
  // rabisco vermelho sob a palavra
  const w=Math.min(1100,p.palavra.length*92),x0=640-w/2,y=402;let d=`M${x0},${y}`;for(let i=1;i<=24;i++){const x=x0+w*i/24;d+=` Q${x-w/48},${y+(i%2?10:-8)} ${x},${y+(i%3-1)*3}`;}
  const sq=$('sq');sq.setAttribute('d',d);const L=w*1.25;sq.setAttribute('stroke-dasharray',L);sq.setAttribute('stroke-dashoffset',L*(1-eo(clamp((lt-0.35)/0.6))));
  return;}
 C.style.display='none';lastCard='';$('leg').style.display='';
 // ---- mapa
 const cam=camAt(S,t);for(const m of['ilha','porto']){const im=$('m_'+m);im.style.display=m===p.mapa?'block':'none';if(m===p.mapa)im.style.transform=`translate(${cam.tx}px,${cam.ty}px) scale(${cam.k})`;}
 $('dim').style.opacity=(p.escurecer&&t>=(p.escurecer_t||S.s))?p.escurecer*clamp((t-(p.escurecer_t||S.s))/0.4):0;
 for(const o of S.objs||[]){const d=o.d;
  if(o.kind==='lugar'){const c=scr(cam,p.mapa,[d[1],d[2]]);o.gg.setAttribute('transform',`translate(${c[0]},${c[1]})`);o.gg.style.opacity=t>=(d[3]||S.s)?clamp((t-(d[3]||S.s))/0.3):0;}
  else if(o.kind==='icone'){const c=scr(cam,p.mapa,[d.lat,d.lon]);const t0=d.t||S.s;const a=clamp((t-t0)/0.3);let sc=d.tam||1;
   o.gg.setAttribute('transform',`translate(${c[0]},${c[1]})`);o.gg.style.opacity=(t>=t0&&!(d.ate&&t>d.ate))?a:0;
   let ry=1;if(d.vira!=null){const v=ease(clamp((t-d.vira)/1.4));ry=Math.cos(v*Math.PI);if(v>0.5){o.inner.querySelector('path').setAttribute('fill','#8a2c22');}else o.inner.querySelector('path').setAttribute('fill',d.cor||'#9aa1a8');}
   o.inner.setAttribute('transform',`rotate(${d.ang||0}) scale(${sc},${sc*ry})`);
   if(o.lab){o.lab.setAttribute('x',d.lx||0);o.lab.setAttribute('y',d.ly||-22);o.lab.style.opacity=t>=(d.rot_t||t0)?clamp((t-(d.rot_t||t0))/0.3):0;}
   if(o.fx){const on=t>=d.fogo;o.fx.style.display=on?'':'none';if(on){const fl=1+0.18*Math.sin(t*23)+0.1*Math.sin(t*37);const g0=clamp((t-d.fogo)/0.5);o.fx.setAttribute('transform',`scale(${(0.4+1.2*g0)*fl*(d.fogo_tam||1.6)})`);}}
   for(let k=0;k<o.rings.length;k++){const ph=((t-t0)*0.7+k/3)%1;o.rings[k].setAttribute('r',10+ph*70);o.rings[k].setAttribute('opacity',(1-ph)*0.8);}}
  else if(o.kind==='seta'){const a=scr(cam,p.mapa,d.de),b=scr(cam,p.mapa,d.para);const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1];const cv=d.curva==null?0.18:d.curva;
   const cx=mx-dy*cv,cy=my+dx*cv;o.path.setAttribute('d',`M${a[0]},${a[1]} Q${cx},${cy} ${b[0]},${b[1]}`);const L=Math.hypot(dx,dy)*1.08+1;const pr=eo(clamp((t-d.t)/(d.dur||0.8)));
   o.path.setAttribute('stroke-dasharray',`${L*pr} ${L*2}`);o.path.style.opacity=t>=d.t?1:0;o.path.setAttribute('marker-end',pr>0.97?'url(#ah)':'');}
  else if(o.kind==='expl'){const c=scr(cam,p.mapa,[d.lat,d.lon]);const lt=t-d.t;o.gg.setAttribute('transform',`translate(${c[0]},${c[1]})`);
   if(lt<0){o.gg.style.opacity=0;continue;}o.gg.style.opacity=lt<1.4?1:clamp(1-(lt-1.4)/0.6)*0.0+ (d.fica?0.85:clamp(1-(lt-1.4)/0.6));
   const R=(d.r||26)*(lt<0.5?eo(lt/0.5):1)*(1+0.12*Math.sin(t*19));o.parts.forEach((c2,k)=>c2.setAttribute('r',R*(1-k*0.3)));}
  else if(o.kind==='fumaca'){const c=scr(cam,p.mapa,[d.lat,d.lon]);const t0=d.t||S.s;o.gg.style.opacity=t>=t0?clamp((t-t0)/1)*0.9:0;
   o.cs.forEach((ci,k)=>{const ph=((t*0.12)+k/5)%1;ci.setAttribute('cx',c[0]+ph*-60+k*4);ci.setAttribute('cy',c[1]-ph*90);ci.setAttribute('opacity',0.55*(1-ph));ci.setAttribute('r',(d.r||14)+ph*30);});}
  else if(o.kind==='enxame'){const A=scr(cam,p.mapa,d.de),B=scr(cam,p.mapa,d.para);const dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,ang=Math.atan2(dy,dx)*180/Math.PI;
   o.items.forEach((it,k)=>{const st=d.t+k*(d.stagger||0.08);const pr=clamp((t-st)/(d.dur||3));const sp=(d.espalha||70);const off=(Math.abs(it.j1)-0.5)*2*sp,along=(Math.abs(it.j2)-0.5)*sp*0.8;
    const ep=d.lento?pr:ease(pr);const x=A[0]+dx*ep+nx*off+dx/len*along,y=A[1]+dy*ep+ny*off+dy/len*along;const vis=t>=st&&!(d.some&&pr>=1);
    it.gg.style.opacity=vis?clamp((t-st)/0.3):0;it.gg.setAttribute('transform',`translate(${x},${y}) rotate(${ang}) scale(${d.tam||1})`);
    it.tr.style.opacity=vis&&d.rastro!==false?0.5:0;it.tr.setAttribute('x1',A[0]+nx*off+dx/len*along);it.tr.setAttribute('y1',A[1]+ny*off+dy/len*along);it.tr.setAttribute('x2',x);it.tr.setAttribute('y2',y);});}
 }
 // ---- títulos / pílula / número / caixa
 $('tit').style.display='';setTit(p.titulos,t);
