<style>
html,body{margin:0;padding:0;width:__W__px;height:__H__px;overflow:hidden;background:#0b0c10;}
#root{position:relative;width:__W__px;height:__H__px;overflow:hidden;background:#0b0c10;font-family:Inter,Arial,sans-serif;color:#fff;}
#three-layer{position:absolute;left:0;top:0;width:__W__px;height:__H__px;display:block;}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);}
#ov{position:absolute;inset:0;pointer-events:none}
#bc{position:absolute;left:60px;top:236px;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:32px;letter-spacing:.14em;color:#8f9099;white-space:nowrap;text-transform:uppercase}
#chip{position:absolute;left:60px;top:290px;display:flex;align-items:center;gap:14px;padding:10px 22px 10px 16px;border-radius:40px;
 background:rgba(20,20,24,.82);border:2px solid rgba(255,255,255,.14);font-family:"JetBrains Mono",Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:.1em;color:#fff;white-space:nowrap;text-transform:uppercase}
#chip i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.7)}
#cap{position:absolute;left:50%;top:1400px;transform:translate(-50%,-50%);max-width:940px;padding:20px 34px 22px;border-radius:26px;
 background:rgba(30,30,35,.92);border:2px solid rgba(255,255,255,.07);box-shadow:0 10px 30px rgba(0,0,0,.45);
 font-size:58px;font-weight:700;line-height:1.18;text-align:center;letter-spacing:-.01em;opacity:0}
#cap span{color:#6f7079}
#cap span.on{color:#fff}
.stk{position:absolute;transform-origin:50% 50%;padding:14px 30px 16px;border:5px solid #121214;border-radius:14px;
 font-size:72px;font-weight:900;letter-spacing:-.01em;white-space:nowrap;opacity:0;box-shadow:6px 8px 0 rgba(0,0,0,.55);text-transform:uppercase}
.stk.amarelo{background:#F2B630;color:#141414}
.stk.vermelho{background:#E5484D;color:#fff}
.stk.verde{background:#3BE07A;color:#0f1a12}

.rot{position:absolute;white-space:nowrap;opacity:0;text-align:center;transform-origin:50% 100%}
.rot b{display:inline-block;font-size:64px;font-weight:900;letter-spacing:-.01em;line-height:1;padding:12px 26px 14px;border-radius:16px}
.rot small{display:block;margin-top:8px;font-family:"JetBrains Mono",Consolas,monospace;font-size:32px;letter-spacing:.08em;color:#c9cad1;text-transform:uppercase;text-shadow:0 2px 6px #000}
.rot.branco b{background:rgba(16,16,19,.88);color:#fff;border:2px solid rgba(255,255,255,.18)}
.rot.pill b{background:rgba(10,24,15,.9);color:#3BE07A;border:3px solid #3BE07A;box-shadow:0 0 22px rgba(59,224,122,.45)}
.rot.verde b{background:#3BE07A;color:#0f1a12}
.rot.vermelho b{background:#E5484D;color:#fff}
.rot.amarelo b{background:#F2B630;color:#141414}
.rot.tag b{font-size:40px;padding:8px 18px 10px;border-radius:10px;background:#FF8A2B;color:#141414;font-family:"JetBrains Mono",Consolas,monospace;font-weight:800;letter-spacing:.06em}
.rot.lcd b{font-family:"JetBrains Mono",Consolas,monospace;font-size:76px;font-weight:800;color:#ffd06a;background:#1a1208;border:4px solid #4a3a1a;
 text-shadow:0 0 14px rgba(255,190,60,.8);letter-spacing:.04em;border-radius:12px;padding:14px 28px}
.rot.alerta b{background:#141416;color:#FF8A2B;border:3px solid #FF8A2B;font-size:56px}

<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
 <canvas id="three-layer" width="__W__" height="__H__"></canvas>
 <div id="vign"></div>
 <div id="ov"><div id="bc"></div><div id="chip"><i></i><span></span></div><div id="cap"></div></div>
 <!--__ITEMS__-->
 <div id="dip"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__hfRender = window.__hfRender || null;
const tl = gsap.timeline({paused:true, onUpdate:()=>{ if(window.__hfRender) window.__hfRender(tl.time()); }});
tl.to({v:0},{v:1,duration:__DUR__,ease:"none"},0);
window.__timelines["main"] = tl;
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const W=__W__,H=__H__,DUR=__DUR__;
const EDIT=__EDIT__;
const ITEMS=EDIT.items.filter(i=>!i.hidden);
const ED=Object.fromEntries(EDIT.items.map(i=>[i.id,i]));
const PARAM=(id,d)=>(ED[id]&&ED[id].props&&ED[id].props.value!==undefined)?ED[id].props.value:d;
const byTrack=tr=>ITEMS.filter(i=>i.track===tr).sort((a,b)=>a.start-b.start);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const sm=k=>{k=clamp(k);return k*k*(3-2*k);};
const io=k=>{k=clamp(k);return -(Math.cos(Math.PI*k)-1)/2;};
const seg=(t,a,b)=>sm((t-a)/(b-a));
const back=k=>{k=clamp(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(4242);

// ---------- renderer / palco ----------
const canvas=document.getElementById("three-layer");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const BG=new THREE.Color(PARAM("cor_fundo","#0b0c10"));
scene.background=BG; scene.fog=new THREE.Fog(BG,PARAM("fog_ini",22),PARAM("fog_fim",48));
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=PARAM("env",0.45);
const camera=new THREE.PerspectiveCamera(PARAM("fov",34),W/H,0.05,300);
const hemi=new THREE.HemisphereLight(0xbfc6ff,0x1a1a1f,0.55); scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,2.1); key.position.set(5,10,7); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40}); key.shadow.bias=-0.0005; key.shadow.radius=4;
scene.add(key);
const rim=new THREE.DirectionalLight(0x9fb4ff,1.4); rim.position.set(-6,5,-8); scene.add(rim);
// chão
const floorMat=new THREE.MeshStandardMaterial({color:PARAM("cor_chao","#34343a"),roughness:.42,metalness:.15});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,400),floorMat); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
// estrelas (céu)
{const n=PARAM("estrelas",900),pos=new Float32Array(n*3);
 for(let i=0;i<n;i++){const th=R()*Math.PI*2, ph=0.04+R()*1.25, r=120;
  pos[i*3]=Math.cos(th)*Math.cos(ph)*r; pos[i*3+1]=Math.sin(ph)*r*0.9+4; pos[i*3+2]=Math.sin(th)*Math.cos(ph)*r;}
 const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3));
 const st=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:.85}));
 scene.add(st);}

// helpers de material/geometria para as cenas
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.05},o));
const add=(m,p)=>{m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);return m;};
const box=(w,h,d,mat,r=0)=>new THREE.Mesh(r>0?new RoundedBoxGeometry(w,h,d,3,r):new THREE.BoxGeometry(w,h,d),mat);
const cyl=(rt,rb,h,mat,seg=32,open=false,ts=0,tl2=Math.PI*2)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg,1,open,ts,tl2),mat);
function textPlane(txt,w,h,{cor="#ffffff",bg=null,font="900 120px Arial Black, Arial, sans-serif",px=1024}={}){
  const c=document.createElement("canvas"); c.width=px; c.height=Math.round(px*h/w); const x=c.getContext("2d");
  if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);}
  x.fillStyle=cor; x.font=font; x.textAlign="center"; x.textBaseline="middle"; x.fillText(txt,c.width/2,c.height/2+4);
  const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace; tx.anisotropy=8;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tx,transparent:!bg,roughness:.6}));
}

// ---------- câmera por itens (track "camera": props.pos, props.look, props.trans) ----------
const CAMS=byTrack("camera");
const V=(a)=>new THREE.Vector3(a[0],a[1],a[2]);
function camAt(t){
  if(!CAMS.length) return {pos:V([0,4,16]),look:V([0,1.5,0])};
  let i=0; for(let k=0;k<CAMS.length;k++) if(t>=CAMS[k].start) i=k;
  const c=CAMS[i], p=CAMS[Math.max(0,i-1)];
  const tr=c.props.trans!==undefined?c.props.trans:0.9;
  const k=i===0?1:io((t-c.start)/Math.max(0.01,tr));
  const pos=V(p.props.pos).lerp(V(c.props.pos),k), look=V(p.props.look).lerp(V(c.props.look),k);
  // drift lento dentro do plano (câmera nunca parada)
  const d=c.props.drift!==undefined?c.props.drift:0.35, u=(t-c.start);
  pos.x+=Math.sin(u*0.35)*d; pos.y+=Math.sin(u*0.27+1)*d*0.35; pos.z-=u*d*0.05;
  return {pos,look};
}

// ---------- overlays HTML ----------
const ov=document.getElementById("ov");
document.getElementById("bc").textContent=PARAM("breadcrumb","");
const chipEl=document.getElementById("chip"), chipTx=chipEl.querySelector("span");
const CHAPS=byTrack("capitulo");
// legenda karaokê
const capEl=document.getElementById("cap");
const CAPI=ITEMS.find(i=>i.type==="caption");
let GROUPS=[];
if(CAPI){const ws=CAPI.props.words||[], mx=CAPI.props.max_words||5; let g=[];
  ws.forEach((w,k)=>{g.push(w); const end=/[.,!?;:]$/.test(w.w); const gap=ws[k+1]?ws[k+1].s-w.e:9;
    if(end||g.length>=mx||gap>0.45){GROUPS.push(g);g=[];}});
  if(g.length)GROUPS.push(g);
  GROUPS=GROUPS.map((g,k)=>({ws:g,s:g[0].s-0.08,e:GROUPS[k+1]?GROUPS[k+1][0].s-0.08:g[g.length-1].e+0.8}));
  GROUPS.forEach((G,k)=>{if(k<GROUPS.length-1) G.e=Math.min(G.e,G.ws[G.ws.length-1].e+1.2);});}
let curG=-1, spans=[];
function setGroup(k){ if(k===curG) return; curG=k; capEl.innerHTML=""; spans=[];
  if(k<0) return; GROUPS[k].ws.forEach((w,j)=>{const s=document.createElement("span"); s.textContent=(j?" ":"")+w.w; capEl.appendChild(s); spans.push(s);});}
// adesivos
const STK=byTrack("adesivos").map(it=>{const d=document.createElement("div"); d.className="stk "+(it.props.cor||"amarelo"); d.textContent=it.props.text;
  if(it.props.size) d.style.fontSize=it.props.size+"px"; ov.appendChild(d); return {it,d};});
// rótulos (ancorados no 3D ou em x/y)
const ROT=byTrack("rotulos").map(it=>{const d=document.createElement("div"); d.className="rot "+(it.props.estilo||"branco");
  const b=document.createElement("b"); b.textContent=it.props.text; d.appendChild(b);
  if(it.props.sub){const s=document.createElement("small"); s.textContent=it.props.sub; d.appendChild(s);}
  if(it.props.size) b.style.fontSize=it.props.size+"px"; ov.appendChild(d); return {it,d,b};});
const ANCH={}; // preenchido pela cena: nome -> ()=>THREE.Vector3
const tmpV=new THREE.Vector3();
function proj(v){tmpV.copy(v).project(camera); return [(tmpV.x+1)/2*W,(1-tmpV.y)/2*H,tmpV.z];}
const fmtBR=(v,dec)=>v.toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const dip=document.getElementById("dip");

// ---------- cena específica do vídeo ----------
let cenaUpdate=(t)=>{};
/*__CENA__*/

function renderAt(t){
  t=Math.max(0,Math.min(DUR,t||0));
  cenaUpdate(t);
  const c=camAt(t); camera.position.copy(c.pos); camera.lookAt(c.look); camera.updateMatrixWorld();
  renderer.render(scene,camera);

  // capítulo
  let ch=null; for(const c2 of CHAPS) if(t>=c2.start&&t<c2.start+c2.dur) ch=c2;
  chipEl.style.opacity=ch?1:0; if(ch){ if(chipTx.textContent!==ch.props.text) chipTx.textContent=ch.props.text;
    const k=seg(t,ch.start,ch.start+0.3); chipEl.style.transform=`translateX(${(1-k)*-30}px)`; chipEl.style.opacity=k;}
  // legenda
  let gk=-1; GROUPS.forEach((G,k)=>{if(t>=G.s&&t<G.e) gk=k;}); setGroup(gk);
  if(CAPI&&gk>=0&&t>=CAPI.start&&t<CAPI.start+CAPI.dur){capEl.style.opacity=1; const G=GROUPS[gk];
    const k=seg(t,G.s,G.s+0.12); capEl.style.transform=`translate(-50%,-50%) scale(${0.96+0.04*k})`;
    G.ws.forEach((w,j)=>spans[j].classList.toggle("on",t>=w.s-0.02));}
  else capEl.style.opacity=0;
  // adesivos
  for(const {it,d} of STK){const a=it.start,b=it.start+it.dur;
    if(t<a||t>=b){d.style.opacity=0;continue;}
    const k=back((t-a)/0.32), o=Math.min(seg(t,a,a+0.12),1-seg(t,b-0.25,b));
    d.style.opacity=o; d.style.left=(it.props.x||540)+"px"; d.style.top=(it.props.y||700)+"px";
    d.style.transform=`translate(-50%,-50%) rotate(${it.props.rot!==undefined?it.props.rot:-4}deg) scale(${0.6+0.4*k})`;}
  // rótulos
  for(const {it,d,b} of ROT){const a=it.start,e=it.start+it.dur;
    if(t<a||t>=e){d.style.opacity=0;continue;}
    let x=it.props.x||540, y=it.props.y||800;
    if(it.props.anchor&&ANCH[it.props.anchor]){const [px,py,pz]=proj(ANCH[it.props.anchor](t)); if(pz>1){d.style.opacity=0;continue;} x=px+(it.props.dx||0); y=py+(it.props.dy||0);}
    if(it.props.count){const [f0,f1,dec]=it.props.count; const k=io((t-a-(it.props.t0||0))/Math.max(0.01,(it.props.t1||1)));
      b.textContent=(it.props.prefix||"")+fmtBR(lerp(f0,f1,k),dec===undefined?2:dec)+(it.props.suffix||"");}
    const k=back((t-a)/0.3), o=Math.min(seg(t,a,a+0.12),1-seg(t,e-0.2,e));
    const hw=d.offsetWidth/2+40; x=clamp(x,hw,W-hw); y=clamp(y,380+d.offsetHeight,1540);
    d.style.opacity=o; d.style.left=x+"px"; d.style.top=y+"px";
    d.style.transform=`translate(-50%,-100%) scale(${0.7+0.3*k})`;}
  dip.style.opacity=1-seg(t,0,0.35);
}
window.__hfRender=renderAt;
window.addEventListener("hf-seek",ev=>renderAt(ev.detail.time));
renderAt(window.__hfThreeTime||0);
</script>
