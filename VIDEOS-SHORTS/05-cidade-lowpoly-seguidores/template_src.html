<!doctype html>
<html lang="pt"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js" } }
</script>
<style>
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#cfe9fb;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#cfe9fb;}
#three-layer{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block;}
#ov{position:absolute;inset:0;pointer-events:none;}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
 <canvas id="three-layer" width="1080" height="1920"></canvas>
 <div id="ov"></div>
 <!--__ITEMS__-->
</div>
<script>
window.__timelines = window.__timelines || {};
window.__hfRender = window.__hfRender || null;
const tl = gsap.timeline({paused:true, onUpdate:()=>{ if(window.__hfRender) window.__hfRender(tl.time()); }});
tl.to({v:0},{v:1,duration:__DUR__,ease:"none"},0);
window.__timelines["main"] = tl;
</script>
<script type="module">
import * as THREE from "three";
/*__KIT__*/
const K=LPKIT(THREE);
const W=1080,H=1920,DUR=__DUR__;
const EDIT=__EDIT__;
const ED=Object.fromEntries(EDIT.items.map(i=>[i.id,i]));
const T=id=>ED[id]?ED[id].start:0;
const R=K.rng(505);

const {renderer,scene,camera,follow}=K.setup(document.getElementById("three-layer"),W,H,{fov:40,fogNear:90,fogFar:330,shadowSize:26,skyTop:"#86c8f2",skyMid:"#d6ecfa",skyBot:"#fbeed6"});

// ---------- grade da cidade ----------
const PX=11.6,PZ=6.8,LOT=2.4,NX=11,NZ=17;           // blocos de -NX..NX, -NZ..NZ
const inPlaza=(bx,bz)=>Math.abs(bx)<=1&&Math.abs(bz)<=1;
const ground=K.mesh(new THREE.PlaneGeometry(2000,2000),"#7acb4a");ground.rotation.x=-Math.PI/2;ground.castShadow=false;scene.add(ground);
// praia + mar ao fundo (-z)
const zEdge=-(NZ+0.6)*PZ;
const sand=K.mesh(new THREE.PlaneGeometry(2000,22),"#f2dfa6");sand.rotation.x=-Math.PI/2;sand.position.set(0,0.01,zEdge-11);sand.castShadow=false;scene.add(sand);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(2000,800),new THREE.MeshLambertMaterial({color:"#3fb6d8"}));sea.rotation.x=-Math.PI/2;sea.position.set(0,0.02,zEdge-22-400);scene.add(sea);
// ruas
const LX=(NX+0.5)*PX*2,LZ=(NZ+0.5)*PZ*2;
for(let i=-NX-1;i<=NX;i++){const r=K.road(LZ,1.6);r.position.x=(i+0.5)*PX;scene.add(r);}
for(let j=-NZ-1;j<=NZ;j++){const r=K.road(LX,1.6);r.rotation.y=Math.PI/2;r.position.z=(j+0.5)*PZ;r.position.y=0.004;scene.add(r);}

// ---------- casa herói (branca, vazia) ----------
const HX=PX+(1-1.5)*LOT, HZ=3*PZ+(1-0.5)*LOT;
const hero=K.house({wall:"#ffffff",flat:true,roof:"#d8d3c9",w:1.7,d:1.5,h:1.15});hero.position.set(HX,0,HZ);scene.add(hero);
const plateTex=K.textTex("Nº 1",{w:256,h:128,bg:"#2d6fd1",color:"#ffffff",size:84,border:"#ffffff"});
const plate=new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.28),new THREE.MeshBasicMaterial({map:plateTex}));plate.position.set(HX+0.55,0.82,HZ+0.78);scene.add(plate);
const mailbox=K.box(0.08,0.75,0.08,"#7d838c",HX-0.7,0.37,HZ+1.05);scene.add(mailbox);scene.add(K.box(0.22,0.16,0.3,"#e2574c",HX-0.7,0.8,HZ+1.05));
const pin=new THREE.Group();const pc=K.mesh(new THREE.ConeGeometry(0.28,0.6,4),"#ffd21f");pc.rotation.x=Math.PI;pin.add(pc);pin.add(K.ball(0.3,"#ffd21f",0,0,0.5,0));scene.add(pin);

// ---------- lotes: casas (crescem) + árvores ----------
const roofs=["#ee7a3a","#e8693a","#f08a45","#d9612f"],walls=["#f6f2ea","#fbf7ef","#efe9dc","#f3ede4","#fff7e8"];
const houses=[],trees=[],parked=[];
for(let bx=-NX;bx<=NX;bx++)for(let bz=-NZ;bz<=NZ;bz++){if(inPlaza(bx,bz))continue;const cx=bx*PX,cz=bz*PZ;
  for(let i=0;i<4;i++)for(let j=0;j<2;j++){const x=cx+(i-1.5)*LOT,z=cz+(j-0.5)*LOT;
    if(Math.abs(x-HX)<0.1&&Math.abs(z-HZ)<0.1)continue;
    const d=Math.hypot(x-HX,z-HZ);
    houses.push({x,z:z+(j?0.15:-0.15),ry:j?0:Math.PI,s:0.9+R()*0.2,d,r:R(),colors:{wall:walls[(R()*walls.length)|0],roof:roofs[(R()*roofs.length)|0]}});
    if(R()<0.6)trees.push({x:x+(R()-0.5)*1.4,z:z+(j?-0.95:0.95),s:0.75+R()*0.5,colors:{crown:["#5fbf3f","#4fae3a","#6cc94a","#3f9f36"][(R()*4)|0]}});}
  // árvores de calçada
  for(let k=0;k<3;k++)if(R()<0.5)trees.push({x:cx+(R()-0.5)*9,z:cz+PZ/2-0.55,s:0.6+R()*0.3,colors:{crown:"#57b83d"}});
}
// carros estacionados perto do centro
for(let i=-6;i<=5;i++)for(let k=-40;k<40;k++){if(R()<0.62)continue;const x=(i+0.5)*PX+(R()<0.5?-0.55:0.55),z=k*1.5+0.3;if(Math.abs(z)<10.2&&Math.abs(x)<17)continue;
  parked.push({x,z,ry:Math.PI/2,s:0.85,colors:{body:["#e2574c","#2f7fd8","#f2c230","#ffffff","#3b3f4a","#8fd0e8","#e98a3a"][(R()*7)|0]}});}
for(let j=-6;j<=5;j++)for(let k=-30;k<30;k++){if(R()<0.62)continue;const z=(j+0.5)*PZ+(R()<0.5?-0.55:0.55),x=k*1.5+0.3;if(Math.abs(z)<10.2&&Math.abs(x)<17)continue;
  if(Math.abs(x-HX)<7&&Math.abs(z-(3.5*PZ))<5)continue;
  parked.push({x,z,ry:0,s:0.85,colors:{body:["#e2574c","#2f7fd8","#f2c230","#ffffff","#3b3f4a","#8fd0e8","#e98a3a"][(R()*7)|0]}});}
const HI=K.instance(scene,K.house(),houses);
const TI=K.instance(scene,K.tree({two:true}),trees);
const CI=K.instance(scene,K.car(),parked);
// carros andando
const movers=[];for(let k=0;k<90;k++){const vert=R()<0.5,line=((R()*12)|0)-6;movers.push({vert,line,off:R()*200,v:(R()<0.5?-1:1)*(2.2+R()*1.6),colors:{body:["#e2574c","#2f7fd8","#f2c230","#ffffff","#3b3f4a"][(R()*5)|0]},x:0,z:0});}
const MI=K.instance(scene,K.car(),movers);

// ---------- praça + prefeitura ----------
const plaza=K.mesh(new THREE.PlaneGeometry(1.5*PX*2-2.2,1.5*PZ*2-2.2),"#efe4c8");plaza.rotation.x=-Math.PI/2;plaza.position.y=0.035;plaza.castShadow=false;scene.add(plaza);
for(const sx of [-1,1]){const lawn=K.mesh(new THREE.PlaneGeometry(8,9),"#86d356");lawn.rotation.x=-Math.PI/2;lawn.position.set(sx*10.5,0.04,1);lawn.castShadow=false;scene.add(lawn);}
const carpet=K.mesh(new THREE.PlaneGeometry(1.5,8.2),"#d8343a");carpet.rotation.x=-Math.PI/2;carpet.position.set(0,0.05,5.4);carpet.castShadow=false;scene.add(carpet);
const pref=new THREE.Group();pref.position.set(0,0,-2.4);scene.add(pref);
pref.add(K.box(12,0.4,8,"#e9dfc9",0,0.2,0));
pref.add(K.box(4,0.2,1,"#e9dfc9",0,0.1,4.4));pref.add(K.box(3.2,0.12,0.6,"#e9dfc9",0,0.26,4.1));
pref.add(K.box(9,3.2,5.2,"#f6f1e6",0,2.0,-0.4));
for(let r=0;r<2;r++)for(let c=0;c<5;c++)pref.add(K.box(0.75,0.95,0.06,"#7fb6d9",-3.4+c*1.7,1.4+r*1.35,2.24));
pref.add(K.box(1.3,2.0,0.08,"#5a3a26",0,1.4,2.25));
for(let c=0;c<8;c++)pref.add(K.cyl(0.24,0.28,3.1,"#ffffff",8,-3.85+c*1.1,1.95,3.3));
pref.add(K.box(9.6,0.45,1.7,"#f3eee3",0,3.72,3.1));
const pedG=new THREE.CylinderGeometry(1,1,9.6,3);pedG.rotateZ(Math.PI/2);pedG.rotateX(-Math.PI/2);pedG.scale(1,0.7,0.95);const pedM=K.mesh(pedG,"#f3eee3");pedM.position.set(0,4.3,3.0);pref.add(pedM);
const signTex=K.textTex("PREFEITURA",{w:1024,h:160,bg:"#1f5a44",color:"#ffd34d",size:110,border:"#e2b23a"});
const sign=new THREE.Mesh(new THREE.PlaneGeometry(5.2,0.82),new THREE.MeshLambertMaterial({map:signTex}));sign.position.set(0,3.72,3.96);pref.add(sign);
pref.add(K.box(5.4,1.5,3.6,"#f6f1e6",0,4.3,-0.6));
pref.add(K.cyl(1.75,1.85,0.9,"#efe8da",12,0,5.5,-0.6));
const dome=K.mesh(new THREE.SphereGeometry(1.85,12,7,0,Math.PI*2,0,Math.PI/2),"#3fae7a");dome.position.set(0,5.95,-0.6);pref.add(dome);
pref.add(K.mesh(new THREE.ConeGeometry(0.22,1.5,6),"#f0bf3a"));pref.children[pref.children.length-1].position.set(0,8.4,-0.6);
pref.add(K.ball(0.26,"#f0bf3a",0,0,7.7,-0.6));
for(const sx of [-1,1]){pref.add(K.cyl(0.05,0.05,3.6,"#9aa0a8",5,sx*5.2,2.2,3.6));const f=K.box(1.1,0.7,0.04,"#2754a8",sx*5.2+sx*0.55,3.6,3.6);pref.add(f);}
// palmeiras e postes ao redor da praça
const palms=[];for(let k=0;k<8;k++){palms.push({x:-15+k*(30/7),z:8.4,s:1.2},{x:-15+k*(30/7),z:-8.4,s:1.2});}
for(let k=0;k<4;k++){palms.push({x:-15.6,z:-6+k*4,s:1.2},{x:15.6,z:-6+k*4,s:1.2});}
K.instance(scene,K.palm(),palms.map(p=>({...p,ry:R()*6})));
// seguranças (terno preto) + morador (camiseta amarela)
const guards=[];for(const [x,z] of [[-1.45,3.4],[1.45,3.4],[-1.45,5.6],[1.45,5.6],[-3.3,2.6],[3.3,2.6]]){const g=K.person({shirt:"#23262d",pants:"#1a1c21",hair:"#1b1410",shoe:"#111"});g.position.set(x,0.05,z);g.rotation.y=x<0?0.5:-0.5;g.scale.setScalar(1.15);g.add(K.box(0.3,0.1,0.02,"#111",0,1.26,0.17));scene.add(g);guards.push(g);}
const res=K.person();res.position.set(0,0.05,7.2);res.scale.setScalar(1.2);scene.add(res);

// ---------- âncoras dos rótulos ----------
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const ANCH={morador:()=>V(0,2.4,7.2),prefeitura:()=>V(0,9.4,-3),seguranca:()=>V(1.45,2.2,3.4),
  casa:()=>V(HX,1.6,HZ),rua:()=>V(HX+0.4,0.05,3.5*PZ),numero:()=>V(HX+0.55,0.82,HZ+0.8),pin:()=>V(HX,3.2,HZ),heroi:()=>V(HX,1.2,HZ)};
const proj=n=>ANCH[n]?K.project(ANCH[n](),camera,W,H):null;

// ---------- câmera (tempos vindos do edit.json) ----------
const tQ=T("sh_quem"),tV=T("sh_vazia"),tP=T("sh_pref"),tR=T("sh_rua"),tY=T("sh_voce"),tC=T("sh_casa"),tG=T("sh_cresce"),tF=T("sh_fim");
const cam=K.camPath([
  {t:0,p:[0,10,27],l:[0,3.5,-2]},
  {t:tQ-0.2,p:[0,8,22],l:[0,3,-1]},
  {t:tQ+0.7,p:[3.2,3.2,13.5],l:[0,1.3,7]},
  {t:tV-0.1,p:[2.4,2.8,11.8],l:[0,1.3,7]},
  {t:tV+0.8,p:[18,46,40],l:[16,0,26]},
  {t:tP-0.1,p:[26,40,34],l:[22,0,22]},
  {t:tP+0.9,p:[15,10,22],l:[0,2.6,2]},
  {t:tR-0.1,p:[-7,8,21],l:[0,2.4,2]},
  {t:tR+0.9,p:[HX-15,9.5,HZ+10],l:[HX-4,0.6,HZ+2.0]},
  {t:tY-0.15,p:[HX-4.2,2.6,HZ+6.4],l:[HX,0.9,HZ+0.6]},
  {t:tC,p:[HX-3.0,2.0,HZ+5.0],l:[HX-0.2,0.9,HZ+0.6]},
  {t:tG,p:[HX-3.6,2.5,HZ+5.6],l:[HX-0.2,0.9,HZ+0.6]},
  {t:tF-0.2,p:[HX-26,26,HZ+38],l:[HX,0,HZ-4]},
  {t:DUR,p:[HX-55,70,HZ+80],l:[HX+2,0,HZ-14]}]);

// ---------- overlay ----------
const ov=document.getElementById("ov");
const LAB=K.labels(ov,EDIT.items.filter(i=>i.track==="rotulos"),{W,H});
const CAP=ED.leg?K.captions(ov,ED.leg,{W}):null;

function renderAt(t){
  const L=cam(t,camera);follow(L);
  // crescimento das casas
  for(let i=0;i<houses.length;i++){const h=houses[i];const ta=tG+0.25+Math.pow(Math.min(h.d,170)/170,0.75)*4.6+h.r*0.35;
    const k=t<ta?0:K.back((t-ta)/0.4);HI.set(i,h.x,0,h.z,h.ry,h.s*Math.max(k,0)*1,h.s*Math.max(k,0),h.s*Math.max(k,0));}
  HI.done();
  // carros andando
  movers.forEach((m,i)=>{const u=((m.off+m.v*t)%200+200)%200-100;if(m.vert){m.x=(m.line+0.5)*PX+(m.v>0?0.38:-0.38);m.z=u;}else{m.z=(m.line+0.5)*PZ+(m.v>0?-0.38:0.38);m.x=u;}
    const ry=m.vert?(m.v>0?-Math.PI/2:Math.PI/2):(m.v>0?0:Math.PI);MI.set(i,m.x,0,m.z,ry,0.85);});MI.done();
  // morador acena; pino sobe e desce
  const wv=K.win(t,tQ,tV)+K.win(t,tP,tR);res.userData.arms[1].rotation.z=wv*(2.4+Math.sin(t*9)*0.35);res.rotation.y=Math.sin(t*1.3)*0.15;
  pin.visible=t>=tF-0.2;pin.position.set(HX,3.0+Math.sin(t*4)*0.25+(1-K.back((t-tF+0.2)/0.5))*4,HZ);pin.rotation.y=t*2;pin.scale.setScalar(2.2+K.seg(t,tF,DUR)*2.5);
  renderer.render(scene,camera);
  LAB.update(t,proj);if(CAP)CAP.update(t);
}
window.__hfRender=renderAt;
window.addEventListener("hf-seek",ev=>renderAt(ev.detail.time));
renderAt(window.__hfThreeTime||0);
</script>
<!--__ITEMS_SCRIPT__-->
</body></html>
