<script>
const EDIT=__EDIT__;
const ED=Object.fromEntries(EDIT.items.map(i=>[i.id,i]));
const PV=(id,d)=>ED[id]?ED[id].props.value:d;
const CA=PV("cor_a","#39FF6A"), CB=PV("cor_b","#3EC8FF"), HL=PV("cor_destaque","#FFE600");
const NA=PV("nome_a","PELÉ"), NB=PV("nome_b","MARADONA");
const R=document.getElementById("root"); R.style.setProperty("--ca",CA);R.style.setProperty("--cb",CB);R.style.setProperty("--hl",HL);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const oc=k=>1-Math.pow(1-k,3), back=k=>{k=clamp(k,0,1);const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const fmt=n=>Math.round(n).toLocaleString("pt-BR");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// ---------- silhuetas (traço grosso, pose por juntas) ----------
const POSES={
 chute:{head:[205,92],neck:[200,150],hip:[198,320],le:[128,205],lh:[70,250],re:[262,198],rh:[318,160],lk:[178,438],lf:[168,566],rk:[272,392],rf:[352,330],ball:[384,318]},
 drible:{head:[228,104],neck:[214,160],hip:[196,330],le:[150,222],lh:[104,292],re:[276,212],rh:[328,262],lk:[146,442],lf:[104,552],rk:[252,432],rf:[276,560],ball:[318,572]},
 braco:{head:[200,92],neck:[200,150],hip:[200,322],le:[132,108],lh:[110,30],re:[268,108],rh:[290,30],lk:[166,440],lf:[150,566],rk:[236,440],rf:[252,566],ball:null}
};
function figSVG(pose,cor,id,flip){const P=POSES[pose];const L=(a,b,w)=>`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke-width="${w}"/>`;
 const body=L("neck","hip",74)+L("neck","le",34)+L("le","lh",30)+L("neck","re",34)+L("re","rh",30)+L("hip","lk",42)+L("lk","lf",36)+L("hip","rk",42)+L("rk","rf",36);
 const mx=(P.neck[0]+P.hip[0])/2,my=(P.neck[1]+P.hip[1])/2-10;
 return `<svg viewBox="0 0 420 620"><defs><filter id="g${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <ellipse cx="210" cy="600" rx="170" ry="16" fill="${cor}" opacity=".25"/>
 <g filter="url(#g${id})" stroke="${cor}" stroke-linecap="round" fill="none">${body.replace(/stroke-width="(\d+)"/g,(m,w)=>`stroke-width="${+w+12}"`)}<circle cx="${P.head[0]}" cy="${P.head[1]}" r="50" fill="${cor}"/></g>
 <g stroke="#0b0d14" stroke-linecap="round" fill="none">${body}</g>
 <circle cx="${P.head[0]}" cy="${P.head[1]}" r="40" fill="#0b0d14"/>
 <text x="${mx}" y="${my+26}" text-anchor="middle" font-family="Anton,Impact" font-size="62" fill="${cor}" transform="rotate(${(Math.atan2(P.neck[0]-P.hip[0],P.hip[1]-P.neck[1])*57.3).toFixed(1)} ${mx} ${my})${flip?` translate(${2*mx} 0) scale(-1 1)`:""}">10</text>
 ${P.ball?`<g class="ball"><circle cx="${P.ball[0]}" cy="${P.ball[1]}" r="30" fill="#fff" stroke="${cor}" stroke-width="6"/><circle cx="${P.ball[0]}" cy="${P.ball[1]}" r="11" fill="#0b0d14"/></g>`:""}
 </svg>`;}
const cupSVG=c=>`<svg viewBox="0 0 78 96"><path d="M14 6h50v18c0 18-11 30-25 32C25 54 14 42 14 24z" fill="${c}"/><path d="M14 12H4c0 14 6 20 14 22M64 12h10c0 14-6 20-14 22" stroke="${c}" stroke-width="6" fill="none"/><rect x="33" y="55" width="12" height="18" fill="${c}"/><rect x="20" y="73" width="38" height="12" rx="3" fill="${c}"/></svg>`;

// ---------- monta cenas ----------
const ST=document.getElementById("stage"); const SC=[];
let fid=0;
function fig(pose,cor,x,y,s,flip){const d=document.createElement("div");d.className="fig";d.innerHTML=figSVG(pose,cor,fid++,flip);
 d.dataset.x=x;d.dataset.y=y;d.dataset.s=s;d.dataset.f=flip?-1:1;return d;}
for(const it of EDIT.items.filter(i=>i.track==="cenas")){
 const p=it.props, el=document.createElement("div"); el.className="sc"; el.id=it.id; ST.appendChild(el);
 const o={it,p,el,a:it.start,b:it.start+it.dur,n:{}};
 const add=(k,html,cls)=>{const d=document.createElement("div");if(cls)d.className=cls;d.innerHTML=html;el.appendChild(d);o.n[k]=d;return d;};
 if(p.tipo==="abertura"){
  o.n.fa=fig("chute",CA,300,1180,1.25,false); o.n.fb=fig("drible",CB,780,1180,1.25,true); el.append(o.n.fa,o.n.fb);
  add("na",esc(NA),"nm").style.cssText+=`left:270px;top:1270px;color:${CA};font-size:84px`;
  add("nb",esc(NB),"nm").style.cssText+=`left:800px;top:1270px;color:${CB};font-size:84px`;
  add("vs","VS","vs").style.top="760px";
  add("s1",esc(p.selo1),"selo").style.top="300px";
  add("s2",esc(p.selo2),"selo out").style.top="440px";
 } else if(p.tipo==="duelo"){
  add("tit",esc(p.titulo),"tit");
  o.n.fa=fig("chute",CA,250,900,.82,false); o.n.fb=fig("drible",CB,830,900,.82,true); el.append(o.n.fa,o.n.fb);
  add("vs","VS","vs").style.cssText+="top:640px;font-size:120px";
  add("na",esc(NA),"nm").style.cssText+=`left:270px;top:960px;color:${CA}`;
  add("nb",esc(NB),"nm").style.cssText+=`left:810px;top:960px;color:${CB}`;
  add("va","0","num a").style.cssText+="left:270px;top:1110px";
  add("vb","0","num b").style.cssText+="left:810px;top:1110px";
  add("sa",esc(p.a.sub||""),"sub").style.cssText+="left:270px;top:1250px";
  add("sb",esc(p.b.sub||""),"sub").style.cssText+="left:810px;top:1250px";
  if(p.icone==="taca"){add("ca",Array.from({length:p.a.valor},()=>cupSVG(CA)).join(""),"cups").style.cssText+="left:270px;top:1400px";
   add("cb",Array.from({length:p.b.valor},()=>cupSVG(CB)).join(""),"cups").style.cssText+="left:810px;top:1400px";}
  if(p.barra){add("bars",`<div class="rl">${esc(p.barra.rotulo)}</div><div class="bar a"><i></i><span>${esc(NA)}</span><em>${esc(p.barra.a)}</em></div><div class="bar b"><i></i><span>${esc(NB)}</span><em>${esc(p.barra.b)}</em></div>`,"bars");}
  if(p.selo){const s=add("selo",esc(p.selo).replace(" POR ","<br>POR "),"selo");s.style.top="1500px";s.style.fontSize="58px";}
 } else if(p.tipo==="solo"){
  const c=p.lado==="a"?CA:CB;
  add("tit",esc(p.titulo),"tit");
  o.n.fa=fig(p.lado==="a"?"chute":"drible",c,540,1060,1.15,p.lado==="b"); el.append(o.n.fa);
  if(p.valor){add("big","0","big").style.cssText+=`top:1230px;text-shadow:0 0 50px ${c},0 0 110px ${c},0 12px 0 #000`;}
  add("selo",esc(p.selo),"selo").style.top=p.valor?"470px":"1180px";
  add("sub",esc(p.sub||""),"sub").style.cssText+=`left:540px;top:${p.valor?1430:1340}px;font-size:56px;color:${c}`;
 } else if(p.tipo==="divide"){
  add("tit",esc(p.titulo),"tit");
  o.n.fa=fig("braco",CA,300,1180,1.0,false); o.n.fb=fig("braco",CB,780,1180,1.0,true); el.append(o.n.fa,o.n.fb);
  add("selo",esc(p.selo),"selo out").style.top="420px";
  add("na",esc(NA),"nm").style.cssText+=`left:300px;top:1250px;color:${CA};font-size:76px`;
  add("nb",esc(NB),"nm").style.cssText+=`left:780px;top:1250px;color:${CB};font-size:76px`;
  add("s2",esc(p.selo2),"selo").style.cssText+="top:1420px;font-size:110px";
 } else if(p.tipo==="final"){
  add("tit",esc(p.titulo),"tit");
  add("plac",`<b style="color:${CA};text-shadow:0 0 40px ${CA},0 10px 0 #000">0</b><i>x</i><b style="color:${CB};text-shadow:0 0 40px ${CB},0 10px 0 #000">0</b>`,"plac");
  add("na",esc(NA),"nm").style.cssText+=`left:330px;top:1010px;color:${CA}`;
  add("nb",esc(NB),"nm").style.cssText+=`left:750px;top:1010px;color:${CB}`;
  add("perg",esc(p.pergunta),"selo out").style.cssText+="top:1240px;font-size:96px";
  add("cta",esc(p.cta),"selo").style.cssText+="top:1420px;font-size:100px";
 }
 SC.push(o);
}
// ---------- legenda (2 palavras) ----------
const LEG=ED.leg, CAP=document.getElementById("cap");
const KW=new Set(((LEG&&LEG.props.keywords)||[]).map(k=>k.toUpperCase()));
const WD=(LEG&&!LEG.hidden)?LEG.props.words:[]; const GR=[];
{const n=(LEG&&LEG.props.per_group)||2;let g=[];
 WD.forEach((w,i)=>{g.push(w);const end=/[.,!?:]$/.test(w.w);if(g.length>=n||end||i===WD.length-1){GR.push(g);g=[];}});}
if(LEG){CAP.style.top=(LEG.props.y||1690)+"px";CAP.style.fontSize=(LEG.props.size||92)+"px";}
const clean=w=>w.replace(/[.,!?:;]/g,"").toUpperCase();

// ---------- render ----------
function placeFig(d,t,k,bob){const x=+d.dataset.x,y=+d.dataset.y,s=+d.dataset.s,f=+d.dataset.f;
 d.style.left=(x-210)+"px";d.style.top=(y-620)+"px";
 d.style.transform=`translateY(${(1-k)*260+Math.sin(t*4+x)*bob}px) scale(${s*f},${s})`;d.style.opacity=k;}
function land(n,t,t0,dur=.22){const k=seg(t,t0,t0+dur);if(t<t0){n.style.opacity=0;return 0;}
 n.style.opacity=1;const sc=1+.9*(1-back(k));n.style.transform=`translate(-50%,-50%) scale(${sc})`;return 1;}
function stamp(n,t,t0,rot=-4){if(t<t0){n.style.opacity=0;return;}const k=seg(t,t0,t0+.18);
 n.style.opacity=1;n.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${1+1.2*(1-oc(k))})`;}
function count(n,t,t0,t1,v){if(t<t0){n.style.opacity=0;return;}const k=oc(seg(t,t0,Math.max(t1,t0+.35)));n.textContent=fmt(v*k);
 n.style.opacity=1;const kk=seg(t,t0,t0+.2);const sc=1+.6*(1-back(kk))+(k>=1?.08*Math.max(0,1-(t-Math.max(t1,t0+.35))/.25):0);
 n.style.transform=`translate(-50%,-50%) scale(${sc})`;}
let shakeT=[];
for(const o of SC){const p=o.p;[p.t,p.t1,p.a&&p.a.t,p.b&&p.b.t,p.t_vs,p.t_placar].forEach(x=>{if(x!==undefined&&x!==null)shakeT.push(x);});}
const cuts=SC.map(o=>o.a).filter(a=>a>0);
function renderAt(t){
 // punch da câmera: corte seco + zoom curto + tremor nos números
 let z=1,sx=0,sy=0;
 for(const c of cuts){const k=seg(t,c,c+.28);if(t>=c&&k<1)z=Math.max(z,1+.09*(1-oc(k)));}
 for(const s of shakeT){const dt=t-s;if(dt>=0&&dt<.25){const a=22*(1-dt/.25);sx+=Math.sin(dt*90)*a;sy+=Math.cos(dt*77)*a;}}
 ST.style.transform=`translate(${sx}px,${sy}px) scale(${z+.012*Math.sin(t*1.3)})`;
 document.getElementById("grid").style.transform=`translateY(${(t*40)%90}px)`;
 let fl=0;for(const c of cuts){const dt=t-c;if(dt>=0&&dt<.1)fl=Math.max(fl,.85*(1-dt/.1));}
 document.getElementById("flash").style.opacity=fl;
 for(const o of SC){const on=t>=o.a&&t<o.b&&!o.it.hidden;o.el.style.display=on?"block":"none";if(!on)continue;
  const p=o.p,n=o.n,a=o.a,lt=t-a;
  if(n.tit){const u=seg(t,p.t_tit!==undefined?p.t_tit-.1:a,(p.t_tit!==undefined?p.t_tit:a)+.25);
   if(p.t_tit!==undefined&&t<p.t_tit-.1){n.tit.style.opacity=0;}else{n.tit.style.opacity=1;
   n.tit.style.transform=`translate(-50%,-50%) scale(${1+.5*(1-back(seg(t,(p.t_tit!==undefined?p.t_tit-.1:a),(p.t_tit!==undefined?p.t_tit-.1:a)+.2)))})`;n.tit.style.setProperty("--u",oc(u));}}
  if(p.tipo==="abertura"){
   placeFig(n.fa,t,oc(seg(t,a,a+.35)),8);placeFig(n.fb,t,oc(seg(t,a+.25,a+.6)),8);
   n.fa.style.transform+=` translateX(${-(1-oc(seg(t,a,a+.35)))*500}px)`;
   n.na.style.opacity=seg(t,a+.1,a+.3);n.nb.style.opacity=seg(t,p.t_vs-.1,p.t_vs+.1);
   land(n.vs,t,p.t_vs,.25);stamp(n.s1,t,p.t_s1,-4);stamp(n.s2,t,p.t_s2,3);
  } else if(p.tipo==="duelo"){
   placeFig(n.fa,t,oc(seg(t,a,a+.3)),6);placeFig(n.fb,t,oc(seg(t,a+.1,a+.4)),6);
   n.vs.style.opacity=seg(t,a+.1,a+.25);
   count(n.va,t,p.a.t-.05,p.a.t1||p.a.t+.35,p.a.valor);count(n.vb,t,p.b.t-.05,p.b.t1||p.b.t+.35,p.b.valor);
   n.sa.style.opacity=seg(t,p.a.ts,p.a.ts+.15);n.sb.style.opacity=seg(t,p.b.ts,p.b.ts+.15);
   if(n.ca){[...n.ca.children].forEach((c,i)=>{const k=back(seg(t,p.a.t+i*.12,p.a.t+i*.12+.25));c.style.transform=`scale(${k})`;c.style.opacity=t>=p.a.t+i*.12?1:0;});
    [...n.cb.children].forEach((c,i)=>{const k=back(seg(t,p.b.t+i*.12,p.b.t+i*.12+.25));c.style.transform=`scale(${k})`;c.style.opacity=t>=p.b.t+i*.12?1:0;});}
   if(n.bars){const B=p.barra,m=Math.max(B.va,B.vb),k=oc(seg(t,B.t,B.t+.7));n.bars.style.opacity=seg(t,B.t-.15,B.t)*(p.t_selo?1-seg(t,p.t_selo-.1,p.t_selo):1);
    const is=n.bars.querySelectorAll("i");is[0].style.width=(B.va/m*100*k)+"%";is[1].style.width=(B.vb/m*100*k)+"%";}
   if(n.selo)stamp(n.selo,t,p.t_selo,-3);
  } else if(p.tipo==="solo"){
   placeFig(n.fa,t,oc(seg(t,a,a+.3)),6);
   if(n.big){count(n.big,t,p.t,p.t1,p.valor);n.fa.style.opacity=.55;}
   stamp(n.selo,t,p.t_selo,-4);n.sub.style.opacity=seg(t,p.ts,p.ts+.15);
  } else if(p.tipo==="divide"){
   placeFig(n.fa,t,oc(seg(t,a,a+.3)),10);placeFig(n.fb,t,oc(seg(t,a+.1,a+.4)),10);
   n.na.style.opacity=seg(t,a+.2,a+.4);n.nb.style.opacity=seg(t,a+.3,a+.5);
   stamp(n.selo,t,p.t_selo,-3);stamp(n.s2,t,p.t_s2,-4);
  } else if(p.tipo==="final"){
   const bs=n.plac.querySelectorAll("b");const k=oc(seg(t,p.t_placar,p.t_placar+.6));
   bs[0].textContent=t<p.t_placar?0:Math.round(p.placar_a*k);bs[1].textContent=Math.round(p.placar_b*k);
   n.plac.style.transform=`translate(-50%,-50%) scale(${1+.3*(1-back(seg(t,p.t_placar,p.t_placar+.25)))})`;
   n.na.style.opacity=n.nb.style.opacity=seg(t,a,a+.2);
   stamp(n.perg,t,p.t_perg,-3);stamp(n.cta,t,p.t_cta,3);
   n.cta.style.transform+=` scale(${t>p.t_cta+.3?1+.05*Math.sin((t-p.t_cta)*9):1})`;
  }
 }
 // legenda
 let g=null;for(const G of GR){if(t>=G[0].s-.05&&t<G[G.length-1].e+.25){g=G;}}
 if(!g||!LEG||t<LEG.start||t>LEG.start+LEG.dur){CAP.style.opacity=0;}
 else{const key=g.map(w=>w.w).join("|");if(CAP.dataset.k!==key){CAP.dataset.k=key;
   CAP.innerHTML=g.map(w=>`<span class="${KW.has(clean(w.w))?"hl":""}">${esc(w.w.replace(/[.,:;]$/,""))}</span>`).join("");}
  const k=seg(t,g[0].s-.05,g[0].s+.08);CAP.style.opacity=1;CAP.style.transform=`translate(-50%,-50%) scale(${1+.25*(1-oc(k))})`;}
}
window.__hfRender=renderAt;
window.addEventListener("hf-seek",ev=>renderAt(ev.detail.time));
renderAt(0);
