<!doctype html>
<html lang="pt"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#E9C9A0;}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#E9C9A0;font-family:Oswald,Arial,sans-serif;}
#scenes{position:absolute;left:0;top:0;width:1080px;height:1920px;}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;visibility:hidden;}
.sc.first{visibility:visible;}
.cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 45%;}
.cam svg{position:absolute;left:0;top:0;}
.lay{position:absolute;left:0;top:0;width:1080px;height:1920px;}
.o{font-family:Oswald,Arial,sans-serif;font-weight:400;}
.w{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;}
.selo{font-family:Oswald,Arial,sans-serif;font-weight:400;white-space:nowrap;padding:.14em .55em .18em;border-radius:10px;letter-spacing:.02em;line-height:1.05;box-shadow:0 6px 0 rgba(0,0,0,.18);}
.grain{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;
 background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(40,25,10,.28) 100%);}
/* legenda: maiúsculas condensadas */
#leg .ed-cg{text-transform:uppercase;letter-spacing:.01em;}
#leg .ed-w.ed-k.on[data-red]{color:#E3363B !important;}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2B98E"/><stop offset=".6" stop-color="#EDD0AA"/><stop offset="1" stop-color="#F3DDBE"/></linearGradient>
  <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9876A"/><stop offset=".55" stop-color="#DDA77C"/><stop offset="1" stop-color="#EBC497"/></linearGradient>
  <linearGradient id="gMoss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46543F"/><stop offset="1" stop-color="#2F382E"/></linearGradient>
  <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2421"/><stop offset="1" stop-color="#121513"/></linearGradient>
  <linearGradient id="gPale" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF4E8"/><stop offset="1" stop-color="#F0D9B8"/></linearGradient>
  <radialGradient id="gGlow"><stop offset="0" stop-color="#FFE59A" stop-opacity=".95"/><stop offset="1" stop-color="#FFE59A" stop-opacity="0"/></radialGradient>
  <radialGradient id="gRedGlow"><stop offset="0" stop-color="#FF4A44" stop-opacity=".9"/><stop offset="1" stop-color="#FF4A44" stop-opacity="0"/></radialGradient>
 </defs>
</svg>
<div id="scenes"></div>
<div class="grain"></div>
<!--__ITEMS__-->
</div>
<script>
const EDIT = __EDIT__;
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
tl.to({v:0},{v:1,duration:__DUR__,ease:"none"},0);
window.__timelines["main"] = tl;

const C = {sky:"#E9C9A0", moss:"#3E4A3D", lead:"#2B2F2E", red:"#D7262C", mus:"#E8B23A", cream:"#F3E9D6",
  grass:"#7E9A5A", grass2:"#6A864A", soil:"#7A5C43", soil2:"#5E4634", road:"#3A3F3D", skin:"#B9784F", hair:"#241913"};
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const ROOT = document.getElementById("scenes");

/* ---------------- biblioteca SVG ---------------- */
function rafaHead(id, o={}){
  const m = o.mood || "calm";
  const brow = m === "worry" ? ['M-36,-22 L-12,-28','M12,-28 L36,-22'] : m === "scared" ? ['M-36,-30 L-12,-24','M12,-24 L36,-30'] : ['M-36,-24 L-12,-26','M12,-26 L36,-24'];
  const mouth = m === "scared" ? '<ellipse cx="0" cy="38" rx="10" ry="13" fill="#5a2a1f"/>'
    : m === "worry" ? '<path d="M-14,40 q14,-8 28,0" stroke="#6d3b2a" stroke-width="5" fill="none" stroke-linecap="round"/>'
    : '<path d="M-14,34 q14,11 28,0" stroke="#6d3b2a" stroke-width="5" fill="none" stroke-linecap="round"/>';
  return `<g id="${id}_head">
   <ellipse cx="-60" cy="6" rx="12" ry="16" fill="#A86A44"/><ellipse cx="60" cy="6" rx="12" ry="16" fill="#A86A44"/>
   <ellipse cx="0" cy="0" rx="60" ry="68" fill="${C.skin}"/>
   <path d="M-40,30 Q0,72 40,30 Q30,64 0,68 Q-30,64 -40,30Z" fill="#A86A44" opacity=".35"/>
   <path d="M-64,-4 C-72,-66 -24,-94 18,-88 C58,-82 76,-44 64,-2 C56,-28 36,-40 14,-36 C-6,-48 -40,-42 -52,-18 Z" fill="${C.hair}"/>
   <path d="M8,-36 C30,-40 50,-26 56,-6 C40,-20 24,-24 2,-26Z" fill="${C.hair}"/>
   <path d="M-10,-86 C0,-104 22,-104 30,-92 C18,-96 6,-94 -2,-84Z" fill="${C.hair}"/>
   <g id="${id}_eyes"><ellipse cx="-24" cy="4" rx="5.5" ry="8" fill="#1b1b1b"/><ellipse cx="24" cy="4" rx="5.5" ry="8" fill="#1b1b1b"/></g>
   <circle cx="-24" cy="4" r="19" fill="rgba(255,255,255,.12)" stroke="${C.lead}" stroke-width="5"/>
   <circle cx="24" cy="4" r="19" fill="rgba(255,255,255,.12)" stroke="${C.lead}" stroke-width="5"/>
   <path d="M-5,2 L5,2" stroke="${C.lead}" stroke-width="5"/>
   <path d="${brow[0]}" stroke="${C.hair}" stroke-width="6" stroke-linecap="round"/><path d="${brow[1]}" stroke="${C.hair}" stroke-width="6" stroke-linecap="round"/>
   <path d="M0,12 q7,9 0,14" stroke="#8E5536" stroke-width="4" fill="none" stroke-linecap="round"/>
   ${mouth}
  </g>`;
}
function arm(id, side, rot, len){
  const L = len || 150;
  return `<g transform="translate(${side*60},-322) rotate(${rot})"><g id="${id}">
    <rect x="-17" y="-12" width="34" height="${L*0.82}" rx="17" fill="${C.mus}"/>
    <rect x="-17" y="${L*0.62}" width="34" height="${L*0.2}" rx="8" fill="#C8962A"/>
    <circle cx="0" cy="${L*0.86}" r="17" fill="${C.skin}"/>
  </g></g>`;
}
function leg(id, side, rot){
  return `<g transform="translate(${side*22},-190) rotate(${rot})"><g id="${id}">
    <rect x="-18" y="-4" width="36" height="180" rx="14" fill="${C.lead}"/>
    <path d="M-22,170 h${side>0?52:44} a16,16 0 0 1 0,26 h-${side>0?52:44}z" transform="translate(${side>0?0:-8},0)" fill="#F2EDE4"/>
    <rect x="${side>0?-22:-30}" y="192" width="${side>0?56:48}" height="7" rx="3" fill="#8b8b85"/>
  </g></g>`;
}
function rafa(id, o){
  const p = o.pose || "stand", s = o.s || 1, f = o.flip ? -1 : 1;
  let aL = 8, aR = -8, lL = 3, lR = -3, len = 150, extra = "";
  if (p === "phone"){ aR = -165; }
  if (p === "cover"){ aL = -156; aR = 156; len = 100; }
  if (p === "run"){ aL = 30; aR = -30; lL = 22; lR = -22; }
  if (p === "reach"){ aL = -118; aR = -104; }
  if (p === "phone") extra = `<g transform="translate(${60+26},-480) rotate(-12)"><rect x="-16" y="-30" width="32" height="58" rx="6" fill="#1b1b1b"/><rect x="-12" y="-25" width="24" height="44" rx="3" fill="${C.red}"/></g>`;
  const head = `<g transform="translate(0,-420)${o.look?` rotate(${o.look})`:""}">${rafaHead(id, o)}</g>`;
  const armsBack = p === "cover" ? "" : arm(id+"_aL", -1, aL, len);
  const armsFront = p === "cover" ? arm(id+"_aL", -1, aL, len) + arm(id+"_aR", 1, aR, len) : arm(id+"_aR", 1, aR, len);
  return `<g id="${id}_pos"><g transform="translate(${o.x},${o.y}) scale(${s*f},${s})"><g id="${id}">
   <ellipse cx="0" cy="6" rx="90" ry="14" fill="rgba(0,0,0,.18)"/>
   ${leg(id+"_lL", -1, lL)}${leg(id+"_lR", 1, lR)}
   <g id="${id}_body">
    ${armsBack}
    <rect x="-14" y="-370" width="28" height="30" fill="#A86A44"/>
    <ellipse cx="0" cy="-346" rx="54" ry="20" fill="#C8962A"/>
    <rect x="-62" y="-350" width="124" height="172" rx="34" fill="${C.mus}"/>
    <rect x="-40" y="-252" width="80" height="44" rx="14" fill="#C8962A"/>
    <path d="M-12,-338 L-15,-298 M12,-338 L15,-298" stroke="#F3E9D6" stroke-width="4" stroke-linecap="round"/>
    ${head}${armsFront}${extra}
   </g>
  </g></g></g>`;
}
function house(x, y, w, h, wall, roof, lit){
  const win = lit ? "#F6D27A" : "#8FA5AA";
  const rh = h * 0.55;
  return `<g>
   <rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${wall}"/>
   <rect x="${x+w*0.62}" y="${y-h}" width="${w*0.38}" height="${h}" fill="rgba(0,0,0,.08)"/>
   <path d="M${x-14},${y-h} L${x+w/2},${y-h-rh} L${x+w+14},${y-h}Z" fill="${roof}"/>
   <path d="M${x+w/2},${y-h-rh} L${x+w+14},${y-h} L${x+w/2},${y-h}Z" fill="rgba(0,0,0,.12)"/>
   <rect x="${x+w*0.14}" y="${y-h*0.72}" width="${w*0.26}" height="${h*0.28}" fill="${win}"/>
   <rect x="${x+w*0.6}" y="${y-h*0.72}" width="${w*0.26}" height="${h*0.28}" fill="${win}"/>
   <rect x="${x+w*0.4}" y="${y-h*0.38}" width="${w*0.2}" height="${h*0.38}" fill="#6B4A36"/>
  </g>`;
}
const WALLS = ["#E3B98C","#CFA27A","#D9C3A0","#C8A88A","#E6CFA8"], ROOFS = ["#A6553A","#7C5A4A","#8E4A3A","#5E6B6A","#B0683F"];
function houses(y, n, sc_){ let o = "", x = -40; const k = sc_ || 1;
  for (let i = 0; i < n; i++){ const w = (150 + rnd()*60)*k, h = (130 + rnd()*70)*k;
    o += house(x, y, w, h, WALLS[i%5], ROOFS[(i*3)%5], false); x += w + 34*k; }
  return o; }
function car(id, x, y, color, s){
  return `<g transform="translate(${x},${y}) scale(${s||1})"><g id="${id||""}" class="car">
   <path d="M-74,-14 L-74,-42 Q-74,-50 -64,-52 L-46,-54 L-30,-82 Q-26,-88 -16,-88 L30,-88 Q40,-88 44,-80 L58,-54 L66,-52 Q76,-50 76,-40 L76,-14Z" fill="${color}"/>
   <path d="M-24,-56 L-12,-80 L8,-80 L8,-56Z M16,-56 L16,-80 L32,-80 L46,-56Z" fill="#C9DADB"/>
   <rect x="-76" y="-30" width="152" height="8" fill="rgba(0,0,0,.15)"/>
   <rect x="70" y="-46" width="8" height="10" rx="2" fill="#FFE59A"/><rect x="-78" y="-46" width="8" height="10" rx="2" class="brake" fill="${C.red}"/>
   <circle cx="-44" cy="-12" r="17" fill="#1E1F1E"/><circle cx="-44" cy="-12" r="7" fill="#9A9A92"/>
   <circle cx="46" cy="-12" r="17" fill="#1E1F1E"/><circle cx="46" cy="-12" r="7" fill="#9A9A92"/>
  </g></g>`;
}
const CARC = [C.red, C.mus, "#4F7CAC", "#6E8B4E", "#E8E2D6", "#C9683A", "#7E6AA0", "#5C6B70"];
function carRows(rows){ let o = ""; let k = 0;
  rows.forEach(r => { for (let x = r.x0; x < 1160; x += r.gap){ o += car("", x + rnd()*20, r.y, CARC[(k++)%CARC.length], r.s); } });
  return o; }
function trefoil(x, y, r, col, bg){
  let o = `<g transform="translate(${x},${y})"><circle r="${r}" fill="${bg}"/>`;
  for (let i = 0; i < 3; i++){ const a0 = (i*120 - 90 - 30)*Math.PI/180, a1 = (i*120 - 90 + 30)*Math.PI/180, R = r*0.85, r0 = r*0.22;
    o += `<path d="M${r0*Math.cos(a0)},${r0*Math.sin(a0)} L${R*Math.cos(a0)},${R*Math.sin(a0)} A${R},${R} 0 0 1 ${R*Math.cos(a1)},${R*Math.sin(a1)} L${r0*Math.cos(a1)},${r0*Math.sin(a1)} A${r0},${r0} 0 0 0 ${r0*Math.cos(a0)},${r0*Math.sin(a0)}Z" fill="${col}"/>`; }
  return o + `<circle r="${r*0.14}" fill="${col}"/></g>`;
}
function skyBg(g){ return `<rect width="1080" height="1920" fill="url(#${g||"gSky"})"/>`; }
function hatchTop(id, x, y, r){
  let riv = ""; for (let i = 0; i < 12; i++){ const a = i*30*Math.PI/180; riv += `<circle cx="${(r*0.86)*Math.cos(a)}" cy="${(r*0.86)*Math.sin(a)}" r="${r*0.035}" fill="#1E2220"/>`; }
  let sp = ""; for (let i = 0; i < 6; i++){ sp += `<rect x="-6" y="0" width="12" height="${r*0.42}" rx="6" fill="${C.mus}" transform="rotate(${i*60})"/>`; }
  return `<g transform="translate(${x},${y})"><g id="${id}">
   <circle r="${r}" fill="${C.lead}"/><circle r="${r*0.8}" fill="#4A524C"/>${riv}
   <g id="${id}_bolts">${[0,90,180,270].map(a=>`<g transform="rotate(${a})"><rect class="bolt" x="${r*0.78}" y="-${r*0.06}" width="${r*0.26}" height="${r*0.12}" rx="6" fill="#8E948C"/></g>`).join("")}</g>
   <g id="${id}_wheel"><circle r="${r*0.44}" fill="none" stroke="${C.mus}" stroke-width="${r*0.07}"/>${sp}<circle r="${r*0.1}" fill="${C.mus}"/></g>
  </g></g>`;
}
function brickWall(x, y, w, h, col){
  let o = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col||"#CDB08C"}"/><rect x="${x-8}" y="${y-18}" width="${w+16}" height="24" fill="#B79A76"/>`;
  for (let r = 0, yy = y + 44; yy < y + h; yy += 44, r++){ o += `<rect x="${x}" y="${yy}" width="${w}" height="4" fill="rgba(0,0,0,.08)"/>`;
    for (let xx = x + (r%2 ? 60 : 0); xx < x + w; xx += 120) o += `<rect x="${xx}" y="${yy-44}" width="4" height="44" fill="rgba(0,0,0,.07)"/>`; }
  return o;
}
function selo(id, x, y, txt, bg, fg, size){
  return `<div class="w" style="left:${x}px;top:${y}px"><div id="${id}" class="selo" style="background:${bg};color:${fg};font-size:${size||46}px">${txt}</div></div>`;
}

/* ---------------- animações utilitárias ---------------- */
function pop(sel, t){ tl.fromTo(sel, {scale:0.4, opacity:0}, {scale:1, opacity:1, duration:0.35, ease:"back.out(2)", immediateRender:true}, t); }
function blink(sel, s, e){ for (let t = s + 0.6; t < e - 0.2; t += 2.2){ tl.to(sel, {scaleY:0.1, duration:0.06, transformOrigin:"50% 50%"}, t); tl.to(sel, {scaleY:1, duration:0.08}, t + 0.08); } }
function breathe(sel, s, e){ const per = 1.2, n = Math.max(1, Math.ceil((e - s)/per));
  tl.fromTo(sel, {scaleY:1}, {scaleY:1.022, duration:per/2, ease:"sine.inOut", yoyo:true, repeat:n*2-1, transformOrigin:"50% 100%", immediateRender:false}, s); }
function bobY(sel, s, e, amp, per){ const n = Math.max(1, Math.ceil((e - s)/per));
  tl.fromTo(sel, {y:0}, {y:-(amp||4), duration:per/2, ease:"sine.inOut", yoyo:true, repeat:n*2-1, immediateRender:false}, s); }
function shake(sel, t, d, a){ const n = Math.round(d/0.05); tl.fromTo(sel, {x:-(a||10)}, {x:(a||10), duration:0.05, repeat:n, yoyo:true, ease:"none", immediateRender:false}, t); tl.set(sel, {x:0}, t + 0.05*(n+1)); }
function idleRafa(id, s, e){ blink(`#${id}_eyes`, s, e); breathe(`#${id}_body`, s, e); }
function rainDrops(id, n, col, w, h, len){ let o = `<g id="${id}">`;
  for (let k = 0; k < 2; k++) for (let i = 0; i < n; i++){ const x = rnd()*1080, y = rnd()*1920 - k*1920;
    o += len ? `<rect x="${x}" y="${y}" width="${w}" height="${len}" rx="${w/2}" fill="${col}"/>` : `<circle cx="${x}" cy="${y}" r="${w*(0.6+rnd()*0.8)}" fill="${col}"/>`; }
  return o + `</g>`; }
function fall(sel, s, e, per){ const n = Math.max(1, Math.ceil((e - s)/per)); tl.fromTo(sel, {y:0}, {y:1920, duration:per, ease:"none", repeat:n-1, immediateRender:false}, s); }

/* ---------------- cenas ---------------- */
const SC = {};
SC.rua_sirene = (it, X, T, s, e, I) => ({
  svg: skyBg() + `<rect y="820" width="1080" height="1100" fill="${C.road}"/><rect y="820" width="1080" height="46" fill="#C9B08F"/>`
   + houses(822, 7) + `<g id="${I("red")}" opacity="0"><rect width="1080" height="1920" fill="${C.red}"/></g>`
   + `<g transform="translate(120,0)"><rect x="-9" y="430" width="18" height="430" fill="${C.lead}"/><rect x="-48" y="400" width="96" height="58" rx="10" fill="${C.lead}"/>
      <circle id="${I("ring1")}" cx="0" cy="430" r="40" fill="none" stroke="${C.red}" stroke-width="8"/><circle id="${I("ring2")}" cx="0" cy="430" r="40" fill="none" stroke="${C.red}" stroke-width="8"/>
      <circle id="${I("lamp")}" cx="0" cy="430" r="22" fill="${C.red}"/></g>`
   + carRows([{y:1010, x0:-30, gap:178, s:1.05}, {y:1200, x0:40, gap:190, s:1.2}, {y:1470, x0:-60, gap:210, s:1.4}]),
  html: selo(I("selo"), 540, 340, X.selo, C.mus, C.lead, 92),
  anim(){ [I("ring1"), I("ring2")].forEach((r, k) => tl.fromTo("#"+r, {scale:1, opacity:1, transformOrigin:"50% 50%"}, {scale:5, opacity:0, duration:0.9, repeat:Math.ceil((e-s)/0.9), ease:"power1.out", immediateRender:false}, s + k*0.45));
    tl.fromTo("#"+I("red"), {opacity:0}, {opacity:0.16, duration:0.45, yoyo:true, repeat:Math.ceil((e-s)/0.45), ease:"sine.inOut", immediateRender:false}, s);
    tl.set("#"+I("selo"), {opacity:0}, 0); pop("#"+I("selo"), T.min15 - 0.05); }
});
SC.cronometro = (it, X, T, s, e, I) => {
  let ticks = ""; for (let i = 0; i < 60; i++) ticks += `<rect x="-3" y="-205" width="6" height="${i%5?14:30}" fill="${C.lead}" transform="rotate(${i*6})"/>`;
  return { svg: skyBg() + `<rect y="980" width="1080" height="940" fill="#CDAE7E"/><path d="M500,980 L580,980 L1060,1920 L20,1920Z" fill="${C.road}"/>`
   + `<path d="M540,1000 L540,1920" stroke="${C.mus}" stroke-width="14" stroke-dasharray="70 70"/>` + houses(982, 9, 0.55)
   + `<g transform="translate(540,690)"><rect x="-34" y="-290" width="68" height="46" rx="10" fill="${C.lead}"/><circle r="250" fill="${C.lead}"/><circle r="222" fill="${C.cream}"/>
      <path id="${I("pie")}" d="M0,0 L0,-222 A222,222 0 0 1 0,-222Z" fill="${C.mus}" opacity=".55"/>${ticks}
      <text class="o" y="40" text-anchor="middle" font-size="120" fill="${C.lead}" id="${I("txt")}">${X.relogio}</text>
      <g id="${I("hand")}"><rect x="-5" y="-190" width="10" height="190" rx="5" fill="${C.red}"/><circle r="16" fill="${C.red}"/></g></g>`,
   html: selo(I("selo"), 540, 330, X.selo, C.mus, C.lead, 54),
   anim(){ pop("#"+I("selo"), s + 0.1); tl.fromTo("#"+I("hand"), {rotation:0, transformOrigin:"50% 92%"}, {rotation:300, transformOrigin:"50% 92%", duration:e - s, ease:"none", immediateRender:false}, s);
     const o = {a:0}; tl.to(o, {a:300, duration:e - s, ease:"none", onUpdate(){ const a = o.a*Math.PI/180, R = 222; const el = document.getElementById(I("pie"));
       el.setAttribute("d", `M0,0 L0,-222 A222,222 0 ${o.a>180?1:0} 1 ${R*Math.sin(a)},${-R*Math.cos(a)}Z`); }}, s); }
  };
};
SC.encruzilhada = (it, X, T, s, e, I) => ({
  svg: skyBg() + houses(1000, 9, 0.6) + `<rect y="1000" width="1080" height="920" fill="${C.grass}"/>`
   + `<path d="M0,1180 L1080,1120 L1080,1260 L0,1330Z" fill="#B99C74"/><path d="M470,1000 L610,1000 L760,1920 L320,1920Z" fill="#B99C74"/>`
   + `<g transform="translate(830,1260)"><rect x="-10" y="-430" width="20" height="440" fill="#6B4A36"/>
      <path d="M-200,-410 L60,-410 L60,-340 L-200,-340 L-236,-375Z" fill="${C.cream}"/><text class="o" x="-80" y="-358" text-anchor="middle" font-size="46" fill="${C.lead}">${X.p1}</text>
      <path d="M-30,-320 L210,-320 L246,-285 L210,-250 L-30,-250Z" fill="${C.cream}"/><text class="o" x="95" y="-268" text-anchor="middle" font-size="46" fill="${C.lead}">${X.p2}</text>
