const ov=document.getElementById("ov");const svg=document.getElementById("arrow");

const ARC=[];{const a=V(TIP.x,TIP.y+0.25,CZ),c=V(0.35,TIP.y+1.3,CZ),b=V(JX,TOP+JH+0.55,CZ);for(let i=0;i<=40;i++){const u=i/40;ARC.push(V((1-u)*(1-u)*a.x+2*u*(1-u)*c.x+u*u*b.x,(1-u)*(1-u)*a.y+2*u*(1-u)*c.y+u*u*b.y,CZ));}}

const tmpC=new THREE.Color();
function renderAt(tt){
  const L=cam(tt,camera);follow(L);
  // boneco suando, cabeça balança
  sweat.forEach((d,k)=>{const u=((tt*0.7+k/4)%1);d.position.set((k%2?0.14:-0.14),0.2-u*0.35,0.12);d.scale.setScalar(tt<tC+2?1-u*0.6:0.0001);});

  // balde: some na troca; gelo derrete
  const out=K.seg(tt,kTroca,kTroca+0.5);bucket.scale.setScalar(Math.max(1e-4,1-out));
  const melt=K.seg(tt,tB+0.2,kTroca-0.2);ice.forEach((c,k)=>{c.scale.setScalar(1-melt*0.55);c.position.y=0.62-melt*0.25+((k/3)|0)*0.05*(1-melt);});water.position.y=0.1+melt*0.25;water.scale.y=1+melt*8;
  // recipiente

  const lvl=JH*(1-0.88*K.seg(tt,kEvap,kEvap+1.6))*(tt>=tJ?(1-0.88)+0.88*K.seg(tt,tJ+2.2,tJ+3.6):1);
  liquid.scale.y=Math.max(0.02,lvl);liquid.position.y=0.12+lvl/2;
  const boil=tt<kFerv?0.25:1;bub.forEach(b=>{const u=((tt*b.userData.sp*(0.5+boil)+b.userData.o)%1);b.position.set(b.userData.x,0.15+u*lvl,b.userData.z);b.scale.setScalar(tt>=kJarra&&u*JH<lvl?(0.5+u)*boil+0.3:0.0001);});
  // serpentina cresce
  const g=K.seg(tt,kSerp-0.1,kSerp+1.3);coilGeo.setDrawRange(0,Math.floor(g*TSEG)*RSEG*6);coil.visible=g>0;rack.visible=g>0;rack.scale.setScalar(Math.max(1e-4,K.back((tt-kSerp+0.2)/0.4)));
  // bolinhas no cano: líquido azul -> gás branco
  const flow=tt>=kSerp+1.0&&tt<tL+1.5;cb.forEach((b,k)=>{const u=((tt*0.07+k/cb.length)%1);const p=curve.getPointAt(Math.min(u,0.999));b.position.copy(p);
    const gas=u>0.82?1:0;b.material=K.mat(gas?"#ffffff":"#3d8fe8");b.scale.setScalar(flow&&!(tt>=kEvap&&tt<tJ+2.5&&u<1-0.88*K.seg(tt,kEvap,kEvap+1.6)*0.9)?1:0.0001);});
  // fumaça de gás saindo da ponta
  const gasOn=tt>=kVira&&tt<DUR;puffs.forEach((m,k)=>{const u=((tt*0.38+k/puffs.length)%1);m.position.set(TIP.x+Math.sin(u*7+k)*0.18*u,TIP.y+0.1+u*1.6,CZ+Math.cos(u*5+k)*0.15*u);
    m.scale.setScalar(gasOn?(0.35+u*1.1):0.0001);m.material.opacity=1-u*0.9;m.rotation.set(u*3,k,u*2);m.visible=gasOn&&tt<tL+2;});
  // ventilador
  const fanOn=tt<kTroca+0.5||tt>=kVent-0.3;blades.rotation.z=fanOn?tt*14:0;
  // vento: riscos (laranja antes do frio, azul depois)
  const windA=K.win(tt,0.2,kTroca,0.4,0.3),windF=K.win(tt,kVent,tL+0.5,0.4,0.4);
  wind.forEach((w,k)=>{const s=wSeed[k];const u=((tt*0.55+s.o)%1);let x,y,z,on=0;const cold=(windA>0&&x<-0.6);
    x=2.4-u*5.6;y=TOP+0.25+s.y*1.0;z=-1.1+s.z*1.0;on=Math.max(windA,windF);
    const coldNow=windA>0?x<-0.6:(tt>=kGelado-0.2&&x<CX0);
    WI.set(k,x,y,z,0,on*(0.6+0.8*Math.sin(u*Math.PI)),on>0?1:1e-4,on>0?1:1e-4);WI.meshes[0].setColorAt(k,tmpC.set(coldNow?"#5fb8ff":"#ffb067"));});
  WI.done();WI.meshes[0].instanceColor.needsUpdate=true;
  // calor: bolinhas laranja indo pro gelo/líquido, depois soltas no ar
  const tgt=tt<kTroca+0.4?V(-0.6,TOP+0.6,-0.6):(tt<kSerp?V(-0.75,TOP+0.7,-0.6):curve.getPointAt(0.45));
  const toIce=K.win(tt,0.4,tF+0.5,0.5,0.5)+K.win(tt,kSerp+1,tH,0.5,0.5);
  const release=K.win(tt,tK,tL+1.0,0.4,0.4),ambient=K.win(tt,tL+1.0,tM+0.6,0.6,0.5);
  heat.forEach((h,k)=>{const s=hSeed[k];let x=0,y=0,z=0,sc=0;
    if(toIce>0.01){const u=((tt*0.3+s.o)%1);const sx=tgt.x+Math.cos(s.a)*(1.6+s.b*1.4),sy=TOP+0.2+s.c*1.8,sz=tgt.z-0.2+Math.sin(s.a)*0.7;
      const e=K.io(u);x=K.lerp(sx,tgt.x,e);y=K.lerp(sy,tgt.y,e)+Math.sin(u*3.14)*0.3;z=K.lerp(sz,tgt.z,e);sc=toIce*(u>0.88?(1-u)*8:1);}
    else if(release>0.01){const u=((tt*0.35+s.o)%1);const r=0.3+u*2.2;x=TIP.x+Math.cos(s.a)*r;y=TIP.y+0.9+(s.c-0.4)*1.4*u;z=CZ+Math.sin(s.a)*r*0.7;sc=release*(1-u*0.6);}
    else if(ambient>0.01){x=-5+s.a/6.28*10;y=0.9+s.c*3.0+Math.sin(tt*2+k)*0.15;z=-3.4+s.b*6.5;sc=ambient;if(k%3==0){x=7+s.b*7;z=1+s.c*5;y=0.8+s.b*2.5+Math.sin(tt*2+k)*0.15;}}
    HB.set(k,x,y,z,0,Math.max(sc*0.7,1e-4));});HB.done();
  // tubo até o compressor
  pipe2.geometry.setDrawRange(0,Math.floor(K.seg(tt,tM-0.2,tM+1.2)*200)*8*6);pipe2.visible=tt>=tM-0.2;
  // pistão espreme; gás esquenta
  const sq=K.seg(tt,kEsp,kEsp+0.9);piston.position.y=0.12+PH-0.1-sq*0.9;const top=piston.position.y-0.1;
  gb.forEach(b=>{b.position.set(b.userData.x*(1-sq*0.15),0.2+b.userData.f*(top-0.3),b.userData.z*(1-sq*0.15));b.material=K.mat(tt>=kQuente?"#ff7a1f":"#3d8fe8");});

  renderer.render(scene,camera);

    if(pts.length>1){const d="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
      svgS=`<g opacity="${aOn}"><path d="${d}" fill="none" stroke="#1b1b1b" stroke-width="16" stroke-linecap="round" stroke-dasharray="34 22"/><path d="${d}" fill="none" stroke="#ffd21f" stroke-width="9" stroke-linecap="round" stroke-dasharray="34 22"/>`;
      if(k>=40){const p=pts[pts.length-1],q=pts[pts.length-4];const ang=Math.atan2(p[1]-q[1],p[0]-q[0])*180/Math.PI;svgS+=`<g transform="translate(${p[0]},${p[1]}) rotate(${ang})"><path d="M8 0 L-34 -24 L-34 24 Z" fill="#ffd21f" stroke="#1b1b1b" stroke-width="5"/></g>`;}
      svgS+="</g>";}}
  svg.innerHTML=svgS;
  LAB.update(tt,proj);if(CAP)CAP.update(tt);
}
